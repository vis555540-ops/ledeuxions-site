<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a2238">
<meta name="description" content="LeDeuxions 픽셀 사무실 — 도면과 모형을 걸어 두고, 얼굴 없이 목소리와 화면으로 만나는 자리.">
<title>LeDeuxions 사무실</title>
<link rel="canonical" href="https://ledeuxions.com/사무실/">
<style>
/* 배치: 전체 화면 무대(픽셀 캔버스) + 모서리 상태표 + 아래 조작 막대 + 가운데 창(입장·작품·편집·화면). 단일 어두운 테마. */
@font-face{font-family:'Galmuri11';src:url(./Galmuri11.woff2) format('woff2');font-display:swap}
:root{
  color-scheme:dark;
  --바탕:#1a2238; --잉크:#ece7da; --흐림:#98a0b8; --선:#2e3852; --판:#111827; --판2:#1c2640;
  --강조:#e3b65a; --위험:#d9655a; --좋음:#7fc47f;
  --글꼴:'Galmuri11',-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  --코드:ui-monospace,Menlo,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--바탕);color:var(--잉크);font:12px/1.5 var(--글꼴);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#무대{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:44px 8px 86px;padding-top:calc(44px + env(safe-area-inset-top,0px));padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
#틀{position:relative;box-shadow:0 0 0 1px #0d1222,0 18px 40px rgba(0,0,0,.45)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#겹층{position:absolute;inset:0;pointer-events:none}
.이름표{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:11px;line-height:1;padding:3px 5px;background:rgba(10,14,26,.74);color:var(--잉크);border-radius:3px}
.이름표.나{color:var(--강조)}
.이름표[data-mic="on"]::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--흐림);margin-right:4px;vertical-align:1px}
.이름표[data-mic="on"].말함::before{background:var(--좋음);box-shadow:0 0 4px var(--좋음)}
.이름표[data-scr="on"]::after{content:" ▣";color:var(--강조)}
.말풍선{position:absolute;transform:translate(-50%,-100%);max-width:170px;font-size:11px;line-height:1.35;padding:5px 7px;background:#f3efe4;color:#1a1a22;border-radius:6px;word-break:break-word;white-space:pre-wrap}
.말풍선::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-4px;border:4px solid transparent;border-top-color:#f3efe4;border-bottom:0}
.자리표{position:absolute;transform:translate(-50%,-50%);font-size:10px;line-height:1;padding:3px 5px;background:var(--강조);color:#1a1a22;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.4)}
.자리표.빈{background:var(--판2);color:var(--강조);border:1px solid var(--강조)}
#상태{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;max-width:calc(100% - 140px);font-size:11px;line-height:1.3;padding:6px 9px;background:rgba(10,14,26,.7);border:1px solid var(--선);border-radius:4px;color:var(--잉크);word-break:keep-all}
#상태[data-종류="오류"]{border-color:var(--위험);color:#f0b0a8}
#집{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;font-size:11px;padding:6px 9px;background:rgba(10,14,26,.7);border:1px solid var(--선);border-radius:4px;color:var(--흐림);text-decoration:none}
#집:hover{color:var(--잉크)}
#안내{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));margin:0;text-align:center;color:var(--흐림);font-size:11px;pointer-events:none;padding:0 16px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#막대{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(10,14,26,.85) 40%)}
button{font:inherit;font-size:12px;color:var(--잉크);background:var(--판2);border:1px solid var(--선);border-radius:4px;padding:8px 12px;cursor:pointer;min-height:36px;line-height:1.2}
button:hover{border-color:var(--흐림)}
button:focus-visible{outline:2px solid var(--강조);outline-offset:1px}
button.켜짐{background:var(--강조);color:#1a1a22;border-color:var(--강조)}
button.주요{background:var(--잉크);color:#1a1a22;border-color:var(--잉크)}
button.위험{border-color:var(--위험);color:#f0b0a8}
button:disabled{opacity:.45;cursor:default}
.창{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,9,18,.8);padding:16px;z-index:20}
.창>.상자{background:var(--판);border:1px solid var(--선);border-radius:8px;padding:16px;width:min(100%,380px);max-height:100%;overflow:auto;display:grid;gap:10px;box-sizing:border-box}
.상자 h2{margin:0;font-size:14px;font-weight:normal;color:var(--강조)}
.상자 p{margin:0;color:var(--흐림);font-size:11px}
label{display:grid;gap:4px;font-size:11px;color:var(--흐림)}
input,textarea{font:inherit;font-size:13px;color:var(--잉크);background:var(--바탕);border:1px solid var(--선);border-radius:4px;padding:8px 10px;width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--강조);outline-offset:0;border-color:var(--강조)}
textarea{font-family:var(--코드);font-size:11px;min-height:200px;resize:vertical;white-space:pre}
.줄{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.줄>button{flex:1}
.줄>span{flex:1;min-width:0;font-size:11px;color:var(--흐림)}
#창-작품>.상자{width:min(100%,760px)}
#작품내용{min-height:120px;display:flex;align-items:center;justify-content:center;background:#0b0f1c;border-radius:4px;overflow:hidden}
#작품내용 img{max-width:100%;max-height:62vh;display:block;image-rendering:auto}
#작품내용 model-viewer{width:100%;height:min(62vh,520px);background:#e9e6de}
#작품내용 .없음{padding:28px 12px;color:var(--흐림);text-align:center}
.설명{font-size:12px;line-height:1.5}
.설명 b{color:var(--강조);font-weight:normal}
.설명 .날짜{color:var(--흐림);margin-left:6px}
.설명 .메모{display:block;color:var(--잉크);opacity:.85;white-space:pre-wrap}
#창-화면>.상자{width:min(100%,1100px);padding:8px}
#큰화면{width:100%;max-height:78vh;display:block;background:#000;border-radius:4px}
#채팅{position:fixed;left:12px;bottom:calc(62px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 24px));display:grid;gap:6px;z-index:10}
#채팅기록{max-height:120px;overflow:auto;font-size:11px;background:rgba(10,14,26,.72);border:1px solid var(--선);border-radius:4px;padding:6px 8px;display:grid;gap:2px;-webkit-user-select:text;user-select:text}
#채팅기록:empty{display:none}
#채팅기록 b{color:var(--강조);font-weight:normal}
#채팅기록 .알림{color:var(--흐림)}
#미리보기{max-width:100%;max-height:140px;display:block;margin:0 auto;border-radius:4px;background:#0b0f1c}
#숨김{position:fixed;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="무대"><div id="틀"><canvas id="캔버스" width="480" height="270"></canvas><div id="겹층"></div></div></div>
<div id="상태" aria-live="polite">둘러보는 중</div>
<a id="집" href="/">← LeDeuxions</a>
<p id="안내"></p>
<div id="막대">
  <button id="버튼-입장" class="주요">입장</button>
  <button id="버튼-마이크" hidden>마이크 켜기</button>
  <button id="버튼-화면" hidden>화면 공유</button>
  <button id="버튼-채팅" hidden>채팅</button>
  <button id="버튼-나가기" hidden>나가기</button>
  <button id="버튼-편집" hidden>작품 편집</button>
  <button id="버튼-JSON" hidden>JSON 보기</button>
</div>
<div id="채팅" hidden>
  <div id="채팅기록"></div>
  <input id="채팅입력" placeholder="메시지 · Enter 보내기 · Esc 닫기" maxlength="200" autocomplete="off">
</div>

<div id="창-입장" class="창" hidden>
  <div class="상자">
    <h2>사무실 입장</h2>
    <p>이름만 있으면 됩니다. 카메라는 쓰지 않습니다. 마이크·화면 공유는 입장 후 직접 켭니다.</p>
    <label>이름<input id="입장이름" maxlength="16" placeholder="손님" autocomplete="nickname"></label>
    <label>방 코드<input id="입장방" maxlength="32" placeholder="main" autocomplete="off"></label>
    <p id="입장안내">같은 방 코드를 쓰는 사람끼리 만납니다. 주소에 <span style="font-family:var(--코드)">?방=코드</span>를 붙여 공유하면 됩니다.</p>
    <div class="줄"><button id="입장확인" class="주요">입장</button><button id="입장취소">둘러보기만</button></div>
  </div>
</div>

<div id="창-작품" class="창" hidden>
  <div class="상자">
    <div id="작품내용"></div>
    <div class="설명" id="작품설명"></div>
    <div class="줄"><button id="작품이전">← 이전</button><button id="작품다음">다음 →</button><button id="작품닫기">닫기</button></div>
  </div>
</div>

<div id="창-편집" class="창" hidden>
  <div class="상자">
    <h2 id="편집제목">자리</h2>
    <img id="미리보기" alt="" hidden>
    <label>파일 경로 또는 URL (이미지 · .glb)<input id="편집파일" placeholder="작품/모형-01.jpg" autocomplete="off"></label>
    <label>기기에서 파일 고르기 (미리보기용 · 실제 파일은 위 경로에 올려야 합니다)<input id="편집선택" type="file" accept="image/*,.glb,.gltf"></label>
    <label>썸네일 사진 (.glb 모형일 때만 · 선택)<input id="편집사진" placeholder="작품/모형-01.png" autocomplete="off"></label>
    <label>제목<input id="편집제목입력" maxlength="60" autocomplete="off"></label>
    <label>메모<input id="편집메모" maxlength="200" autocomplete="off"></label>
    <label>날짜<input id="편집날짜" maxlength="20" placeholder="2026-10" autocomplete="off"></label>
    <div class="줄"><button id="편집저장" class="주요">저장</button><button id="편집비우기" class="위험">비우기</button><button id="편집닫기">닫기</button></div>
  </div>
</div>

<div id="창-JSON" class="창" hidden>
  <div class="상자">
    <h2>gallery.json</h2>
    <p>이 내용을 index.html 옆에 <span style="font-family:var(--코드)">gallery.json</span>으로 올리면 모든 방문자에게 보입니다. 초안은 이 브라우저에만 저장됩니다.</p>
    <textarea id="JSON내용" readonly spellcheck="false"></textarea>
    <div class="줄"><button id="JSON복사" class="주요">복사</button><button id="JSON내려받기">내려받기</button><button id="JSON초안지우기" class="위험">초안 지우기</button><button id="JSON닫기">닫기</button></div>
    <p id="JSON알림"></p>
  </div>
</div>

<div id="창-화면" class="창" hidden>
  <div class="상자">
    <video id="큰화면" autoplay playsinline muted></video>
    <div class="줄"><span id="큰화면설명"></span><button id="큰화면닫기">닫기</button></div>
  </div>
</div>

<div id="숨김" aria-hidden="true"></div>
<script src="./peerjs.min.js"></script>
<script>
(function(){
"use strict";

/* ===================== 0. 설정 (여기만 고치면 됩니다) ===================== */
const 설정={
  방기본:"main",
  최대인원:8,                       // 한 방 자리 수 (P2P 메시 구조라 8명 이상은 권장하지 않음)
  접두:"ldx-office",                 // PeerJS ID 접두어 — 다른 사이트와 겹치지 않게
  PeerServer:null,                   // null = 공용 PeerServer(0.peerjs.com). 자체 서버: {host:"ledeuxions.com", port:443, path:"/peer", secure:true}
  ICE:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}], // TURN이 필요하면 {urls:"turn:...",username,credential} 추가
  갤러리파일:"gallery.json",
  모형뷰어:"https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js", // .glb 열 때만 불러옴
  걷기속도:62                        // px/초 (논리 해상도 기준)
};
if(window.사무실설정&&typeof window.사무실설정==="object") Object.assign(설정,window.사무실설정); // 테스트·배포 시 외부에서 덮어쓰기 가능

/* ===================== 1. 무대 좌표 ===================== */
const 폭=480, 높이=270;
const 방={x:16,y:22,w:448,h:236};
const 벽높이=74, 벽끝=방.y+벽높이;                     // 벽끝 = 96
const 바닥={x1:방.x+4, y1:벽끝+4, x2:방.x+방.w-4, y2:방.y+방.h-4};
const 입구={x:240,y:244};
const 창문={x:34,y:32,w:72,h:48};
const 시계={x:326,y:46};
const 자리={
  벽1:{이름:"벽1",종류:"벽",영역:{x:124,y:36,w:40,h:32},서는곳:{x:144,y:108}},
  벽2:{이름:"벽2",종류:"벽",영역:{x:174,y:32,w:36,h:44},서는곳:{x:192,y:108}},
  벽3:{이름:"벽3",종류:"벽",영역:{x:220,y:36,w:48,h:34},서는곳:{x:244,y:108}},
  벽4:{이름:"벽4",종류:"벽",영역:{x:278,y:32,w:38,h:40},서는곳:{x:297,y:108}},
  좌대1:{이름:"좌대1",종류:"좌대",영역:{x:132,y:108,w:30,h:46},서는곳:{x:147,y:168}},
  좌대2:{이름:"좌대2",종류:"좌대",영역:{x:308,y:108,w:30,h:46},서는곳:{x:323,y:168}}
};
const 자리순서=["벽1","벽2","벽3","벽4","좌대1","좌대2"];
const 스크린={이름:"스크린",종류:"스크린",영역:{x:336,y:28,w:112,h:63},서는곳:{x:392,y:112}};
// 앉을 자리: 가운데 탁자 6개(손님용) + 책상 의자 1개(주인=형 전용). 좌표는 아래 가구의 의자() 호출 위치와 같다.
const 좌석=[
  {이름:"손님-왼",  종류:"의자",주인:false,자리:{x:186,y:180},방향:"right",서는곳:{x:170,y:180},영역:{x:176,y:146,w:20,h:38}},
  {이름:"손님-오른",종류:"의자",주인:false,자리:{x:294,y:180},방향:"left", 서는곳:{x:310,y:180},영역:{x:284,y:146,w:20,h:38}},
  {이름:"손님-위1", 종류:"의자",주인:false,자리:{x:218,y:150},방향:"down",서는곳:{x:218,y:132},영역:{x:208,y:116,w:20,h:38}},
  {이름:"손님-위2", 종류:"의자",주인:false,자리:{x:262,y:150},방향:"down",서는곳:{x:262,y:132},영역:{x:252,y:116,w:20,h:38}},
  {이름:"손님-아래1",종류:"의자",주인:false,자리:{x:218,y:212},방향:"up",  서는곳:{x:218,y:226},영역:{x:208,y:178,w:20,h:38}},
  {이름:"손님-아래2",종류:"의자",주인:false,자리:{x:262,y:212},방향:"up",  서는곳:{x:262,y:226},영역:{x:252,y:178,w:20,h:38}},
  {이름:"주인",     종류:"의자",주인:true, 자리:{x:76,y:234}, 방향:"up",  서는곳:{x:76,y:248}, 영역:{x:66,y:200,w:20,h:38}}
];
const 주인석=좌석.find(s=>s.주인);
const 상호작용들=자리순서.map(k=>자리[k]).concat([스크린]).concat(좌석);

/* ===================== 2. 캔버스 ===================== */
const 보기=document.getElementById("캔버스"), vc=보기.getContext("2d");
const 판=document.createElement("canvas"); 판.width=폭; 판.height=높이;
const c=판.getContext("2d");
const 틀=document.getElementById("틀"), 겹층=document.getElementById("겹층"), 무대=document.getElementById("무대");
let 배율=1, 보임={w:폭,h:높이};
const 카메라={x:0,y:0};
function 크기(){
  const r=무대.getBoundingClientRect();
  const cs=getComputedStyle(무대);
  const w=Math.max(120,r.width-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight));
  const h=Math.max(120,r.height-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom));
  const 맞춤=Math.min(w/폭,h/높이);
  if(맞춤>=1){ 배율=맞춤>=2?Math.floor(맞춤*2)/2:맞춤; 보임={w:폭,h:높이}; }
