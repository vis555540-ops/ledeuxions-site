<style>

<script>
(() => {
'use strict';
const DAY = 86400000;
const DEBUG = new URLSearchParams(location.search).get('debug') === '1';   // 시험 단추는 ?debug=1 일 때만
const cv = document.getElementById('c'); let ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, SKY = 0;     // SKY = 수면 높이 (위 1/4 하늘)
const FLOW = 9;                          // 바다가 흘러가는 빠르기 (px/초) — 고래는 늘 오른쪽으로

// ---------- 그림 (새 그림은 sprites/ 에 같은 이름으로 덮어쓰면 끝. 모두 오른쪽 보는 투명 PNG) ----------
const SPRITES = {
  stage1: 'stage1.png', stage2: 'stage2.png', stage3: 'stage3.png', stage4: 'stage4.png', stage5: 'adult_glide.png', stage6: 'adult_glide.png',
  baby_glide: 'baby_glide.png', baby_rise: 'baby_rise.png', baby_dive: 'baby_dive.png', baby_spout: 'baby_spout.png',

  // 어른(5~6단계) — art/adult_swim8_v2.jpeg (11/13 재미나이, 작은 눈·오른쪽)
  ad_glide: 'adult_glide.png', ad_spout: 'adult_turn.png', ad_sing: 'adult_breach.png', ad_wave: 'adult_spout.png', ad_roll: 'adult_rise.png', ad_breach: 'adult_tailup.png',
};
const IMG = {}; let loaded = 0; const NSPR = Object.keys(SPRITES).length;
for (const k in SPRITES) { const i = new Image(); i.onload = i.onerror = () => loaded++; i.src = 'sprites/' + SPRITES[k]; IMG[k] = i; }
// 자세 묶음: 기본 / 가끔 / 기쁨 / 올라갈 때 / 물뿜기
const SETS = {
  baby: { base: 'baby_glide', extra: ['baby_tailup', 'baby_taildown'], happy: 'baby_spout', rise: 'baby_rise', spout: 'baby_spout' },
  juv:  { base: 'juv_glide',  extra: ['juv_dive'], happy: 'juv_happy', rise: 'juv_rise', spout: 'juv_spout' },
  adult: { base: 'ad_glide', extra: ['ad_wave', 'ad_roll'], happy: 'ad_sing', rise: 'ad_breach', spout: 'ad_spout' },
};
const setFor = st => st <= 2 ? SETS.baby : st <= 4 ? SETS.juv : SETS.adult;
const SIZE = [0.34, 0.41, 0.48, 0.56, 0.64, 0.76];
// 꼬리 흔들기 세기 (꼬리가 왼쪽에 있는 자세는 크게)
const WAVE = { baby_glide: 1, baby_spout: .8, baby_taildown: .7, juv_glide: 1, juv_spout: .8, juv_happy: .5, stage1: .6, stage2: .9, stage3: 1, stage4: 1, stage5: 1, stage6: 1, ad_glide: 1, ad_spout: .8, ad_sing: .8, ad_wave: .6, ad_roll: .4, ad_breach: .4 };

// ---------- 저장 ----------
const KEY = 'slowwhale.v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
let S = load();
const fresh = !S;
if (!S) S = { name: '', born: Date.now(), offset: 0, last: Date.now(), feedDay: '', feeds: 0,
              trash: [], trashDay: '', eventDay: '', cleaned: 0, sound: false, stageSeen: 1 };
const now = () => Date.now() + (S.offset || 0);
const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
const daysOld = () => Math.max(0, Math.floor((now() - S.born) / DAY));
const stageOf = d => Math.min(6, 1 + Math.floor(d / 30));   // 한 달에 한 단계 (6단계 ≈ 5달)
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mixC = (p, q, k) => p.map((v, j) => Math.round(v + (q[j] - v) * k));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ---------- 여행길 (혹등고래처럼 크게 한 바퀴 = 12주) ----------
const ROUTE = [
  [131, 37.5, '동해'], [140.5, 41.6, '쓰가루 해협'], [150, 45, '쿠릴 열도'], [165, 52, '캄차카 앞바다'],
  [-178, 51.5, '알류샨 열도'], [-152, 56.5, '알래스카 앞바다'], [-140, 42, '북태평양 한가운데'], [-156, 20.5, '하와이'],
  [-178, 25, '미드웨이'], [150, 28, '오가사와라'], [132, 31.5, '규슈 남쪽 바다'], [129.5, 34.5, '대한해협']];
const LOOP_DAYS = 84;
const km = (a, b) => { const R = 6371, r = Math.PI / 180, dLa = (b[1] - a[1]) * r, dLo = (b[0] - a[0]) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
const SEG = ROUTE.map((p, i) => km(p, ROUTE[(i + 1) % ROUTE.length]));
const LOOP_KM = SEG.reduce((a, b) => a + b, 0);
const px = lon => ((lon - 150 + 540) % 360) - 180;    // 태평양 가운데 지도
function journey() {
  const loops = Math.max(0, (now() - S.born) / (LOOP_DAYS * DAY));
  let d = (loops % 1) * LOOP_KM, i = 0;
  while (d > SEG[i]) { d -= SEG[i]; i++; }
  const a = ROUTE[i], b = ROUTE[(i + 1) % ROUTE.length], f = d / SEG[i];
  let xa = px(a[0]), xb = px(b[0]);
  const x = xa + (xb - xa) * f, lat = a[1] + (b[1] - a[1]) * f;
  const label = f > .85 ? b[2] + '에 거의 다 왔어요' : f < .08 ? a[2] + ' 지나는 중' : b[2] + ' 가는 중';
  return { x, lat, label, km: Math.round(loops * LOOP_KM), loops: Math.floor(loops), i, f, g: loops % 1 };
}
// 망가진 바다 (실제를 본뜸): 길 위 구간 i 의 f0~f1
const ZONES = [
  { i: 6, f0: .2, f1: .85, name: '쓰레기 지대', type: 'trash' },
  { i: 9, f0: .45, f1: .95, name: '하얗게 바랜 산호 지대', type: 'bleach' }, { i: 11, f0: -.01, f1: .5, name: '붐비는 바닷길', type: 'busy' }];
let Z = { z: null, amt: 0, eff: 0 }, DMG = 0;
// 지역 (실제 바다를 본뜸, game/바다_지역_자료.md): 구간 i 의 f0~f1
const REG_NAMES = ['korea', 'alaska', 'hawaii', 'reef', 'open'];
const REGIONS = [
  [11, 0, 1, 'korea'], [0, 0, .55, 'korea'], [0, .55, 1, 'open'], [1, 0, .5, 'open'], [1, .5, 1, 'alaska'], [2, 0, 1, 'alaska'],
  [3, 0, 1, 'alaska'], [4, 0, 1, 'alaska'], [5, 0, .3, 'alaska'], [5, .3, 1, 'open'], [6, 0, .88, 'open'], [6, .88, 1, 'hawaii'],
  [7, 0, .4, 'hawaii'], [7, .4, 1, 'reef'], [8, 0, .15, 'reef'], [8, .15, .85, 'open'], [8, .85, 1, 'reef'], [9, 0, 1, 'reef'], [10, 0, 1, 'korea']];
const SEGG = SEG.map((_, i) => SEG.slice(0, i).reduce((a, b) => a + b, 0) / LOOP_KM);
const RW = { korea: 1, alaska: 0, hawaii: 0, reef: 0, open: 0, _sum: 1 };
function regionsNow() {
  const B = .01;                                    // 경계에서 약 하루 동안 섞임
  REG_NAMES.forEach(k => RW[k] = 0);
  for (const [i, f0, f1, k] of REGIONS) {
    const g0 = SEGG[i] + f0 * SEG[i] / LOOP_KM, g1 = SEGG[i] + f1 * SEG[i] / LOOP_KM;
    for (const g of [J.g, J.g - 1, J.g + 1]) RW[k] += clamp((g - g0) / B + .5, 0, 1) * clamp((g1 - g) / B + .5, 0, 1);
  }
  RW._sum = REG_NAMES.reduce((a, k) => a + RW[k], 0) || (RW.open = 1);
}
function zoneNow() {
  regionsNow();
  Z = { z: null, amt: 0, eff: 0 };
  for (const z of ZONES) if (J.i === z.i) { const e = Math.min(J.f - z.f0, z.f1 - J.f); if (e > 0) { Z.z = z; Z.amt = clamp(e / .12, 0, 1); } }
  if (Z.z) { const heal = clamp(((S.zc || {})[Z.z.name] || 0) / 12, 0, 1); Z.eff = Z.amt * (1 - .85 * heal); }
}
function health() {   // 매 프레임: 깨끗이 할수록 색이 돌아옴
  const e = Z.eff, ty = Z.z ? Z.z.type : '';
  DMG = ty === 'bleach' ? e * .4 : e;
  BLEACH = ty === 'bleach' ? e * .85 : e * .3;
  RUBBLE = ty === 'bleach' ? e * .8 : e * .3;
  VIV = (.62 + .38 * clarity()) * (1 - e * .35);
}
// 대륙 (아주 단순하게, 경도·위도)

// ---------- 오늘의 사건 (지역 따라) ----------
let ev = null, evAt = Infinity;
function startEvent(c) {
  let pool = c.cold > .5 ? ['jelly', 'rain'] : c.warm > .3 ? ['turtle', 'turtle', 'jelly'] : ['turtle', 'jelly', 'rain'];
  if (c.night > .5) pool = pool.concat(['star', 'star']);
  const k = pool[Math.floor(Math.random() * pool.length)];
  ev = { k, t: 0, dur: k === 'star' ? 10 : k === 'rain' ? 45 : 70, y: rnd(SKY + 60, FL() - 20), drops: [],
         jel: Array.from({ length: 3 }, () => ({ x: rnd(W * .3, W * 1.1), y: H + rnd(20, 160), p: rnd(0, 6) })) };
  S.eventDay = dayKey(now()); save();
  setTimeout(() => speak({ star: '별똥별이다', jelly: '해파리 친구들', turtle: '거북이 할머니다', rain: '비가 와요' }[k], 4), 3000);
}
function drawEvent(dt, t) {
  if (!ev) return;
  ev.t += dt; const p = ev.t / ev.dur;
  if (p >= 1) { ev = null; return; }
  const fadeA = Math.min(1, ev.t / 3, (ev.dur - ev.t) / 3);
  if (ev.k === 'turtle') { // 반대쪽에서 마주 와서 지나감
    const x = W + 60 - p * (W + 120), y = ev.y + Math.sin(ev.t * .5) * 8;
    ctx.save(); ctx.translate(x, y); ctx.scale(-1, 1); ctx.globalAlpha = .85 * fadeA;
    const f = Math.sin(ev.t * 1.2) * .4;
    ctx.fillStyle = '#9cb89a';
    [[-14, 10, f], [14, 10, -f], [-12, -9, -f], [14, -9, f]].forEach(([fx, fy, a]) => { ctx.save(); ctx.translate(fx, fy); ctx.rotate(a + (fx > 0 ? .5 : 2.6)); ctx.beginPath(); ctx.ellipse(8, 0, 10, 4, 0, 0, 6.28); ctx.fill(); ctx.restore(); });
    ctx.beginPath(); ctx.ellipse(28, -2, 8, 6, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#7b9a86'; ctx.beginPath(); ctx.ellipse(0, 0, 24, 15, 0, 0, 6.28); ctx.fill();
    ctx.strokeStyle = 'rgba(230,240,220,.5)'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.ellipse(0, 0, 13, 8, 0, 0, 6.28); ctx.stroke();
    ctx.fillStyle = '#2f4050'; ctx.beginPath(); ctx.arc(31, -4, 1.4, 0, 6.28); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  } else if (ev.k === 'jelly') {
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ev.jel.forEach(j => {
      const pulse = Math.sin(ev.t * 1.4 + j.p); j.y -= (6 + Math.max(0, pulse) * 6) * dt; j.x -= FLOW * .7 * dt;
      if (j.y < SKY + 30) j.y = SKY + 30;
      const x = j.x + Math.sin(ev.t * .3 + j.p) * 10, y = j.y;
      ctx.globalAlpha = .5 * fadeA; ctx.fillStyle = 'rgba(220,190,240,.6)';
      ctx.beginPath(); ctx.ellipse(x, y, 14 + pulse * 2, 10 - pulse, 0, Math.PI, 0); ctx.fill();
      ctx.strokeStyle = 'rgba(220,200,240,.5)'; ctx.lineWidth = 1;
      for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(x + i * 4, y); ctx.quadraticCurveTo(x + i * 4 + Math.sin(ev.t * 2 + i) * 4, y + 14, x + i * 4, y + 28); ctx.stroke(); }
    });

  } else if (ev.k === 'rain') {

    ctx.strokeStyle = `rgba(255,255,255,${.35 * fadeA})`; ctx.lineWidth = 1;
    for (let i = 0; i < 50; i++) { const x = wrap(i * 37 + ev.t * 30, W), y = wrap(i * 53 + ev.t * 260, SKY);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 2, y + 9); ctx.stroke(); }
    if (Math.random() < dt * 14) ev.drops.push({ x: rnd(0, W), t: 0 });
    ev.drops = ev.drops.filter(d => { d.t += dt; ctx.globalAlpha = (1 - d.t / 2) * fadeA; ctx.beginPath(); ctx.ellipse(d.x, surf(d.x, t), 4 + d.t * 14, 1.2 + d.t * 2, 0, 0, 6.28); ctx.stroke(); return d.t < 2; });
    ctx.globalAlpha = 1;

    const x = W + 120 - p * (W + 240), y = ev.y + Math.sin(ev.t * .4) * 14, f = Math.sin(ev.t * 1.1), s2 = Math.min(W, 560) * .22;
    ctx.save(); ctx.translate(x, y); ctx.globalAlpha = .42 * fadeA; ctx.filter = 'blur(1px)'; ctx.scale(1, .8);
    ctx.fillStyle = '#5d8098';

      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 110, y - 30); ctx.lineTo(x, y); ctx.stroke();
    }
  }
}

// ---------- 음악 (기본 끔) : audio/bgm.mp3 한 곡만 반복. 파일 없으면 조용히 ----------
const bgm = new Audio(); bgm.loop = true; bgm.preload = 'none'; bgm.volume = 0;
let bgmOn = false, bgmFade = null, bgmMissing = false;
bgm.addEventListener('error', () => { bgmMissing = true; bgmOn = false; });
function fadeTo(v, done) {
  clearInterval(bgmFade);
  bgmFade = setInterval(() => {
    const d = v - bgm.volume, st = .04;
    if (Math.abs(d) <= st) { bgm.volume = v; clearInterval(bgmFade); bgmFade = null; done && done(); }
    else bgm.volume = clamp(bgm.volume + Math.sign(d) * st, 0, 1);
  }, 100);
}
function audioOn() {
  nextCall = Math.min(nextCall, T + 60);
  if (bgmMissing) return;
  if (!bgm.src) bgm.src = 'audio/bgm.mp3';
  if (bgmOn && !bgm.paused) { fadeTo(.5); return; }   // 이미 켜져 있으면 다시 안 켬
  bgmOn = true;
  const p = bgm.play(); if (p && p.catch) p.catch(() => { bgmOn = false; });
  fadeTo(.5);
}
function audioOff() { bgmOn = false; fadeTo(0, () => { if (!bgmOn) bgm.pause(); }); whaleStop(); }
// 고래 소리: 한 번에 하나만 (audio 하나로 돌려씀). 소리 켬일 때만. 나오는 동안 음악은 살짝 작게
const WS = { breath: ['audio/whale/wheezeblow_pd.mp3', .35, 7], moo: ['audio/whale/moo_pd.mp3', .16, 20],
             song: ['audio/whale/song_cc0.mp3', .16, 24], song2: ['audio/whale/song_southern_ccby.mp3', .14, 24] };
const wa = new Audio(); wa.preload = 'none'; let waBusy = false, waFade = null, waEnd = null, nextCall = 90;
function waRamp(v, done) { clearInterval(waFade); waFade = setInterval(() => { const d = v - wa.volume;
  if (Math.abs(d) <= .02) { wa.volume = v; clearInterval(waFade); done && done(); } else wa.volume = clamp(wa.volume + Math.sign(d) * .02, 0, 1); }, 80); }
function waDone() { clearTimeout(waEnd); clearInterval(waFade); wa.pause(); waBusy = false; if (bgmOn) fadeTo(.5); }
function whaleSound(k) {
  if (!S.sound || waBusy || document.hidden) return;
  const [src, vol, max] = WS[k]; waBusy = true; wa.src = src; wa.volume = 0;
  const p = wa.play(); if (p && p.catch) p.catch(waDone);
  if (bgmOn) fadeTo(.25);

  waEnd = setTimeout(() => waRamp(0, waDone), (max - 2) * 1000);
}

wa.addEventListener('ended', waDone); wa.addEventListener('error', waDone);

      const im = iconImg(it[0]), z = fs * 1.5;
      if (im.complete && im.naturalWidth) { ctx.globalAlpha = .92; ctx.drawImage(im, fx - z / 2, fy - z / 2, z, z); ctx.globalAlpha = 1; } });
    drawFront(T, c);
    const set = setFor(stage); whale.pose = set ? set.base : 'stage' + stage; whale.mode = 'swim'; whale.vy = 0;
    whale.x = W * .5; whale.y = lock ? H * .63 : H * .5;
    { const dpt = clamp((whale.y - SKY) / (FL() - SKY), 0, 1), wc = mixC(c.top, c.bot, .3 + dpt * .5); TINT = `rgba(${wc[0]},${wc[1]},${wc[2]},${.06 + dpt * .16 + c.night * .12})`; }
    BUF.key = ''; drawWhale(T); BUF.key = '';
    if (c.night > 0) { ctx.fillStyle = `rgba(20,32,64,${c.night * .2})`; ctx.fillRect(0, SKY, W, H - SKY); }
    drawGlow(T, c);
    const vg = ctx.createRadialGradient(W / 2, H * .5, Math.min(W, H) * .35, W / 2, H * .5, Math.max(W, H) * .75);
    vg.addColorStop(0, 'rgba(0,20,40,0)'); vg.addColorStop(1, 'rgba(0,30,60,.12)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  } finally {

    whale.x = keep.x; whale.y = keep.y; whale.pose = keep.pose; whale.mode = keep.mode; whale.vy = keep.vy;

}
let wpBlob = null;
function makeWallpaper(lock) {
  const off = renderWallpaper(lock), out = $('wpOut');
  out.innerHTML = '<p>만드는 중…</p>';
  off.toBlob(b => {
    wpBlob = b; const url = URL.createObjectURL(b);
    out.innerHTML = `<img src="${url}" style="width:46%;border-radius:14px;margin:10px 0 2px;box-shadow:0 4px 18px rgba(20,60,90,.2)">
      <p style="font-size:12px">${off.width}×${off.height}</p><button class="b2 main" id="wpSave">저장하기</button>`;
    $('wpSave').onclick = () => saveWallpaper(url);

}
async function saveWallpaper(url) {
  const name = `고래_${S.name || '바다'}_${dayKey(now())}.png`, file = new File([wpBlob], name, { type: 'image/png' });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: '내 고래 배경화면' }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
$('bMore').onclick = () => { $('wpOut').innerHTML = ''; $('ovMore').classList.add('on'); };
document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => makeWallpaper(b.dataset.w === 'lock'));
if (DEBUG) window._wp = lock => renderWallpaper(lock).toDataURL('image/png');

// ---------- 처음 온 사람에게 살짝 — 세 가지만 (밥 · 쓰다듬기 · 치우기) ----------
const TIPS = [
  [ICON('krill'), '밥 주기', '아래 「밥 주기」를 누르면 크릴을 먹어요.<br>하루 두 번이면 충분해요.'],
  ['<svg class="ic" viewBox="0 0 64 64"><ellipse cx="32" cy="34" rx="26" ry="21" fill="#f4b9c6" opacity=".22"/><path d="M32 52C18 42 10 34 10 24c0-7 5-12 11-12 5 0 9 3 11 7 2-4 6-7 11-7 6 0 11 5 11 12 0 10-8 18-22 28z" fill="#f8cdd7" stroke="#da98a9" stroke-width="1.8" stroke-linejoin="round"/><ellipse cx="22" cy="22" rx="5" ry="2.4" transform="rotate(-30 22 22)" fill="#fff" opacity=".6"/></svg>', '쓰다듬기', '고래를 꾹 누르고 있으면<br>하트가 퐁퐁 올라와요.'],
  [ICON('wave'), '바다 치우기', '떠다니는 쓰레기를 톡 하면 사라지고<br>바다가 조금씩 맑아져요.']];
function showTips(i) {
  if (i >= TIPS.length) { $('ovTip').classList.remove('on'); S.tipDone = true; save(); setTimeout(showHint, 4000); stampCheck(); return; }
  const [ic, h, p] = TIPS[i];
  $('tipBox').innerHTML = `<div class="gift-icon" style="font-size:64px">${ic}</div><h3>${h}</h3><p>${p}</p>
    <div class="tipdots">${TIPS.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
    <button class="b2 main" id="tipNext">${i < TIPS.length - 1 ? '다음' : '시작할게요'}</button>`;
  $('tipNext').onclick = () => showTips(i + 1);
  $('ovTip').classList.add('on');
}
$('ovTip').addEventListener('pointerdown', e => e.stopPropagation());

// ---------- 시작 ----------
function greet() {
  const away = Date.now() - (S.last || Date.now());
  if (fresh) speak('안녕, 나는 ' + S.name + '야', 5);
  else if (away > DAY) speak('보고 싶었어', 6);
  else if (away > 3600000) speak('왔구나', 4);
  S.last = Date.now(); save();
}
function start() {
  resize(); J = journey(); stage = stageOf(daysOld());
  whale.x = homeX(); whale.y = H * .55; pickTarget(0);
  daily(0); ui();
  if (S.sound) { const once = () => { audioOn(); removeEventListener('pointerdown', once); }; addEventListener('pointerdown', once); }
  if (!S.name) {
    const box = document.getElementById('name'); box.style.display = 'flex';
    document.getElementById('nameOk').onclick = () => {
      S.name = (document.getElementById('nameIn').value || '').trim().slice(0, 8) || '바다';
      box.style.display = 'none'; save(); ui(); greet(); setTimeout(() => showTips(0), 2200);
    };
    document.getElementById('nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('nameOk').click(); });
  } else { greet(); if (S.cleaned < 3) setTimeout(showHint, 5000); }
  if (DEBUG) {
    window._jump = (i, f) => { const k = SEG.slice(0, i).reduce((a, b) => a + b, 0) + f * SEG[i]; S.offset = S.born + k / LOOP_KM * LOOP_DAYS * DAY - Date.now(); S.trashDay = ''; daily(T); };
    window._w = whale; window._S = S; window._ev = startEvent; window._tod = tod; window._map = v => mapBig = v;
    whale.nextSurface = 25;
    const d = document.getElementById('dbg'); d.style.display = 'flex';
    d.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { S.offset = (S.offset || 0) + DAY * +b.dataset.d; daily(T); });
    document.getElementById('dbgEv').onclick = () => startEvent(tod());
    $('dbgH3').onclick = () => { SH().at -= 3 * HOUR; save(); };
    $('dbgH8').onclick = () => { SH().at -= 8 * HOUR; save(); };
    $('dbgNext').onclick = () => { S.offset = (S.offset || 0) + DAY; daily(T); };
    window._stamp = STP; window._visit = k => { STP().visit = k; visitorGo(); };
    document.getElementById('dbgUp').onclick = () => { whale.nextSurface = 0; };
    document.getElementById('dbgReset').onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); };
  }
  setInterval(() => { S.last = Date.now(); save(); daily(T); }, 60000);
  requestAnimationFrame(loop);
}
let lastF = performance.now();
function loop(f) {
  const dt = Math.min(.1, (f - lastF) / 1000); lastF = f; T += dt; scroll += FLOW * dt;
  if (Math.floor(T) !== Math.floor(T - dt) && Math.floor(T) % 20 === 0) { J = journey(); zoneNow(); }
  const c = tod(); health();
  drawSky(dt, T, c);
  drawWater(T, c);
  drawFloor(T, c);
  drawLife(dt, T, c);
  drawParticles(dt, T);
  if (T > evAt) { evAt = Infinity; startEvent(c); }
  drawEvent(dt, T);
  drawFront(T, c);
  drawTrash(T);
  updateWhale(dt, T);
  { const dpt = clamp((whale.y - SKY) / (FL() - SKY), 0, 1), wc = mixC(c.top, c.bot, .3 + dpt * .5); TINT = `rgba(${wc[0]},${wc[1]},${wc[2]},${.06 + dpt * .16 + c.night * .12})`; }
  drawWhale(T);
  drawPouch(dt, T);
  drawSurfaceFx(dt, T);
  drawFx(dt, T);
  if (petting && T > petNext) { petNext = T + .45; hearts.push({ x: whale.x + rnd(-20, 20), y: whale.y - whaleW() * .25, s: rnd(10, 16), t: 0, p: rnd(0, 6) }); }
  ctx.fillStyle = `rgba(176,196,196,${(1 - clarity()) * .07})`; ctx.fillRect(0, SKY, W, H - SKY);
  if (DMG > 0) { ctx.fillStyle = `rgba(150,170,148,${DMG * .17})`; ctx.fillRect(0, SKY, W, H - SKY); }
  if (c.night > 0) { ctx.fillStyle = `rgba(20,32,64,${c.night * .2})`; ctx.fillRect(0, SKY, W, H - SKY); }
  drawGlow(T, c);
  const vg = ctx.createRadialGradient(W / 2, H * .5, Math.min(W, H) * .35, W / 2, H * .5, Math.max(W, H) * .75);
  vg.addColorStop(0, 'rgba(0,20,40,0)'); vg.addColorStop(1, 'rgba(0,30,60,.12)'); ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { if (document.hidden) { S.last = Date.now(); save(); clearInterval(bgmFade); bgm.pause(); bgmOn = false; waDone(); } else { lastF = performance.now(); if (S.sound) audioOn(); daily(T); } });
start();
