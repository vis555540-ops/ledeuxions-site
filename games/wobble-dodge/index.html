<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Underdog Dodgeball</title>
<meta name="description" content="Underdog Dodgeball: team dodgeball with silly special shots. Go from gym-class target to champion, one match at a time.">
<meta property="og:title" content="Underdog Dodgeball">
<meta property="og:description" content="Team dodgeball with silly special shots. From gym-class target to champion.">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0d0b1e;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{font-family:"Arial Black","Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-weight:900;color:#fff}
#cv{position:absolute;display:block;background:#17132f}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:10}
.screen.on{display:flex}
.dim{background:rgba(13,11,30,.78)}
.ink{-webkit-text-stroke:.12em #1b1b2f;paint-order:stroke fill}
.btn{font:inherit;color:#1b1b2f;background:#fff;border:3px solid #1b1b2f;border-radius:14px;box-shadow:0 5px 0 #1b1b2f;padding:0 16px;height:48px;font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1b1b2f}
.btn.pri{background:#ffd23f}.btn.blue{background:#6ecbff}.btn.green{background:#8ef0a8}.btn.pink{background:#ff9ecb}
.btn.big{height:72px;font-size:34px;font-style:italic;border-radius:20px;padding:0 34px}
.btn.sm{height:38px;font-size:15px;padding:0 12px;box-shadow:0 3px 0 #1b1b2f}
.btn[disabled]{opacity:.45;pointer-events:none}
.panel{background:#2b2d52;border:4px solid #1b1b2f;border-radius:24px;box-shadow:0 8px 0 #1b1b2f;padding:22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:stretch;width:min(560px,92vw);max-height:94vh;overflow:auto}
.panel h2{margin:0;font-size:clamp(34px,7vw,56px);font-style:italic;color:#ffd23f}
.panel .help{font-size:14px;font-weight:700;color:#c9cbe0;line-height:1.5}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.row .btn{flex:1}
#menu{background:radial-gradient(ellipse at 50% 30%,#2b2d6a 0%,#17132f 60%,#0d0b1e 100%);flex-direction:column;gap:14px;padding:14px;overflow:auto;justify-content:flex-start}
#logo{text-align:center;line-height:.95;transform:rotate(-3deg);margin-top:max(2vh,8px)}
@media (max-aspect-ratio:1/1){#logo{margin-top:64px}}
#logo .l1{font-size:clamp(44px,10vw,92px);font-style:italic;color:#fff}
#logo .l2{font-size:clamp(44px,10vw,92px);font-style:italic;color:#ff5a4f}
#logo .l3{font-size:clamp(14px,2.6vw,20px);margin-top:8px;color:#9be7ff;-webkit-text-stroke:4px #1b1b2f;paint-order:stroke fill}
#ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:min(900px,96vw)}
@media (max-aspect-ratio:1/1){#ladder{grid-template-columns:1fr}}
.team{background:#2b2d52;border:3px solid #1b1b2f;border-radius:16px;padding:8px 6px;text-align:center;cursor:pointer;font-size:14px;box-shadow:0 4px 0 #1b1b2f;color:#fff;font-family:inherit;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:4px}
@media (max-aspect-ratio:1/1){.team{flex-direction:row;justify-content:space-between;padding:8px 14px}}
.team .n{font-size:12px;color:#ffd23f}.team .st{font-size:11px;color:#c9cbe0}
.team.sel{border-color:#ffd23f;background:#3f4a8a}.team.lock{opacity:.45;cursor:default}.team.done .st{color:#8ef0a8}
.team .dots{display:flex;gap:3px}.team .dots i{width:14px;height:14px;border-radius:50%;border:2px solid #1b1b2f;display:block}
#help{font-size:13px;font-weight:700;color:#c9cbe0;text-align:center;line-height:1.55;max-width:900px}
#help b{color:#ffd23f}
#tops{position:fixed;right:10px;top:10px;display:flex;gap:8px;z-index:11}
#btnPause{position:fixed;width:44px;height:38px;padding:0;display:none;z-index:6;right:8px;top:8px}
#touch{position:absolute;display:none;pointer-events:none;z-index:5}
#touch.on{display:block}
#stick{position:absolute;pointer-events:auto}
#stickBase{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.4);pointer-events:none}
#stickKnob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:rgba(255,255,255,.75);border:3px solid #1b1b2f}
.tb{position:absolute;pointer-events:auto;overflow:hidden;word-break:keep-all;padding:2px;border-radius:50%;border:3px solid #1b1b2f;display:flex;align-items:center;justify-content:center;color:#1b1b2f;opacity:.85;text-align:center;line-height:1;box-shadow:0 4px 0 rgba(0,0,0,.4)}
.tb.dn{opacity:1;transform:scale(.92)}
#tThrow{background:#ffd23f}#tGrab{background:#8ef0a8}#tGrab.pass{background:#ff9ecb}#tJump{background:#6ecbff}
#tThrow.full,#tJump.full{opacity:1;animation:glow .5s ease-in-out infinite alternate}
#tThrow.full{background:#ff5a4f;color:#fff}
@keyframes glow{from{box-shadow:0 0 0 0 #ffd23f}to{box-shadow:0 0 0 8px #ffd23f}}
#pad{position:absolute;inset:0;background:#120f26;display:none}
#menuRow{width:min(560px,92vw)}#menuRow .btn{height:54px;font-size:19px}
#net .panel{width:min(460px,92vw)}
#netBody{display:flex;flex-direction:column;gap:10px;align-items:stretch}
#netBtns{flex-direction:column}#netBtns .btn{flex:none;height:56px;font-size:20px}
.code{font-size:clamp(64px,18vw,96px);letter-spacing:.12em;color:#ffd23f;font-style:italic;line-height:1.05}
input{user-select:text;-webkit-user-select:text;font:inherit;border:3px solid #1b1b2f;border-radius:14px;text-align:center;color:#1b1b2f;background:#fff}
.codein{font-size:44px;height:72px;letter-spacing:.3em;width:100%}
.link{font-size:13px;height:38px;width:100%;font-weight:700;color:#3a3c5a}
.help.err{color:#ff9d5c;min-height:1.2em}.help.wait{color:#9be7ff}.help.netmsg{font-size:20px;color:#fff;padding:12px 0}
#pad.on{display:block}
#keys{position:fixed;display:none;z-index:6;pointer-events:none;background:rgba(16,12,40,.82);border:2px solid #1b1b2f;border-radius:10px;padding:5px 10px;font-size:13px;font-weight:700;color:#fff;line-height:1.35}
#keys span{color:#9be7ff;font-size:11px}
#menuRow2{width:min(560px,92vw)}#menuRow2 .btn{height:44px;font-size:16px}
/* progression strip (menu) */
#prog{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(900px,96vw);font-size:14px}
#prog .chip{background:#2b2d52;border:3px solid #1b1b2f;border-radius:12px;padding:5px 10px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 #1b1b2f}
#mLv{color:#ffd23f}.xpbar{width:110px;height:14px;border:2px solid #1b1b2f;border-radius:8px;background:#3a3c5a;overflow:hidden}.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff9d5c)}
#mXp{font-size:11px;color:#c9cbe0}#mDaily{font-size:13px}#mDaily b,#resDaily b{color:#9be7ff}.ok{color:#8ef0a8}.xp{color:#ffd23f}
#bHat{height:44px;font-size:15px}
/* result rewards */
#result .panel{gap:9px;width:min(620px,94vw)}
#resXp .lvrow{display:flex;align-items:center;gap:10px;justify-content:center}#resXp .xpbar{flex:1;max-width:300px;height:18px}
#resXp .lv{color:#ffd23f;font-size:20px;min-width:3.4em}#resXp .lv.up{animation:pop .5s}#resXp .gain{color:#8ef0a8;font-size:20px;min-width:4.6em}
#resXp .parts{font-size:12px;color:#c9cbe0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:3px;font-weight:700}
#resUnl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.card{display:flex;align-items:center;gap:8px;border:3px solid #1b1b2f;border-radius:14px;padding:5px 12px 5px 6px;box-shadow:0 4px 0 #1b1b2f;animation:pop .45s both;font-size:15px;text-align:left;color:#1b1b2f}
.card canvas{width:54px;height:62px;display:block}.card b{display:block}.card small{display:block;font-size:12px;font-weight:700}
.card.gold{background:#ffd23f}.card.blue{background:#6ecbff}.card.green{background:#8ef0a8}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
#resDaily{font-size:13px}
#resTease{display:flex;gap:10px;align-items:center;justify-content:center;background:#1f2145;border:3px dashed #6ecbff;border-radius:14px;padding:6px 10px;text-align:left}
#resTease canvas{width:48px;height:56px}#resTease b{color:#9be7ff;font-size:15px;display:block}#resTease span{display:block;font-size:12px;font-weight:700;color:#fff}
#result .row .btn{height:64px;font-size:24px;font-style:italic}#bRetry{flex:1.4}#result .row .btn.sm{height:48px;font-size:16px}
#gift{z-index:12;background:rgba(13,11,30,.7)}#giftList{display:flex;flex-direction:column;gap:8px;align-items:center}
.tb.guide{opacity:1;animation:glow .45s ease-in-out infinite alternate}
@media (max-height:460px){#result .panel{padding:12px;gap:6px}#result .panel h2{font-size:34px}.card canvas{width:40px;height:46px}#resTease canvas{width:38px;height:44px}#result .row .btn{height:48px;font-size:18px}#prog{font-size:12px}}
.pgb{height:10px;border-radius:5px;background:#1b1b2f;border:2px solid #1b1b2f;overflow:hidden;margin-top:4px;min-width:120px}.pgb i{display:block;height:100%;background:#ffd23f;border-radius:3px}
#resTease b.nx{color:#ffd23f}
#unlPop{z-index:14;background:rgba(13,11,30,.82);cursor:pointer}
#upPanel{display:flex;flex-direction:column;align-items:center;gap:6px;background:#ffd23f;color:#1b1b2f;border:4px solid #1b1b2f;border-radius:22px;box-shadow:0 8px 0 #1b1b2f;padding:14px 22px 16px;width:min(380px,90vw);animation:pop .55s both;text-align:center}
#upTag{font-size:30px;font-style:italic;font-weight:900;color:#fff;-webkit-text-stroke:5px #1b1b2f;paint-order:stroke fill}
#upCv{width:150px;height:170px;display:block;background:radial-gradient(circle at 50% 70%,#fff8 0,#fff0 65%)}
#upName{margin:0;font-size:30px;font-style:italic;font-weight:900;color:#fff;-webkit-text-stroke:6px #1b1b2f;paint-order:stroke fill}#upSp{font-size:15px}#upSp small{display:block;font-size:12px}
#upStyle{font-size:15px;font-weight:900;background:#1b1b2f;color:#9be7ff;border-radius:10px;padding:4px 10px}
#upHow{font-size:12px;font-weight:700;opacity:.8}
#bUpOk{min-width:160px}
#logo.wig{animation:wig .35s}@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) scale(1.03)}75%{transform:rotate(4deg) scale(1.03)}}
@media (max-height:460px){#upCv{width:96px;height:108px}#upTag{font-size:22px}#upName{font-size:20px}#upPanel{gap:3px;padding:8px 16px 10px}}
/* story */
#story{position:fixed;inset:0;display:none;z-index:13;pointer-events:none}#story.on{display:block}
#cmCv{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:auto;cursor:pointer;touch-action:none}#story.tr #cmCv{display:none}
#stSkip{position:absolute;right:10px;top:10px;pointer-events:auto;z-index:2}
#resCoach{display:none;align-items:center;gap:10px;background:#1f2145;border:3px solid #ff9d5c;border-radius:14px;padding:6px 12px;text-align:left;font-size:14px;line-height:1.35}#resCoach b{color:#ff9d5c}#resCoach canvas{width:44px;height:52px;flex:none}
#upQuote{font-size:13px;font-style:italic;font-weight:900;background:#fff;border:2px solid #1b1b2f;border-radius:12px;padding:5px 10px;max-width:100%}
.team .sg{font-size:10px;color:#9be7ff;letter-spacing:.04em}
#bDefend,#bFree{width:min(560px,92vw);height:50px;font-size:18px}#bSkipEnd{opacity:.75}
@media (max-height:460px){#resCoach{font-size:12px;padding:4px 8px}#resCoach canvas{width:34px;height:40px}#upQuote{font-size:11px;padding:3px 8px}}
</style>
</head>
<body>
<div id="pad"></div>
<canvas id="cv"></canvas>
<div id="touch">
  <div id="stick"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <div class="tb" id="tThrow" data-i18n="tThrow"></div>
  <div class="tb" id="tGrab" data-i18n="tGrab"></div>
  <div class="tb" id="tJump" data-i18n="tJump"></div>
</div>
<div id="keys"></div>
<button class="btn sm" id="btnPause" aria-label="Pause">II</button>

<div id="menu" class="screen on">
  <div id="logo"><div class="l1 ink" data-i18n="title1"></div><div class="l2 ink" data-i18n="title2"></div><div class="l3" data-i18n="sub"></div></div>
  <div id="prog"><span class="chip"><span id="mLv"></span><span class="xpbar"><i id="mXpFill"></i></span><span id="mXp"></span></span><span class="chip" id="mStreak"></span><span class="chip" id="mDaily"></span><span class="chip" id="mChars"></span></div>
  <div id="ladder"></div>
  <button class="btn pri big" id="bPlay" data-i18n="play"></button>
  <button class="btn pink" id="bDefend" style="display:none"></button>
  <button class="btn green" id="bFree" style="display:none"></button>
  <div class="row" id="menuRow"><button class="btn" id="bSize"></button><button class="btn blue" id="bOnline" data-i18n="online"></button></div>
  <div class="row" id="menuRow2"><button class="btn" id="bRule"></button><button class="btn pink" id="bHat"></button><button class="btn sm" id="bLite"></button><button class="btn sm" id="bOpening" style="display:none"></button></div>
  <div id="help"></div>
</div>
<div id="pick" class="screen"></div>
<div id="tops"><button class="btn sm" id="bLang"></button><button class="btn sm" id="bMute"></button></div>

<div id="result" class="screen dim">
  <div class="panel">
    <h2 class="ink" id="resTitle"></h2>
    <div class="help" id="resSub"></div>
    <div id="resXp"></div>
    <div id="resUnl"></div>
    <div id="resCoach"></div>
    <div id="resDaily"></div>
    <div class="row">
      <button class="btn green" id="bRetry" data-i18n="rematch"></button>
      <button class="btn pri" id="bNext" data-i18n="nextTeam"></button>
    </div>
    <div class="row"><button class="btn sm" id="bTeam" data-i18n="pickTeam"></button><button class="btn sm green" id="bTrain" style="display:none"></button><button class="btn sm" id="bSkipEnd" style="display:none"></button><button class="btn sm blue" id="bShare" data-i18n="shareShot"></button><button class="btn sm" id="bResMenu" data-i18n="menu"></button></div>
    <div id="resTease"></div>
  </div>
</div>
<div id="gift" class="screen">
  <div class="panel"><h2 class="ink" id="giftTitle"></h2><div id="giftList"></div><button class="btn pri" id="bGiftOk"></button></div>
</div>
<div id="unlPop" class="screen"><div id="upPanel"><div id="upTag"></div><canvas id="upCv"></canvas><h2 id="upName"></h2><div id="upSp"></div><div id="upStyle"></div><div id="upQuote"></div><div id="upHow"></div><button class="btn pri" id="bUpOk"></button></div></div>
<div id="story"><canvas id="cmCv"></canvas><button class="btn sm" id="stSkip"></button></div>
<div id="net" class="screen dim">
  <div class="panel">
    <h2 class="ink" id="netTitle"></h2>
    <div id="netBody"></div>
    <div class="row" id="netBtns"></div>
  </div>
</div>
<div id="pause" class="screen dim">
  <div class="panel">
    <h2 class="ink" data-i18n="paused"></h2>
    <button class="btn pri" id="bResume" data-i18n="resume"></button>
    <div class="help" id="pauseHelp"></div>
    <button class="btn" id="bQuit" data-i18n="menu"></button>
  </div>
</div>
<script src="js/i18n.js?v=12"></script>
<script src="js/audio.js?v=12"></script>
<script src="js/sdk.js?v=12"></script>
<script src="js/meta.js?v=12"></script>
<script src="js/game.js?v=12"></script>
<script src="js/render.js?v=12"></script>
<script src="js/net.js?v=12"></script>
<script src="js/main.js?v=12"></script>
</body>
</html>
