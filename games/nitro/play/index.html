<title>Nitro Puff Rally</title>
<style>
  :root { --ink: #2b1d12; --cream: #fff6e3; --accent: #ff5a3c; --gold: #ffd23a; }

  #daily { display: none; margin-top: 10px; color: var(--gold); font-weight: 700; }
  #daily.on { display: block; }
  #title .panel { background: rgba(43, 29, 18, .62); }
  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  #hud.on { display: block; }
  .hbar { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 0 60px; }
  .chip { background: rgba(43,29,18,.75); border-radius: 12px; padding: 5px 12px; font-weight: 800; font-size: clamp(14px, 2.4vw, 22px); text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  #hNitro i { display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: #c9f07a; margin-left: 3px; box-shadow: inset -2px -2px 0 #86b83c; vertical-align: -1px; }
  .nlab { font-size: .7em; color: #c9f07a; }
  #trackName { position: absolute; bottom: 8px; left: 0; right: 0; text-align: center; font-size: 13px; opacity: .85; text-shadow: 0 1px 2px #000; }
  #countdown { position: absolute; top: 34%; left: 0; right: 0; text-align: center; font-size: clamp(48px, 11vw, 120px); font-weight: 900; color: var(--gold); text-shadow: 0 6px 0 #a2471f, 0 10px 0 rgba(0,0,0,.3); opacity: 0; transition: opacity .15s; }
  #countdown.on { opacity: 1; }
  #countdown.finalLap { color: #ff5a3c; text-shadow: 0 6px 0 #7a1a0a, 0 10px 0 rgba(0,0,0,.3); animation: flPulse .3s ease-in-out infinite alternate; }
  @keyframes flPulse { from { transform: scale(1); } to { transform: scale(1.08); } }
  #hPause { position: absolute; top: max(8px, env(safe-area-inset-top)); right: 10px; pointer-events: auto; background: rgba(43,29,18,.75); color: #fff; width: 42px; height: 38px; font-size: 18px; }
  /* result + shop */
  #rPlace { font-size: 72px; font-weight: 900; text-shadow: 0 5px 0 rgba(0,0,0,.35); line-height: 1; }
  .row { display: flex; justify-content: space-between; padding: 6px 4px; border-bottom: 1px dashed rgba(255,226,168,.3); font-size: 18px; }

  .pips i.f { background: #7ee05a; }
  .buy { background: #7ee05a; color: #1f3a12; font-weight: 800; padding: 8px 10px; width: 100%; box-shadow: 0 4px 0 #4d9a30; }
  .buy:disabled { background: #6f6455; color: #b8ab98; box-shadow: none; cursor: default; }

  #sNext { font-size: 13px; opacity: .85; margin-bottom: 8px; }

  .tb { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); width: 84px; height: 84px; border-radius: 50%; background: rgba(43,29,18,.45); border: 3px solid rgba(255,255,255,.55); color: #fff; font-size: 30px; font-weight: 900; display: flex; align-items: center; justify-content: center; touch-action: none; }

  #pause { z-index: 6; background: rgba(0,0,0,.35); font-size: 26px; font-weight: 800; }

  .credit { position: fixed; right: 8px; bottom: 4px; font-size: 10px; opacity: .6; }
  .pimg { width: 84px; height: 84px; display: block; margin: 0 auto 2px; filter: drop-shadow(0 4px 3px rgba(0,0,0,.35)); }
  .card.flash .pimg { animation: shine .7s ease-out; }
  @keyframes shine { 0% { transform: scale(1); filter: brightness(1) drop-shadow(0 0 0 #fff); } 35% { transform: scale(1.25) rotate(-6deg); filter: brightness(1.8) drop-shadow(0 0 14px #fff6a0); } 100% { transform: scale(1); } }
  .tier { font-size: 11px; font-weight: 800; letter-spacing: 1px; opacity: .9; }
  #speedfx { position: fixed; inset: 0; pointer-events: none; z-index: 4; opacity: 0; transition: opacity .2s;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,0) 0deg 5deg, rgba(255,255,255,.55) 5deg 5.6deg, rgba(255,255,255,0) 5.6deg 11deg);
    -webkit-mask: radial-gradient(circle at 50% 50%, transparent 38%, #000 75%); mask: radial-gradient(circle at 50% 50%, transparent 38%, #000 75%); animation: spin 0.35s linear infinite; }
  #speedfx.on { opacity: .55; }
  @keyframes spin { to { transform: rotate(11deg) scale(1.02); } }
  #bigPlace { position: absolute; top: 50%; left: 0; right: 0; text-align: center; font-size: clamp(60px, 16vw, 170px); font-weight: 900; color: var(--gold); text-shadow: 0 7px 0 #a2471f, 0 12px 0 rgba(0,0,0,.3); transform: translateY(-30%) scale(.3); opacity: 0; transition: transform .35s cubic-bezier(.3,1.6,.5,1), opacity .2s; }
  #bigPlace.on { opacity: 1; transform: translateY(-30%) scale(1); }
  #hMute { position: absolute; top: max(8px, env(safe-area-inset-top)); right: 58px; pointer-events: auto; background: rgba(43,29,18,.75); color: #fff; width: 42px; height: 38px; font-size: 16px; }
  .prog { height: 16px; background: rgba(0,0,0,.35); border-radius: 8px; overflow: hidden; margin: 4px 0 2px; border: 2px solid rgba(255,226,168,.5); }

  #rDaily { font-size: 13px; color: #c9f07a; margin-top: 6px; }
  .menu { display: flex; flex-direction: column; gap: 8px; align-items: stretch; max-width: 320px; margin: 10px auto 0; }

  #rotate b { font-size: 70px; display: block; animation: rot 1.6s ease-in-out infinite; }

  #intro { z-index: 8; background: transparent; justify-content: flex-end; padding-bottom: 12vh; }
  #intro h1 { font-size: clamp(44px, 10vw, 110px); opacity: 0; transform: scale(.4); transition: transform .5s cubic-bezier(.3,1.6,.5,1), opacity .3s; }

  @media (max-height: 480px) { .pimg { width: 76px; height: 76px; } #rProg, #rTracks { margin-top: 4px; } .panel { padding: 10px 16px; max-height: 96vh; overflow: auto; } h1 { font-size: 34px; } .big { font-size: 22px; padding: 10px 28px; } #rPlace { font-size: 44px; } #cards { grid-template-columns: repeat(4, minmax(0, 1fr)); } .cd { display: none; } .row { font-size: 15px; padding: 3px; } }
  /* title v2: logo on top, car in the middle (3D), buttons at the bottom */
  #title { justify-content: space-between; padding-top: max(18px, env(safe-area-inset-top)); }

  @media (max-height: 480px) { #title .logo h1 { font-size: 40px; } #title .logo .tag { margin: 4px 0; font-size: 14px; } .pbtns .big { font-size: 18px; padding: 8px 16px; } #title .help { display: none; } .tbig { font-size: 38px; } #shop .pimg { width: 58px; height: 58px; } #cards { margin: 6px 0; gap: 8px; } #shop .money { font-size: 22px; } #shop .card { padding: 6px; } }

  #raceInfo { position: absolute; top: 19%; left: 0; right: 0; text-align: center; opacity: 0; transform: translateY(-10px); transition: opacity .3s, transform .3s; text-shadow: 0 2px 3px rgba(0,0,0,.6); }

  #raceInfo b { display: inline-block; background: rgba(43,29,18,.78); border-radius: 12px; padding: 6px 14px; font-size: clamp(16px, 2.6vw, 24px); color: #ffd23a; }

  .sth { font-size: 13px; opacity: .85; margin: 8px 0 2px; }
  .stand { display: grid; gap: 2px; margin: 4px auto; max-width: 380px; }

  .srw.me { background: rgba(255,210,58,.22); }
  .srw b { color: #ffd23a; } .srw i { font-style: normal; color: #7ee05a; font-weight: 800; font-size: 13px; text-align: right; }
  #season .panel { max-width: 460px; }
  #seaTrophy { margin: 0 auto; width: 120px; } #seaTrophy.win { animation: tro 1.2s ease-out; filter: drop-shadow(0 0 18px rgba(255,220,90,.8)); }

  #seaPlace { font-size: 52px; font-weight: 900; line-height: 1.05; text-shadow: 0 4px 0 rgba(0,0,0,.35); }

  .cn { font-size: 19px; font-weight: 900; }
  .cmini { display: flex; justify-content: center; gap: 2px; margin: 4px 0; } .mini { width: 28px; height: 28px; background: rgba(0,0,0,.25); border-radius: 6px; }

  .sbar { position: relative; height: 14px; background: rgba(0,0,0,.4); border-radius: 7px; overflow: hidden; border: 1px solid rgba(255,226,168,.4); }
  .sbar .cur { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #ff8a3c, #ffd23a); transition: width .9s cubic-bezier(.2,1.4,.4,1); border-radius: 7px; }

<body>
<canvas id="game"></canvas>

<div id="loading" class="scr on"><h1>Nitro Puff Rally</h1><div class="bar"><div id="loadBar"></div></div></div>

<div id="title" class="scr">
  <div class="logo">
    <h1><span data-t="title">Nitro Puff Rally</span></h1>
    <div class="tag" data-t="tag"></div>
  </div>
  <div class="panel tpanel">
    <div class="pbtns">
      <button id="taBtn" class="big" data-t="ta">⏱ TIME ATTACK</button>
      <button id="playBtn" class="big alt" data-t="champ">🏁 Championship</button>
    </div>
    <div id="daily"></div>
    <div class="row2">
      <button id="garageBtn" class="small" data-t="garage">Garage</button>
      <button id="setBtn" class="small" data-t="settings">Settings</button>
      <button id="muteBtn" class="small">🔊</button>
      <button id="crBtn" class="small" data-t="credits">Credits</button>
    </div>
    <div class="money" id="tMoney" style="font-size:18px;margin-top:6px"></div>
    <div class="help" data-t="help"></div>
  </div>
  <div class="credit">3D models: Kenney (CC0)</div>
</div>

<div id="taSel" class="scr">
  <div class="panel" style="max-width:440px">
    <div style="font-size:28px;font-weight:900;color:var(--gold)" data-t="taPick">Time Attack</div>
    <div class="help" style="margin-top:2px" data-t="taLaps"></div>
    <div class="tsel">
      <button id="taPrev" class="small arr">◀</button>
      <div><div id="taName" class="tname"></div><div id="taBestL" class="tbest"></div></div>
      <button id="taNext" class="small arr">▶</button>
    </div>
    <button id="taGo" class="big" data-t="taGo">GO!</button>
    <div class="row2"><button id="taBack" class="small" data-t="back">Back</button></div>
  </div>
</div>

<div id="taRes" class="scr">
  <div class="panel" style="max-width:440px">
    <div id="taHead" style="font-size:24px;font-weight:900;color:var(--gold)"></div>
    <div id="taBig" class="tbig"></div>
    <div id="taRows"></div>
    <button id="taAd" class="adb"></button>
    <div class="row2">
      <button id="taRetry" class="big" style="font-size:22px" data-t="retry">Retry</button>
    </div>
    <div class="row2">
      <button id="taNextT" class="small" data-t="nextTrack">Next track</button>
      <button id="taGarage" class="small" data-t="garage">Garage</button>
      <button id="taMenu" class="small" data-t="menu">Menu</button>
    </div>
  </div>
</div>

<div id="settings" class="scr">
  <div class="panel">
    <div style="font-size:26px;font-weight:900;color:var(--gold)" data-t="settings">Settings</div>
    <div class="srow"><span data-t="sound">Sound</span><button id="sSound" class="small"></button></div>
    <div class="srow"><span data-t="sfx">Sound effects</span><button id="sSfx" class="small"></button></div>
    <div class="srow"><span data-t="music">Music</span><button id="sMusic" class="small"></button></div>
    <div class="srow"><span data-t="lang">Language</span><button id="langBtn" class="small">한국어</button></div>
    <div class="srow"><span>⛽</span><button id="autoBtn" class="small">Auto gas: ON</button></div>
    <div class="help"><b data-t="controls">Controls</b><br><span data-t="help"></span></div>
    <button id="setBack" class="big" style="font-size:22px;margin-top:12px" data-t="back">Back</button>
  </div>
</div>

<div id="intro" class="scr"><h1 id="introTitle">Nitro Puff Rally</h1><div class="skip" data-t="tapSkip"></div></div>
<div id="speedfx"></div>
<div id="podiumSkip" data-t="tapSkip"></div>
<div id="rotate"><b>📱</b><span data-t="rotate"></span></div>

<div id="hud">
  <div class="hbar">
    <div class="chip" id="hPos">1st</div>
    <div class="chip" id="hLap" style="font-size:clamp(20px,3.6vw,34px);color:#ffd23a">LAP 1/4</div>
    <div class="chip" id="hNitro"></div>
    <div class="chip" id="hCash" style="color:#ffd23a">$0</div>
  </div>
  <button id="hPause">II</button>
  <button id="hMute">🔊</button>
  <div id="bigPlace"></div>
  <div id="countdown">3</div>
  <div id="raceInfo"></div>
  <div id="trackName"></div>
</div>

<div id="touch">
  <div id="tPad"></div>
  <div class="thint" id="tHintL">◀</div>
  <div class="thint" id="tHintR">▶</div>
  <div class="tb" id="tBrake" data-t="brake">BRAKE</div>
  <div class="tb" id="tNitro">PUFF</div>
  <div class="tb" id="tGas" data-t="gas">GAS</div>
</div>

<div id="result" class="scr">
  <div class="panel">
    <div id="rPlace">1st</div>
    <div id="rOrder"></div>
    <div id="rRows"></div>
    <div id="rStand"></div>
    <div id="rUnlock"></div>
    <div id="rProg"></div>
    <div id="rTracks"></div>
    <div id="rDaily"></div>
    <button id="rAd" class="adb"></button>
    <button id="contBtn" class="big" data-t="cont">Continue</button>
  </div>
</div>

<div id="shop" class="scr">
  <div class="panel">
    <div style="font-size:24px;font-weight:900" data-t="shop">Garage</div>
    <div class="money" id="sMoney">$0</div>
    <div id="stats"></div>
    <div id="cards"></div>
    <div id="sNext"></div>
    <div class="row2" style="margin-top:4px;align-items:center"><button id="nextBtn" class="big" data-t="next">Next race</button><button id="shopBack" class="small" data-t="menu">Menu</button></div>
  </div>
</div>

<div id="season" class="scr">
  <div class="panel">
    <div id="seaHead" style="font-size:20px;font-weight:900;color:var(--gold)"></div>
    <div id="seaTrophy"></div>
    <div id="seaPlace"></div>
    <div class="sth" data-t="standings">Season standings</div>
    <div id="seaStand"></div>
    <div id="seaRows"></div>
    <div id="seaUnl"></div>
    <button id="seaBtn" class="big" data-t="cont">Continue</button>
  </div>
</div>

<div id="cupSel" class="scr">
  <div class="panel">
    <div style="font-size:28px;font-weight:900;color:var(--gold)" data-t="cupSel">Choose a cup</div>
    <div class="money" id="cupMoney" style="font-size:16px"></div>
    <div id="cupCards"></div>
    <div class="row2"><button id="cupGarage" class="small" data-t="garage">Garage</button><button id="cupBack" class="small" data-t="back">Back</button></div>
  </div>
</div>

<div id="credits" class="scr"><div id="crRoll"></div><div class="skip" data-t="tapSkip"></div></div>
<div id="confetti"></div>

<div id="pause" class="scr">
  <div class="panel" style="max-width:360px">
    <div style="font-size:30px;font-weight:900;color:var(--gold)" data-t="paused">Paused</div>
    <div class="menu">
      <button id="pResume" class="big" style="font-size:24px" data-t="resume">Continue</button>
      <button id="pRestart" class="small" data-t="restart">Restart</button>
      <button id="pSound" class="small">🔊</button>
      <button id="pMenu" class="small" data-t="menu">Menu</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
