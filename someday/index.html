<!doctype html>

<head>

<meta property="og:type" content="website">
<meta property="og:url" content="https://ledeuxions.com/someday/">

<style>
:root{--bg:#14131a;--ink:#e6e3dc;--dim:#8b8798;--line:#2b2936;
 --lock-bg:#1e1c26;--lock-ink:#4d4a5c;--pick:#2c2a38;--accent:#c9a227;--warm:#7a9e8e}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
 line-height:1.85;font-size:17px;word-break:keep-all;-webkit-font-smoothing:antialiased;
 -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:34px 20px 70px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:baseline;
 color:var(--dim);font-size:.82rem;margin-bottom:26px;letter-spacing:.04em}
.gauge{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 30px}
.gauge i{display:block;height:100%;background:var(--warm);transition:width .5s ease}
.scene{font-size:1.06rem;margin:0 0 8px;min-height:3em}
.aside{color:var(--dim);font-size:.92rem;margin:0 0 26px}

/* ── PTSD 편 ─────────────────────────────────────────────
   우울 편은 버튼을 잠근다. 여기서는 잠그지 않는다.
   대신 고른 것과 다른 일이 일어난다. 그게 이 병의 자리다.
   깜빡임은 쓰지 않는다 — 빛에 약한 분이 있다. 전부 천천히 스며든다. */

/* 그 사이 기억이 없습니다 */
.lost{
  color:#8e8598; font-size:.9rem; margin:0 0 12px; padding:9px 12px;
  border-left:2px solid #3a3446; background:rgba(58,52,70,.22); border-radius:0 6px 6px 0;
}
/* 지금 위로 과거가 덮인 순간 */
.pic.washed{filter:grayscale(.72) contrast(.88)}
.flash{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  text-align:center; padding:16px; color:#d8d2e0; font-size:.95rem; line-height:1.6;
  background:linear-gradient(rgba(18,16,24,.62),rgba(18,16,24,.78));
  animation:스밈 1.1s ease-out both;
}
@keyframes 스밈{from{opacity:0} to{opacity:1}}

/* 내가 고른 것 — 결과와 다르다는 걸 나란히 두어야 보인다 */
.chose{
  color:#7c7488; font-size:.86rem; margin:0 0 6px;
  text-decoration:line-through; text-decoration-color:#4a4356;
}
.scene.shifted{
  border-left:2px solid #6b5a7a; padding-left:12px; color:#e6dfec;
  animation:어긋남 .9s ease-out both;
}
@keyframes 어긋남{from{opacity:0; transform:translateX(-4px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){
  .flash,.scene.shifted{animation:none}
}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:auto}
button.opt{width:100%;text-align:left;padding:14px 16px;border-radius:11px;font:inherit;
 border:1px solid var(--line);background:var(--pick);color:var(--ink);cursor:pointer;transition:.15s}
button.opt:hover:not(.locked){border-color:var(--warm)}
button.opt.locked{background:var(--lock-bg);color:var(--lock-ink);cursor:not-allowed;border-color:transparent}
button.opt.locked:active{animation:nudge .22s}
@keyframes nudge{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.card{border:1px solid var(--line);border-radius:14px;padding:24px 22px;background:#191822}
h1{font-size:1.42rem;margin:0 0 10px;letter-spacing:-.01em}
h2{font-size:1.08rem;margin:26px 0 8px}
p{margin:0 0 14px}
.note{color:var(--dim);font-size:.9rem}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:11px;font:inherit;
 font-weight:600;border:1px solid var(--warm);background:transparent;color:var(--warm);
 cursor:pointer;margin-top:14px;text-decoration:none}
.btn.solid{background:var(--warm);color:#14131a;border-color:var(--warm)}
.help{border-top:1px solid var(--line);margin-top:30px;padding-top:18px;color:var(--dim);font-size:.9rem}
.help a{color:var(--accent)}
.tag{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:99px;
 border:1px solid var(--line);color:var(--dim);letter-spacing:.06em}
.pic{position:relative;overflow:hidden;width:100%;aspect-ratio:8/5;border-radius:10px;border:1px solid var(--line);
 margin:0 0 16px;image-rendering:pixelated;image-rendering:crisp-edges;
 background-size:cover;background-position:center;display:block}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

        "안 하는 것"이 아니라 "못 하는 것"임을 버튼이 대신 말한다.

   내용: 특정한 누구의 이야기가 아니다.
        우울을 겪은 사람들과 그 곁을 지킨 사람들이 공개적으로 남긴
        글들을 바탕으로, 여러 사람의 자리를 섞어 한 부부로 만들었다.
   ───────────────────────────────────────────────────────────── */

  if (누가아픈가) localStorage.setItem('eotteon_who', 누가아픈가);
  if (병) localStorage.setItem('eotteon_ill', 병); } catch(e){} }
function 끝난것불러오기(){ try {

function 누구정함(w){ 누가아픈가 = w; 끝난편 = []; 저장(); 시작화면(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function 병고르기(){
  앱.innerHTML =
   '<div class="card">' +
   '<h1>어떤 하루</h1>' +

   '<button class="btn solid" onclick="병정함(\'우울\')">우울</button>' +
   '<p class="note" style="margin:-4px 0 14px;font-size:13px">하고 싶은데 몸이 안 됩니다. 고를 수 없는 선택지가 생깁니다.</p>' +

   '<p class="note" style="margin:-4px 0 14px;font-size:13px">고를 수는 있습니다. 그런데 고른 것과 다른 일이 일어납니다.</p>' +

function 병정함(b){ 병 = b; 끝난것불러오기(); 저장(); 시작화면(); }

function 시작화면(){
  if (!병) return 병고르기();
  if (!누가아픈가) return 누구고르기();
  var 둘다 = 끝난편.indexOf('아픈사람') >= 0 && 끝난편.indexOf('곁의사람') >= 0;
  앱.innerHTML =
   '<div class="card">' +
   '<h1>어떤 하루</h1>' +
   '<p class="note">같은 열흘을 두 번 지나갑니다. 한 번은 아픈 사람으로, 한 번은 곁에 있는 사람으로.</p>' +
   (병 === 'PTSD'
  ? '<p class="note">고른 것과 다른 일이 일어납니다. 그것도 이 이야기의 일부입니다.</p>'
  : '<p class="note">고를 수 없는 선택지가 있습니다. 그것도 이 이야기의 일부입니다.</p>') +
   '<button class="btn solid" onclick="편시작(\'아픈사람\')">' +
     아픈쪽() + '으로' + (끝난편.indexOf('아픈사람')>=0 ? ' · 다시' : '') + '</button>' +

   '<button class="btn" style="border-color:#2b2936;color:#8b8798" onclick="병고르기()">'
     + (병 === 'PTSD' ? 'PTSD' : '우울') + ' · 다른 병으로 바꾸기</button>' +
   (둘다 ? '<button class="btn" onclick="마무리()">두 사람의 같은 하루 보기</button>' : '') +
   '<div class="help">' +
   '<p style="margin:0 0 6px">이 이야기는 특정한 누군가의 것이 아닙니다. 실제로 겪은 분들이 공개적으로 남긴 글을 바탕으로 만들었습니다.</p>' +
   '<p style="margin:0">지금 많이 힘드시다면 <a href="tel:109">109</a> 로 전화하실 수 있습니다. 무료이고 24시간입니다.</p>' +
   '</div></div>';

function 편시작(누구){ 편 = 누구; 칸 = 0; 그리기(); }

function 목록(){
  if (병 === 'PTSD') return 편 === '아픈사람' ? PTSD_아픈사람 : PTSD_곁의사람;
  return 편 === '아픈사람' ? 아픈사람 : 곁의사람;
}

function 그리기(){
  var L = 목록();
  if (칸 >= L.length) return 편끝();
  var s = L[칸];
  var 때 = s.때;
  var 배경 = 때.indexOf('교회') >= 0 ? '교회'
            : (때.indexOf('넷째') >= 0 || 때.indexOf('여덟째') >= 0
               || 때.indexOf('Day 4') >= 0 || 때.indexOf('Day 8') >= 0) ? '길'
            : (때.indexOf('새벽') >= 0 || 때.indexOf('밤') >= 0
               || 때.indexOf('dawn') >= 0 || 때.indexOf('night') >= 0) ? '밤'
            : (때.indexOf('저녁') >= 0 || 때.indexOf('evening') >= 0) ? '저녁'
            : (때.indexOf('낮') >= 0 || 때.indexOf('midday') >= 0) ? '낮' : '아침';
  if (편 === '아픈사람' && (때.indexOf('셋째') >= 0 || 때.indexOf('Day 3') >= 0)) 배경 = '교회';
  if (편 === '곁의사람' && (때.indexOf('셋째') >= 0 || 때.indexOf('Day 3') >= 0)) 배경 = '교회';
  var 이름 = 편 === '아픈사람' ? 아픈쪽() : 곁쪽();
  // 시간이 사라진 장면은 그 사실을 먼저 말한다. PTSD 편에만 있다.
  var 앞머리 = s.잃음 ? '<p class="lost">그 사이 기억이 없습니다.</p>' : '';
  // 과거가 지금 위로 잠깐 덮인다. 깜빡이지 않는다 — 빛에 약한 분이 있다.
  var 덮개 = s.덮임 ? '<div class="flash">' + esc(s.덮임) + '</div>' : '';
  var h = '<div class="top"><span class="tag">' + 이름 + '</span><span>' + esc(s.때) + '</span></div>' +
          '<div class="gauge"><i style="width:' + s.힘 + '%"></i></div>' +
          '<div class="pic' + (s.덮임 ? ' washed' : '') + '" style="background-image:url(' + 그림[배경] + ')">' + 덮개 + '</div>' +
          앞머리 +
          '<p class="scene">' + esc(s.글) + '</p>' +
          '<p class="aside">' + esc(s.곁) + '</p>' +
          '<div class="opts">';
  s.고르기.forEach(function(o, i){
    // PTSD 편에는 잠긴 버튼이 없다. 다 눌린다. 눌린 뒤가 다를 뿐이다.
    h += '<button class="opt' + (o.잠김 ? ' locked' : '') + '"' +
         (o.잠김 ? ' aria-disabled="true" onclick="흔들기(this)"' : ' onclick="고름(' + i + ')"') +
         '>' + esc(o.말) + '</button>';
  });
  마지막배경 = 배경;
  앱.innerHTML = h + '</div>';
}

function 흔들기(el){ el.style.animation='none'; void el.offsetWidth; el.style.animation=''; }

var 마지막배경 = '아침';
function 고름(i){
  var s = 목록()[칸], o = s.고르기[i];
  // 바뀜 = 고른 것과 다른 일이 일어난 것. 우울 편에는 없고 PTSD 편에만 있다.
  var 바뀜인가 = !!o.바뀜;
  var 결과 = o.바뀜 || o.뒤;

    (편==='아픈사람'?아픈쪽():곁쪽()) + '</span><span>' + esc(s.때) + '</span></div>' +
    '<div class="gauge"><i style="width:' + s.힘 + '%"></i></div>' +
    '<div class="pic" style="background-image:url(' + 그림[마지막배경] + ')"></div>' +
    (바뀜인가 ? '<p class="chose">고른 것: ' + esc(o.말) + '</p>' : '') +
    '<p class="scene' + (바뀜인가 ? ' shifted' : '') + '">' + esc(결과) + '</p>' +
    '<div class="opts"><button class="opt" onclick="다음()">다음</button></div>';
}

function 다음(){ 칸++; 그리기(); }

function 편끝(){

   '<h2>열흘이 지났습니다</h2>' +

     ? '<p>고를 수 없었던 것들이 있었습니다. 하고 싶지 않아서가 아니라 되지 않아서였습니다.</p>'

   (둘다

   '<button class="btn" onclick="시작화면()">처음으로</button>' +
   '</div>';
}

   '둘 다 상대를 아프게 하려던 것이 아니었습니다.</p>' +
   '<p>아픈 사람의 고통은 당사자 말고는 잘 모릅니다. ' +
   '그런데 <b>곁에 있는 사람의 고통도 당사자 말고는 모릅니다.</b> 그래서 서로를 모른 채 같은 집에 삽니다.</p>' +
   '<h2>그리고 넷째 날</h2>' +

   '<p>나은 것은 아닙니다. 다음 날 또 못 일어날 수도 있습니다. 다만 그날은 그것으로 됐습니다.</p>' +
   '<h2>해보신 분께</h2>' +

   '<p style="font-size:1.02rem">그리고 당신의 한마디에 사람이 죽을 수도 있습니다. 건강한 사람들은 못 느낍니다.</p>' +
