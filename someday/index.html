<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14131a">
<title>어떤 하루 — 아픈 사람과 곁에 있는 사람</title>
<link rel="canonical" href="https://ledeuxions.com/someday/">
<meta property="og:title" content="어떤 하루 — 아픈 사람과 곁에 있는 사람">
<meta property="og:description" content="같은 나흘을 두 번 지나갑니다. 고를 수 없는 선택지가 있습니다.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ledeuxions.com/someday/">
<meta name="robots" content="index,follow">
<link rel="alternate" hreflang="en" href="https://ledeuxions.com/someday/en/">
<link rel="alternate" hreflang="ko" href="https://ledeuxions.com/someday/">
<meta name="description" content="같은 하루를 두 번 삽니다. 한 번은 아픈 사람으로, 한 번은 곁에 있는 사람으로. 둘 다 고를 수 없는 것이 있습니다.">
<style>
:root{--bg:#14131a;--ink:#e6e3dc;--dim:#8b8798;--line:#2b2936;
 --lock-bg:#1e1c26;--lock-ink:#4d4a5c;--pick:#2c2a38;--accent:#c9a227;--warm:#7a9e8e}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
 line-height:1.85;font-size:17px;word-break:keep-all;-webkit-font-smoothing:antialiased;
 -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:34px 20px 70px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:baseline;
 color:var(--dim);font-size:.82rem;margin-bottom:26px;letter-spacing:.04em}
.gauge{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 30px}
.gauge i{display:block;height:100%;background:var(--warm);transition:width .5s ease}
.scene{font-size:1.06rem;margin:0 0 8px;min-height:3em}
.aside{color:var(--dim);font-size:.92rem;margin:0 0 26px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:auto}
button.opt{width:100%;text-align:left;padding:14px 16px;border-radius:11px;font:inherit;
 border:1px solid var(--line);background:var(--pick);color:var(--ink);cursor:pointer;transition:.15s}
button.opt:hover:not(.locked){border-color:var(--warm)}
button.opt.locked{background:var(--lock-bg);color:var(--lock-ink);cursor:not-allowed;border-color:transparent}
button.opt.locked:active{animation:nudge .22s}
@keyframes nudge{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.card{border:1px solid var(--line);border-radius:14px;padding:24px 22px;background:#191822}
h1{font-size:1.42rem;margin:0 0 10px;letter-spacing:-.01em}
h2{font-size:1.08rem;margin:26px 0 8px}
p{margin:0 0 14px}
.note{color:var(--dim);font-size:.9rem}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:11px;font:inherit;
 font-weight:600;border:1px solid var(--warm);background:transparent;color:var(--warm);
 cursor:pointer;margin-top:14px;text-decoration:none}
.btn.solid{background:var(--warm);color:#14131a;border-color:var(--warm)}
.help{border-top:1px solid var(--line);margin-top:30px;padding-top:18px;color:var(--dim);font-size:.9rem}
.help a{color:var(--accent)}
.tag{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:99px;
 border:1px solid var(--line);color:var(--dim);letter-spacing:.06em}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ─────────────────────────────────────────────────────────────
   어떤 하루 — 아픈 사람과 곁의 사람

   만든 이유: 아픈 사람의 고통은 당사자 말고 잘 모른다.
             그런데 곁에 있는 사람의 고통도 당사자 말고 모른다.
             둘 다 힘든데 서로를 모른다.

   장치: 선택지를 지우지 않고 회색으로 잠근다.
        "안 하는 것"이 아니라 "못 하는 것"임을 버튼이 대신 말한다.
        양쪽 다 잠긴다. 그래야 한쪽이 나쁜 사람이 되지 않는다.

   내용: 특정한 누구의 이야기가 아니다.
        우울을 겪은 사람들과 그 곁을 지킨 사람들이 공개적으로 남긴
        글들을 바탕으로, 여러 사람의 자리를 섞어 한 부부로 만들었다.
   ───────────────────────────────────────────────────────────── */

var 아픈사람 = [
 { 때:'첫째 날 · 아침', 힘:22,
   글:'눈은 떴는데 몸이 안 움직인다. 일어나서 아이 배웅은 해야지, 어젯밤에 그렇게 생각했다.',
   곁:'현관에서 소리가 났다. 지금 나가면 늦지 않는다. 그런데 몸이 이불에 눌려 있다.',
   고르기:[
     {말:'일어나서 배웅한다', 잠김:true},
     {말:'일단 앉기라도 한다', 잠김:true},
     {말:'천장을 본다', 잠김:false,
      뒤:'문이 닫히는 소리가 났다. 갔구나, 하고 천장을 봤다.'}]},

 { 때:'첫째 날 · 낮', 힘:16,
   글:'회사에서 메시지가 왔다. 오늘 회의는 그냥 진행됐다고.',
   곁:'답장을 써야 하는데 손이 안 움직인다. 뭐라고 쓸지는 아는데 쓰는 것이 안 된다.',
   고르기:[
     {말:'답장을 쓴다', 잠김:true},
     {말:'짧게라도 보낸다', 잠김:true},
     {말:'화면을 보다가 폰을 놓는다', 잠김:false,
      뒤:'읽음 표시만 떴다. 저쪽에서는 내가 무시한 줄 알 것이다. 그것까지 알면서 아무것도 못 했다.'}]},

 { 때:'첫째 날 · 저녁', 힘:11,
   글:'"오늘 뭐 했어?"',
   곁:'화를 낸 목소리가 아니었다. 그냥 물은 것이다. 그런데 대답할 것이 없다.',
   고르기:[
     {말:'"이것저것 했어" 하고 넘긴다', 잠김:true},
     {말:'"미안해" 라고 한다', 잠김:true},
     {말:'"아무것도"', 잠김:false,
      뒤:'그 말이 얼마나 성의 없게 들리는지 알면서도 그것밖에 안 나왔다. 그 아무것도가 하루종일 얼마나 무거웠는지는 말할 수가 없었다.'}]},

 { 때:'둘째 날 · 새벽', 힘:8,
   글:'약을 먹었는데도 잠이 안 온다. 거실로 나왔다.',
   곁:'어두운 데 앉아 있으면 생각이 자꾸 나쁜 쪽으로 간다. 이 시간이 제일 길다.',
   고르기:[
     {말:'깨워서 얘기한다', 잠김:true},
     {말:'누구에게든 연락해 본다', 잠김:true},
     {말:'그냥 앉아 있는다', 잠김:false,
      뒤:'뒤에서 인기척이 났다. 깬 모양이다. 아무 말도 안 하고 서 있다가 다시 들어갔다.'}]},

 { 때:'셋째 날 · 아침', 힘:9,
   글:'일요일. 교회 갈 시간이다.',
   곁:'다들 밝게 인사한다. 나만 어두운 것 같다. 여기서도 이러면 안 될 것 같은데 그게 더 힘들다.',
   고르기:[
     {말:'평소처럼 인사하고 앉는다', 잠김:true},
     {말:'힘들다고 누구에게 말한다', 잠김:true},
     {말:'뒷자리에 혼자 앉는다', 잠김:false,
      뒤:'설교는 귀에 안 들어왔다. 기도할 때 무슨 말을 해야 할지 몰라서 그냥 눈만 감고 있었다.'}]},

 { 때:'넷째 날 · 낮', 힘:15,
   글:'어제보다 아주 조금 몸이 가볍다.',
   곁:'"같이 잠깐 걸을래?" 하고 묻는다.',
   고르기:[
     {말:'"응"', 잠김:false,
      뒤:'그 한 마디를 하는 데도 시간이 걸렸다. 신발을 신는 데 또 걸렸다. 그래도 나갔다. 십 분쯤 걷고 들어왔다.',
      좋음:true},
     {말:'"고마워, 그러자"', 잠김:true},
     {말:'"오늘은 좀 그래"', 잠김:false,
      뒤:'말해 놓고 후회했다. 나가고 싶었는데 그 말이 안 나왔다.'}]},
];

var 곁의사람 = [
 { 때:'첫째 날 · 아침', 힘:60,
   글:'아이 배웅을 혼자 했다. 오늘도 안 일어났다.',
   곁:'화가 나기도 하고 걱정이 되기도 한다. 둘이 같이 오니까 어느 쪽이 진짜인지 모르겠다.',
   고르기:[
     {말:'들어가서 깨운다', 잠김:true},
     {말:'괜찮냐고 다정하게 묻는다', 잠김:true},
     {말:'그냥 나간다', 잠김:false,
      뒤:'문 앞에서 잠깐 섰다가 그냥 나왔다. 뭐라고 말하려다 그만뒀다.'}]},

 { 때:'첫째 날 · 낮', 힘:46,
   글:'일하다가 자꾸 생각난다. 밥은 먹었을까.',
   곁:'"밥 먹었어?" 하고 보냈다. 읽음 표시는 떴는데 답이 없다.',
   고르기:[
     {말:'전화를 건다', 잠김:true},
     {말:'답이 올 때까지 신경 안 쓴다', 잠김:true},
     {말:'화면을 몇 번 더 본다', 잠김:false,
      뒤:'서운한 마음이 올라왔다. 그리고 그런 마음이 드는 자신이 또 싫었다.'}]},

 { 때:'첫째 날 · 저녁', 힘:31,
   글:'집에 왔다. 아이 숙제를 봐주고 나서 물었다. "오늘 뭐 했어?"',
   곁:'"아무것도." 그 대답이 돌아왔다.',
   고르기:[
     {말:'"괜찮아, 그럴 수도 있지"', 잠김:true},
     {말:'무슨 일 있었냐고 더 물어본다', 잠김:true},
     {말:'한숨이 나온다', 잠김:false,
      뒤:'참으려고 했는데 나왔다. 그 소리를 들었다는 것도 알았다. 아이 앞이라 더는 아무 말도 안 했다.'}]},

 { 때:'둘째 날 · 새벽', 힘:22,
   글:'잠결에 옆자리가 빈 것을 알았다. 거실에 불빛도 없이 앉아 있다.',
   곁:'무슨 말을 해야 할지 모르겠다. 잘못 말하면 더 나빠질 것 같다.',
   고르기:[
     {말:'옆에 가서 앉는다', 잠김:true},
     {말:'"무슨 생각 해?" 하고 묻는다', 잠김:true},
     {말:'보고만 있다가 들어간다', 잠김:false,
      뒤:'다시 누웠는데 잠이 안 왔다. 내일 아침에는 뭐라고 해야 하나 생각하다가 그것도 못 정했다.'}]},

 { 때:'셋째 날 · 아침', 힘:19,
   글:'교회에 왔다. 뒷자리에 혼자 앉은 뒷모습이 보인다.',
   곁:'설교가 안 들린다. 저 사람 뒷모습만 보고 있다.',
   고르기:[
     {말:'옆에 가서 앉는다', 잠김:true},
     {말:'끝나고 목사님께 상의한다', 잠김:true},
     {말:'그냥 앞자리에 앉아 있는다', 잠김:false,
      뒤:'기도 시간에 무슨 말을 해야 할지 몰랐다. 낫게 해달라는 말은 너무 여러 번 했다.'}]},

 { 때:'넷째 날 · 낮', 힘:26,
   글:'오늘은 얼굴이 조금 나아 보인다. 오래 생각하다가 물었다.',
   곁:'"같이 잠깐 걸을래?"',
   고르기:[
     {말:'"응" 소리를 듣는다', 잠김:false,
      뒤:'그 한 마디에 눈물이 나올 뻔했다. 별것 아닌데 별것이었다. 십 분쯤 걷고 들어왔고, 그날은 그것으로 됐다.',
      좋음:true},
     {말:'기대하지 않기로 한다', 잠김:true},
     {말:'대답을 기다린다', 잠김:false,
      뒤:'한참 걸렸다. 그 사이에 마음이 몇 번 오르내렸다.'}]},
];

var 앱 = document.getElementById('app');
var 편, 칸 = 0, 끝난편 = [];
var 누가아픈가 = null;   // '남편' 또는 '아내' — 호칭만 바뀐다. 겪는 일은 같다.
try { 누가아픈가 = localStorage.getItem('eotteon_who'); } catch(e) {}
function 아픈쪽(){ return 누가아픈가 === '아내' ? '아내' : '남편'; }
function 곁쪽(){ return 누가아픈가 === '아내' ? '남편' : '아내'; }
try { 끝난편 = JSON.parse(localStorage.getItem('eotteon_done') || '[]'); } catch(e) { 끝난편 = []; }

function 저장(){ try { localStorage.setItem('eotteon_done', JSON.stringify(끝난편));
  if (누가아픈가) localStorage.setItem('eotteon_who', 누가아픈가); } catch(e){} }

function 누구고르기(){
  앱.innerHTML =
   '<div class="card">' +
   '<h1>어떤 하루</h1>' +
   '<p class="note">아픈 사람은 누구입니까. 겪는 일은 같습니다. 부르는 말만 달라집니다.</p>' +
   '<button class="btn solid" onclick="누구정함(\'남편\')">남편이 아픕니다</button>' +
   '<button class="btn solid" onclick="누구정함(\'아내\')">아내가 아픕니다</button>' +
   '<p class="note" style="margin-top:18px">우울은 누구에게나 옵니다. 남자에게도 여자에게도요.</p>' +
   '</div>';
}
function 누구정함(w){ 누가아픈가 = w; 끝난편 = []; 저장(); 시작화면(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function 시작화면(){
  if (!누가아픈가) return 누구고르기();
  var 둘다 = 끝난편.indexOf('아픈사람') >= 0 && 끝난편.indexOf('곁의사람') >= 0;
  앱.innerHTML =
   '<div class="card">' +
   '<h1>어떤 하루</h1>' +
   '<p class="note">같은 나흘을 두 번 지나갑니다. 한 번은 아픈 사람으로, 한 번은 곁에 있는 사람으로.</p>' +
   '<p class="note">고를 수 없는 선택지가 있습니다. 그것도 이 이야기의 일부입니다.</p>' +
   '<button class="btn solid" onclick="편시작(\'아픈사람\')">' +
     아픈쪽() + '으로' + (끝난편.indexOf('아픈사람')>=0 ? ' · 다시' : '') + '</button>' +
   '<button class="btn" onclick="편시작(\'곁의사람\')">' +
     곁쪽() + '으로' + (끝난편.indexOf('곁의사람')>=0 ? ' · 다시' : '') + '</button>' +
   '<button class="btn" style="border-color:#2b2936;color:#8b8798" onclick="누구고르기()">아픈 사람 바꾸기</button>' +
   (둘다 ? '<button class="btn" onclick="마무리()">두 사람의 같은 하루 보기</button>' : '') +
   '<div class="help">' +
   '<p style="margin:0 0 6px">이 이야기는 특정한 누군가의 것이 아닙니다. 실제로 겪은 분들이 공개적으로 남긴 글을 바탕으로 만들었습니다.</p>' +
   '<p style="margin:0">지금 많이 힘드시다면 <a href="tel:109">109</a> 로 전화하실 수 있습니다. 무료이고 24시간입니다.</p>' +
   '</div></div>';
}

function 편시작(누구){ 편 = 누구; 칸 = 0; 그리기(); }

function 목록(){ return 편 === '아픈사람' ? 아픈사람 : 곁의사람; }

function 그리기(){
  var L = 목록();
  if (칸 >= L.length) return 편끝();
  var s = L[칸];
  var 이름 = 편 === '아픈사람' ? 아픈쪽() : 곁쪽();
  var h = '<div class="top"><span class="tag">' + 이름 + '</span><span>' + esc(s.때) + '</span></div>' +
          '<div class="gauge"><i style="width:' + s.힘 + '%"></i></div>' +
          '<p class="scene">' + esc(s.글) + '</p>' +
          '<p class="aside">' + esc(s.곁) + '</p>' +
          '<div class="opts">';
  s.고르기.forEach(function(o, i){
    h += '<button class="opt' + (o.잠김 ? ' locked' : '') + '"' +
         (o.잠김 ? ' aria-disabled="true" onclick="흔들기(this)"' : ' onclick="고름(' + i + ')"') +
         '>' + esc(o.말) + '</button>';
  });
  앱.innerHTML = h + '</div>';
}

function 흔들기(el){ el.style.animation='none'; void el.offsetWidth; el.style.animation=''; }

function 고름(i){
  var s = 목록()[칸], o = s.고르기[i];
  앱.innerHTML = '<div class="top"><span class="tag">' +
    (편==='아픈사람'?아픈쪽():곁쪽()) + '</span><span>' + esc(s.때) + '</span></div>' +
    '<div class="gauge"><i style="width:' + s.힘 + '%"></i></div>' +
    '<p class="scene">' + esc(o.뒤) + '</p>' +
    '<div class="opts"><button class="opt" onclick="다음()">다음</button></div>';
}

function 다음(){ 칸++; 그리기(); }

function 편끝(){
  if (끝난편.indexOf(편) < 0) { 끝난편.push(편); 저장(); }
  var 상대 = 편 === '아픈사람' ? '곁의사람' : '아픈사람';
  var 상대이름 = 편 === '아픈사람' ? 곁쪽() : 아픈쪽();
  var 둘다 = 끝난편.length >= 2;
  앱.innerHTML = '<div class="card">' +
   '<h2>사흘이 지났습니다</h2>' +
   (편 === '아픈사람'
     ? '<p>고를 수 없었던 것들이 있었습니다. 하고 싶지 않아서가 아니라 되지 않아서였습니다.</p>'
     : '<p>고를 수 없었던 것들이 있었습니다. 마음이 없어서가 아니라 지쳐서였습니다.</p>') +
   '<p class="note">같은 나흘을 ' + 상대이름 + '도 지나갔습니다.</p>' +
   (둘다
     ? '<button class="btn solid" onclick="마무리()">두 사람의 같은 하루 보기</button>'
     : '<button class="btn solid" onclick="편시작(\'' + 상대 + '\')">' + 상대이름 + '으로 지나가기</button>') +
   '<button class="btn" onclick="시작화면()">처음으로</button>' +
   '</div>';
}

   '<p>나은 것은 아닙니다. 다음 날 또 못 일어날 수도 있습니다. 다만 그날은 그것으로 됐습니다.</p>' +
   '<h2>해보신 분께</h2>' +

   '<p style="font-size:1.02rem">그리고 당신의 한마디에 사람이 죽을 수도 있습니다. 건강한 사람들은 못 느낍니다.</p>' +
