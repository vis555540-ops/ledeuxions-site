<style>
:root{--bg:#14131a;--ink:#e6e3dc;--dim:#8b8798;--line:#2b2936;
 --lock-bg:#1e1c26;--lock-ink:#4d4a5c;--pick:#2c2a38;--accent:#c9a227;--warm:#7a9e8e}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
 line-height:1.85;font-size:17px;word-break:keep-all;-webkit-font-smoothing:antialiased;
 -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:34px 20px 70px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:baseline;
 color:var(--dim);font-size:.82rem;margin-bottom:26px;letter-spacing:.04em}
.gauge{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 30px}
.gauge i{display:block;height:100%;background:var(--warm);transition:width .5s ease}
.scene{font-size:1.06rem;margin:0 0 8px;min-height:3em}
.aside{color:var(--dim);font-size:.92rem;margin:0 0 26px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:auto}
button.opt{width:100%;text-align:left;padding:14px 16px;border-radius:11px;font:inherit;
 border:1px solid var(--line);background:var(--pick);color:var(--ink);cursor:pointer;transition:.15s}
button.opt:hover:not(.locked){border-color:var(--warm)}
button.opt.locked{background:var(--lock-bg);color:var(--lock-ink);cursor:not-allowed;border-color:transparent}
button.opt.locked:active{animation:nudge .22s}
@keyframes nudge{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.card{border:1px solid var(--line);border-radius:14px;padding:24px 22px;background:#191822}
h1{font-size:1.42rem;margin:0 0 10px;letter-spacing:-.01em}
h2{font-size:1.08rem;margin:26px 0 8px}
p{margin:0 0 14px}
.note{color:var(--dim);font-size:.9rem}
.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:11px;font:inherit;
 font-weight:600;border:1px solid var(--warm);background:transparent;color:var(--warm);
 cursor:pointer;margin-top:14px;text-decoration:none}
.btn.solid{background:var(--warm);color:#14131a;border-color:var(--warm)}
.help{border-top:1px solid var(--line);margin-top:30px;padding-top:18px;color:var(--dim);font-size:.9rem}
.help a{color:var(--accent)}
.tag{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:99px;
 border:1px solid var(--line);color:var(--dim);letter-spacing:.06em}
.pic{width:100%;aspect-ratio:8/5;border-radius:10px;border:1px solid var(--line);
 margin:0 0 16px;image-rendering:pixelated;image-rendering:crisp-edges;
 background-size:cover;background-position:center;display:block}
.hidden{display:none}
</style>
</head>

<script>
/* ─────────────────────────────────────────────────────────────
   Some Days — 아픈 사람과 곁의 사람

   만든 이유: 아픈 사람의 고통은 당사자 말고 잘 모른다.
             그런데 곁에 있는 사람의 고통도 당사자 말고 모른다.
             둘 다 힘든데 서로를 모른다.

   장치: 선택지를 지우지 않고 회색 잠근다.
        "안 하는 것"이 아니라 "못 하는 것"임을 버튼이 대신 말한다.
        양쪽 다 잠긴다. 그래야 한쪽이 나쁜 사람이 되지 않는다.

   내용: 특정한 누구의 이야기가 아니다.
        우울을 겪은 사람들과 그 곁을 지킨 사람들이 공개적 남긴
        글들을 바탕, 여러 사람의 자리를 섞어 한 부부로 만들었다.
   ───────────────────────────────────────────────────────────── */

 { 때:'Day 6 · morning', 힘:7,

var 편, 칸 = 0, 끝난편 = [];
var 누가아픈가 = null;   // '남편' 또는 '아내' — 호칭만 바뀐다. 겪는 일은 같다.
try { 누가아픈가 = localStorage.getItem('eotteon_who'); } catch(e) {}
function 아픈쪽(){ return 누가아픈가 === 'wife' ? 'the wife' : 'the husband'; }
function 곁쪽(){ return 누가아픈가 === 'wife' ? 'the husband' : 'the wife'; }
try { 끝난편 = JSON.parse(localStorage.getItem('eotteon_done') || '[]'); } catch(e) { 끝난편 = []; }

function 저장(){ try { localStorage.setItem('eotteon_done', JSON.stringify(끝난편));
  if (누가아픈가) localStorage.setItem('eotteon_who', 누가아픈가); } catch(e){} }

function 누구고르기(){
  앱.innerHTML =
   '<div class="card">' +
   '<h1>Some Days</h1>' +
   '<p class="note">Who is the one who is ill? The days are the same either way. Only the words change.</p>' +
   '<button class="btn solid" onclick="누구정함(\'husband\')">My husband is the one who is ill</button>' +
   '<button class="btn solid" onclick="누구정함(\'wife\')">My wife is the one who is ill</button>' +
   '<p class="note" style="margin-top:18px">Depression comes to anyone. To men and to women.</p>' +
   '</div>';
}
function 누구정함(w){ 누가아픈가 = w; 끝난편 = []; 저장(); 시작화면(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function 시작화면(){
  if (!누가아픈가) return 누구고르기();
  var 둘다 = 끝난편.indexOf('아픈사람') >= 0 && 끝난편.indexOf('곁의사람') >= 0;
  앱.innerHTML =
   '<div class="card">' +
   '<h1>Some Days</h1>' +
   '<p class="note">You live the same ten days twice. Once as the person who is ill, once as the person beside them.</p>' +
   '<p class="note">Some options cannot be picked. That is part of the story too.</p>' +
   '<button class="btn solid" onclick="편시작(\'아픈사람\')">' +
     아픈쪽() + '' + (끝난편.indexOf('아픈사람')>=0 ? ' · 다시' : '') + '</button>' +
   '<button class="btn" onclick="편시작(\'곁의사람\')">' +
     곁쪽() + '' + (끝난편.indexOf('곁의사람')>=0 ? ' · 다시' : '') + '</button>' +
   '<button class="btn" style="border-color:#2b2936;color:#8b8798" onclick="누구고르기()">Change who is ill</button>' +
   (둘다 ? '<button class="btn" onclick="마무리()">See the same evening from both sides</button>' : '') +
   '<div class="help">' +
   '<p style="margin:0 0 6px">This is not any one person’s story. It was built from accounts that people who lived it wrote publicly.</p>' +
   '<p style="margin:0">If today is very hard, you can call <a href="tel:988">988</a> (US) or your local crisis line. Free, 24 hours.</p>' +
   '</div></div>';
}

function 편시작(누구){ 편 = 누구; 칸 = 0; 그리기(); }

function 목록(){ return 편 === '아픈사람' ? 아픈사람 : 곁의사람; }

function 그리기(){
  var L = 목록();
  if (칸 >= L.length) return 편끝();
  var s = L[칸];
  var 때 = s.때;
  var 배경 = 때.indexOf('교회') >= 0 ? '교회'
            : (때.indexOf('Day 4') >= 0 || 때.indexOf('Day 8') >= 0) ? '길'
            : (때.indexOf('dawn') >= 0 || 때.indexOf('night') >= 0) ? '밤'
            : (때.indexOf('evening') >= 0) ? '저녁'
            : (때.indexOf('midday') >= 0) ? '낮' : '아침';
  if (편 === '아픈사람' && (때.indexOf('셋째') >= 0 || 때.indexOf('Day 3') >= 0)) 배경 = '교회';
  if (편 === '곁의사람' && (때.indexOf('셋째') >= 0 || 때.indexOf('Day 3') >= 0)) 배경 = '교회';
  var 이름 = 편 === '아픈사람' ? 아픈쪽() : 곁쪽();
  var h = '<div class="top"><span class="tag">' + 이름 + '</span><span>' + esc(s.때) + '</span></div>' +
          '<div class="gauge"><i style="width:' + s.힘 + '%"></i></div>' +
          '<div class="pic" style="background-image:url(' + 그림[배경] + ')"></div>' +
          '<p class="scene">' + esc(s.글) + '</p>' +
          '<p class="aside">' + esc(s.곁) + '</p>' +
          '<div class="opts">';
  s.고르기.forEach(function(o, i){
    h += '<button class="opt' + (o.잠김 ? ' locked' : '') + '"' +
         (o.잠김 ? ' aria-disabled="true" onclick="흔들기(this)"' : ' onclick="고름(' + i + ')"') +
         '>' + esc(o.말) + '</button>';
  });
  마지막배경 = 배경;
  앱.innerHTML = h + '</div>';
}

function 흔들기(el){ el.style.animation='none'; void el.offsetWidth; el.style.animation=''; }

var 마지막배경 = '아침';
function 고름(i){
  var s = 목록()[칸], o = s.고르기[i];
  앱.innerHTML = '<div class="top"><span class="tag">' +
    (편==='아픈사람'?아픈쪽():곁쪽()) + '</span><span>' + esc(s.때) + '</span></div>' +
    '<div class="gauge"><i style="width:' + s.힘 + '%"></i></div>' +
    '<div class="pic" style="background-image:url(' + 그림[마지막배경] + ')"></div>' +
    '<p class="scene">' + esc(o.뒤) + '</p>' +
    '<div class="opts"><button class="opt" onclick="Next()">Next</button></div>';
}

function Next(){ 칸++; 그리기(); }

function 편끝(){
  if (끝난편.indexOf(편) < 0) { 끝난편.push(편); 저장(); }
  var 상대 = 편 === '아픈사람' ? '곁의사람' : '아픈사람';
  var 상대이름 = 편 === '아픈사람' ? 곁쪽() : 아픈쪽();
  var 둘다 = 끝난편.length >= 2;
  앱.innerHTML = '<div class="card">' +
   '<h2>Ten days have passed</h2>' +
   (편 === '아픈사람'
     ? '<p>Some things could not be picked. Not because they were not wanted, but because they would not happen.</p>'
     : '<p>Some things could not be picked. Not for lack of love, but because there was nothing left.</p>') +
   '<p class="note">The same ten days were lived by ' + 상대이름 + '.</p>' +
   (둘다
     ? '<button class="btn solid" onclick="마무리()">See the same evening from both sides</button>'
     : '<button class="btn solid" onclick="편시작(\'' + 상대 + '\')">' + 상대이름 + ' — live these days</button>') +
   '<button class="btn" onclick="시작화면()">Start over</button>' +
   '</div>';
}

function 마무리(){
  앱.innerHTML = '<div class="card">' +
   '<h2>The same evening</h2>' +
   '<p class="note" style="margin-bottom:4px">' + 아픈쪽() + '</p>' +
   '<p>My mouth would not open. Lying was hard and saying sorry again was hard.</p>' +
   '<p class="note" style="margin-bottom:4px">' + 곁쪽() + '</p>' +
   '<p>I tried to hold the sigh and it came out. And I knew they heard it.</p>' +
   '<h2>Both of them had something they could not do</h2>' +
   '<p>한 사람은 대답할 것이 없어서 못 했고, 한 사람은 기다릴 힘이 남지 않아서 못 했습니다. ' +
   '둘 다 상대를 아프게 하려던 것이 아니었습니다.</p>' +
   '<p>아픈 사람의 고통은 당사자 말고는 잘 모릅니다. ' +
   '그런데 <b>곁에 있는 사람의 고통도 당사자 말고는 모릅니다.</b> 그래서 서로를 모른 채 같은 집에 삽니다.</p>' +
   '<h2>And on the eighth day</h2>' +
   '<p>한 사람은 "Want to walk for a bit?" 라고 물었고, 한 사람은 "Okay" 이라고 했습니다. 십 분쯤 걷고 들어왔습니다.</p>' +
   '<p>나은 것은 아닙니다. Next 날 또 못 일어날 수도 있습니다. 다만 그날은 그것 됐습니다.</p>' +
   '<h2>To anyone who played this</h2>' +
   '<p style="font-size:1.02rem">정신 버티라고, 이렇게 계속 살 거냐고 하지 말아 주세요. <b>오늘 하루 넘기는 게 목표인 사람도 있습니다.</b></p>' +
   '<p style="font-size:1.02rem">And one sentence from you can end a person. Healthy people cannot feel this.</p>' +
   '<p style="font-size:1.02rem">The die, die, die going on inside a head. <b>Those people are not failing to die. They are holding on, again, today.</b></p>' +
   '<p style="font-size:1.02rem">이 프로그램라도 조금이라도 알아주셨으면 좋겠습니다.</p>' +
   '<p class="note" style="margin-top:18px">— left here by one of the people who made this.</p>' +
   '<p class="note">There is no answer in this. Only this: the other person had grey buttons on their screen too.</p>' +
   '<button class="btn" onclick="시작화면()">Start over</button>' +
   '<div class="help">' +
   '<p style="margin:0 0 6px">If you are struggling — <a href="tel:988">988</a> (US, free, 24 hours) or your local crisis line</p>' +
   '<p style="margin:0">If you are the one caring — being worn out is not a failing. You need somewhere to say it too.</p>' +
   '</div></div>';
}

시작화면();
</script>
</body>
</html>
