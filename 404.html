<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>없는 페이지 — LeDeuxions</title>
<style>
  :root{--ink:#1a1a1a;--muted:#6b6b6b;--line:#e5e2dc;--bg:#faf8f5}
  @media (prefers-color-scheme: dark){
    :root{--ink:#e8e4dd;--muted:#8f8a82;--line:#2a2724;--bg:#141312}
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--ink);
       font:16px/1.7 -apple-system,'Apple SD Gothic Neo',BlinkMacSystemFont,'Segoe UI',sans-serif}
  main{max-width:520px;padding:40px 24px}
  .num{font-size:13px;letter-spacing:.18em;color:var(--muted);margin-bottom:18px}
  h1{font-size:26px;font-weight:600;margin:0 0 14px;line-height:1.4}
  p{color:var(--muted);margin:0 0 28px}
  nav{display:flex;flex-wrap:wrap;gap:10px}
  a{display:inline-block;padding:9px 16px;border:1px solid var(--line);border-radius:2px;
    color:var(--ink);text-decoration:none;font-size:14px}
  a:hover{border-color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="num">404</div>
  <h1>그 자리에는 아무것도 없습니다</h1>
  <p>주소가 바뀌었거나, 지운 페이지일 수 있습니다.<br>아래에서 찾으시는 것으로 가실 수 있습니다.</p>
  <nav>
    <a href="/">홈</a>
    <a href="/web-projects/">웹 도구</a>
    <a href="/web-projects/game-world/">게임월드</a>
    <a href="/work/">작품</a>
    <a href="/history/">이야기</a>
    <a href="/contact/">연락</a>
  </nav>
</main>
</body>
</html>
