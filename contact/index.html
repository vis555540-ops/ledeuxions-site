<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F5">
<meta name="description" content="LeDeuxions 연락처. 일정 예약, 이메일, 작업 문의.">
<title>연락 — LeDeuxions</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2824624880449066" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/css/claude-design.css">
<style>
    .contact-hero { padding: var(--space-7) 0 var(--space-5); text-align: center; }
    .contact-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--space-5);
    }
    @media (min-width: 920px) {
        .contact-grid { grid-template-columns: 1fr 1.4fr; align-items: start; }
    }
    .contact-info { display: flex; flex-direction: column; gap: var(--space-3); }
    .info-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: var(--space-5);
        display: flex;
        gap: var(--space-3);
        align-items: flex-start;
    }
    .info-card .ico {
        width: 44px; height: 44px;
        background: var(--accent-soft);
        color: var(--accent-deep);
        border-radius: var(--radius-md);
        display: grid; place-items: center;
        font-size: 1.2rem;
        flex-shrink: 0;
    }
    .info-card h4 {
        font-family: var(--font-sans);
        font-size: 0.92rem;
        font-weight: 600;
        margin: 0 0 4px;
    }
    .info-card p {
        margin: 0;
        font-size: 0.92rem;
        color: var(--text-secondary);
    }
    .info-card a { color: var(--accent); font-weight: 500; }
    .calendar-frame {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
        min-height: 600px;
    }
    .calendar-frame iframe {
        width: 100%;
        height: 600px;
        border: 0;
    }
</style>
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a href="/" class="nav-brand">
            <span class="nav-brand-mark">L</span>
            <span>LeDeuxions</span>
        </a>
        <button class="nav-toggle" data-nav-toggle aria-label="메뉴">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="nav-links" data-nav-menu>
            <a href="/" class="nav-link" data-nav-link>홈</a>
            <a href="/web-projects/" class="nav-link" data-nav-link>웹 도구</a>
            <a href="/work/" class="nav-link" data-nav-link>작품</a>
            <a href="/history/" class="nav-link" data-nav-link>이야기</a>
            <a href="/contact/" class="nav-link active" data-nav-link>연락</a>
        </div>
    </div>
</nav>

<header class="contact-hero container-narrow">
    <div class="eyebrow" style="margin-bottom:12px;">Contact</div>
    <h1>이야기를 <em style="color:var(--accent);font-style:italic;">시작</em>해요</h1>
    <p class="lead">작업 의뢰, 협업 제안, 그리고 그저 안부까지. 어떤 메시지든 환영입니다.</p>
</header>

<main class="container" style="padding-bottom:var(--space-9);">

<div class="contact-grid">

    <div class="contact-info">

        <div class="info-card">
            <div class="ico">✉️</div>
            <div>
                <h4>이메일</h4>
                <p><a href="mailto:vis555540@gmail.com">vis555540@gmail.com</a></p>
                <p style="font-size:.8rem;color:var(--text-muted);margin-top:6px;">평일 48시간 내 답신.</p>
            </div>
        </div>

        <div class="info-card">
            <div class="ico">🏠</div>
            <div>
                <h4>스튜디오</h4>
                <p>대한민국, 서울</p>
                <p style="font-size:.8rem;color:var(--text-muted);margin-top:6px;">방문은 사전 예약제.</p>
            </div>
        </div>

        <div class="info-card">
            <div class="ico">📅</div>
            <div>
                <h4>미팅 예약</h4>
                <p>오른쪽 캘린더에서 직접 선택하세요.</p>
            </div>
        </div>

        <div class="info-card">
            <div class="ico">🔗</div>
            <div>
                <h4>외부 채널</h4>
                <p>
                    <a href="https://ledeuxions.blogspot.com/" target="_blank" rel="noopener">Portfolio</a> ·
                    <a href="https://ledeuxions-column.blogspot.com/" target="_blank" rel="noopener">Column</a>
                </p>
            </div>
        </div>

    </div>

    <div class="calendar-frame">
        <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=1&bgcolor=%23FAF9F5&ctz=Asia%2FSeoul&showTitle=0&showPrint=0&showCalendars=0&mode=AGENDA"
                title="LeDeuxions Calendar"
                loading="lazy"></iframe>
    </div>

</div>

</main>

<footer class="site-footer">
    <div class="site-footer-inner">
        <div class="site-footer-bottom">
            <span>© 2005–2026 LeDeuxions.</span>
            <span class="mono" style="font-size:.78rem;">v2026.05</span>
        </div>
    </div>
</footer>

<script src="../assets/js/common.js"></script>
</body>
</html>
