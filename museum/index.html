<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>모두의 미술관 — 블록 빌더 (VR)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#87a9c9; font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; }
  #app { position:fixed; inset:0; }
  #hud {
    position:fixed; left:12px; top:12px; z-index:10;
    background:rgba(20,24,30,.72); color:#eee; padding:12px 14px;
    border-radius:10px; font-size:13px; line-height:1.6; max-width:280px;
    pointer-events:none; backdrop-filter:blur(4px);
  }
  #hud b { color:#ffd479; }
  #palette {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:10;
    display:flex; gap:8px; background:rgba(20,24,30,.72); padding:8px 10px; border-radius:12px;
    backdrop-filter:blur(4px);
  }
  .swatch { width:34px; height:34px; border-radius:7px; border:3px solid transparent; cursor:pointer; }
  .swatch.sel { border-color:#fff; }
  #startCard {
    position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    background:rgba(10,14,20,.78); backdrop-filter:blur(6px);
  }
  #startCard .box {
    background:#141821; color:#eee; padding:28px 30px; border-radius:16px; max-width:360px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  #startCard h1 { font-size:20px; margin-bottom:6px; color:#ffd479; }
  #startCard p { font-size:13.5px; line-height:1.7; color:#cfd6de; margin-bottom:8px; }
  #startCard .keys { font-size:12.5px; color:#9fb0c2; margin:12px 0 18px; }
  #startCard button {
    background:#ffd479; color:#1a1206; border:none; padding:12px 26px; font-size:15px;
    font-weight:700; border-radius:10px; cursor:pointer;
  }
  #crosshair {
    position:fixed; left:50%; top:50%; width:18px; height:18px; margin:-9px 0 0 -9px; z-index:5;
    pointer-events:none; opacity:.85;
  }
  #crosshair:before, #crosshair:after {
    content:""; position:absolute; background:#fff; box-shadow:0 0 2px #000;
  }
  #crosshair:before { left:8px; top:0; width:2px; height:18px; }
  #crosshair:after  { top:8px; left:0; height:2px; width:18px; }
  .hide { display:none !important; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud" class="hide">
  <b>모두의 미술관 — 블록 빌더</b><br>
  왼쪽클릭 <b>부수기</b> · 오른쪽클릭 <b>놓기</b><br>
  <b>WASD</b> 걷기 · <b>Space/Shift</b> 위·아래<br>
  <b>1~5</b> 블록색 · <b>ESC</b> 멈춤<br>
  오른쪽 아래 <b>VR</b> = 오큘러스로 입장
</div>

<div id="crosshair" class="hide"></div>

<div id="palette" class="hide"></div>

<div id="startCard">
  <div class="box">
    <h1>모두의 미술관 · 블록 빌더</h1>
    <p>마인크래프트처럼 블록을 쌓아 만드는 3D 공간이야.<br>화면을 클릭하면 시선이 잠기고 걸어다닐 수 있어.</p>
    <div class="keys">WASD 이동 · 마우스 시선 · 좌클릭 부수기 · 우클릭 놓기 · Space/Shift 위아래 · ESC 멈춤</div>
    <button id="enterBtn">들어가기</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';

const COLORS = [
  { name:'잔디', hex:0x6ab04c },
  { name:'흙',   hex:0x9c6b3f },
  { name:'돌',   hex:0x9aa0a6 },
  { name:'나무', hex:0xcaa06a },
  { name:'하늘', hex:0x5aa9e6 },
];
let curColor = 0;

// ---- 씬 ----
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a9c9);
scene.fog = new THREE.Fog(0x87a9c9, 30, 90);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 500);
camera.position.set(4, 3, 8);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.xr.enabled = true;
document.getElementById('app').appendChild(renderer.domElement);
document.body.appendChild(VRButton.createButton(renderer));

// ---- 조명 ----
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x556b55, 0.9));
const sun = new THREE.DirectionalLight(0xfff2d5, 1.1);
sun.position.set(20, 40, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-40; sun.shadow.camera.right=40;
sun.shadow.camera.top=40; sun.shadow.camera.bottom=-40;
scene.add(sun);

// ---- 블록 관리 ----
const BS = 1; // block size
const geo = new THREE.BoxGeometry(BS, BS, BS);
const matCache = {};
function matFor(i){
  if(!matCache[i]) matCache[i] = new THREE.MeshLambertMaterial({ color: COLORS[i].hex });
  return matCache[i];
}
const blocks = new Map();               // key "x,y,z" -> mesh
const pickables = [];                    // raycast 대상
const key = (x,y,z)=>`${x},${y},${z}`;

function addBlock(x,y,z,ci){
  const k = key(x,y,z);
  if(blocks.has(k)) return;
  const m = new THREE.Mesh(geo, matFor(ci));
  m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true;
  m.userData = {x,y,z,ci};
  scene.add(m); blocks.set(k,m); pickables.push(m);
}
function removeBlock(mesh){
  const {x,y,z} = mesh.userData;
  scene.remove(mesh);
  blocks.delete(key(x,y,z));
  const i = pickables.indexOf(mesh); if(i>=0) pickables.splice(i,1);
}

// ---- 시작 지형: 12x12 잔디 바닥 + 작은 집 ----
const N = 6;
for(let x=-N;x<=N;x++) for(let z=-N;z<=N;z++) addBlock(x,0,z,0);
// 작은 집
for(let x=1;x<=4;x++) for(let z=1;z<=4;z++){
  if(x===1||x===4||z===1||z===4){ addBlock(x,1,z,2); addBlock(x,2,z,2); }
}
for(let x=1;x<=4;x++) for(let z=1;z<=4;z++) addBlock(x,3,z,3); // 지붕
removeBlock(blocks.get(key(2,1,1))); // 문

// ---- 컨트롤(1인칭) ----
const controls = new PointerLockControls(camera, renderer.domElement);
scene.add(controls.object);
const move = { f:0, b:0, l:0, r:0, up:0, dn:0 };
const speed = 8;

const startCard = document.getElementById('startCard');
const hud = document.getElementById('hud');
const cross = document.getElementById('crosshair');
const paletteEl = document.getElementById('palette');

document.getElementById('enterBtn').onclick = ()=> controls.lock();
controls.addEventListener('lock', ()=>{
  startCard.classList.add('hide'); hud.classList.remove('hide');
  cross.classList.remove('hide'); paletteEl.classList.remove('hide');
});
controls.addEventListener('unlock', ()=>{
  startCard.classList.remove('hide');
});

addEventListener('keydown', e=>{
  switch(e.code){
    case 'KeyW': move.f=1; break;
    case 'KeyS': move.b=1; break;
    case 'KeyA': move.l=1; break;
    case 'KeyD': move.r=1; break;
    case 'Space': move.up=1; break;
    case 'ShiftLeft': case 'ShiftRight': move.dn=1; break;
    case 'Digit1': setColor(0); break;
    case 'Digit2': setColor(1); break;
    case 'Digit3': setColor(2); break;
    case 'Digit4': setColor(3); break;
    case 'Digit5': setColor(4); break;
  }
});
addEventListener('keyup', e=>{
  switch(e.code){
    case 'KeyW': move.f=0; break;
    case 'KeyS': move.b=0; break;
    case 'KeyA': move.l=0; break;
    case 'KeyD': move.r=0; break;
    case 'Space': move.up=0; break;
    case 'ShiftLeft': case 'ShiftRight': move.dn=0; break;
  }
});

// ---- 팔레트 UI ----
function buildPalette(){
  COLORS.forEach((c,i)=>{
    const s = document.createElement('div');
    s.className = 'swatch' + (i===curColor?' sel':'');
    s.style.background = '#'+c.hex.toString(16).padStart(6,'0');
    s.title = (i+1)+' '+c.name;
    s.onclick = ()=> setColor(i);
    paletteEl.appendChild(s);
  });
}
function setColor(i){
  curColor = i;
  [...paletteEl.children].forEach((el,idx)=> el.classList.toggle('sel', idx===i));
}
buildPalette();

// 검증용: ?auto 면 시작카드 숨기고 씬을 바로 비춤 (실사용엔 영향 없음)
if(location.search.includes('auto')){
  startCard.classList.add('hide');
  camera.position.set(10, 7, 11);
  camera.lookAt(2.5, 1, 2.5);
}

// ---- 블록 놓기/부수기 ----
const ray = new THREE.Raycaster();
const center = new THREE.Vector2(0,0);
renderer.domElement.addEventListener('mousedown', e=>{
  if(!controls.isLocked) return;
  ray.setFromCamera(center, camera);
  const hit = ray.intersectObjects(pickables)[0];
  if(!hit) return;
  if(e.button===0){                          // 부수기
    if(hit.object.userData.y===0 && Math.abs(hit.object.userData.x)===N) return;
    removeBlock(hit.object);
  } else if(e.button===2){                    // 놓기
    const n = hit.face.normal;
    const p = hit.object.userData;
    addBlock(p.x+n.x, p.y+n.y, p.z+n.z, curColor);
  }
});
renderer.domElement.addEventListener('contextmenu', e=> e.preventDefault());

// ---- 루프 ----
const clock = new THREE.Clock();
function frame(){
  const dt = Math.min(clock.getDelta(), 0.05);
  if(controls.isLocked){
    const v = speed*dt;
    if(move.f) controls.moveForward(v);
    if(move.b) controls.moveForward(-v);
    if(move.r) controls.moveRight(v);
    if(move.l) controls.moveRight(-v);
    if(move.up) controls.object.position.y += v;
    if(move.dn) controls.object.position.y -= v;
    if(controls.object.position.y < 1) controls.object.position.y = 1;
  }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
