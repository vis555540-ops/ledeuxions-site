<!doctype html>
<html lang="ko">
<head>
<link rel="canonical" href="https://ledeuxions.com/applications/iphoneheic/ko/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HEIC 변환기">
<meta name="description" content="HEIC를 JPG로 변환하는 PWA. 홈 화면에 추가해 오프라인에서도 사용 가능.">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
<title>HEIC 변환기 · PWA — LeDeuxions</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2824624880449066" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../../../assets/css/claude-design.css">
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<style>
    body { padding-bottom: env(safe-area-inset-bottom); }
    .app-hero { padding: var(--space-5) 0 var(--space-3); text-align: center; }
    .actions { display: flex; flex-direction: column; gap: var(--space-3); }
    .file-list {
        list-style: none; padding: 0; margin: var(--space-4) 0 0;
        display: flex; flex-direction: column; gap: var(--space-2);
    }
    .file-item {
        display: flex; gap: var(--space-3); align-items: center;
        padding: var(--space-3); background: var(--bg-sunken);
        border-radius: var(--radius-md);
    }
    .file-item .ico {
        width: 36px; height: 36px;
        background: var(--accent-soft); color: var(--accent-deep);
        border-radius: var(--radius-sm);
        display: grid; place-items: center;
    }
    .file-item .body { flex: 1; min-width: 0; }
    .file-item .name { font-size: 0.92rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-item .meta { font-size: 0.78rem; color: var(--text-muted); font-family: var(--font-mono); }
    .status-text {
        font-size: 0.88rem; color: var(--text-secondary);
        text-align: center;
        margin: var(--space-4) 0;
    }
    .info-row {
        display: flex; justify-content: space-between;
        padding: var(--space-3) 0;
        font-size: 0.92rem;
    }
    .info-row + .info-row { border-top: 1px solid var(--border); }
    .info-row .k { color: var(--text-muted); }
    .info-row .v { color: var(--text-primary); font-weight: 500; }
</style>
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a href="/" class="nav-brand">
            <span class="nav-brand-mark">L</span>
            <span>LeDeuxions</span>
        </a>
        <div class="nav-links" data-nav-menu style="display:flex">
            <a href="../en/" class="nav-link">EN</a>
        </div>
    </div>
</nav>

<header class="app-hero container-narrow">
    <div class="eyebrow" style="margin-bottom:8px;">PWA · 오프라인 지원</div>
    <h1 style="margin:0 0 8px;font-size:clamp(2rem,5vw,2.8rem);">HEIC <em style="color:var(--accent);font-style:italic;">변환기</em></h1>
    <p class="lead" style="margin-bottom:0;">아이폰 사진을 JPG로. 홈 화면에 추가하면 오프라인에서도 동작.</p>
</header>

<main class="container-narrow" style="padding-bottom:var(--space-9);">

<div class="card" style="padding:var(--space-5);">
    <div class="dropzone" id="drop">
        <div class="dropzone-icon">🖼️</div>
        <div class="dropzone-text">
            <strong>사진을 선택하거나 드래그</strong><br>
            <small>HEIC · HEIF · JPG · PNG</small>
        </div>
        <input type="file" id="fileInput" accept=".heic,.heif,image/heic,image/heif,image/jpeg,image/png" multiple hidden>
    </div>

    <p class="status-text" id="statusText">HEIC 사진을 선택하여 JPG로 변환합니다.</p>

    <ul class="file-list" id="fileList"></ul>

    <div class="actions" style="margin-top:var(--space-5);">
        <button class="btn btn-primary" id="convertButton" disabled>변환 시작</button>
        <button class="btn btn-secondary hidden" id="shareBtn">공유 및 저장</button>
    </div>
</div>

<div class="card" style="margin-top:var(--space-5);padding:var(--space-5);">
    <h3 style="margin:0 0 var(--space-3);font-size:1rem;font-weight:600;">정보</h3>
    <div class="info-row"><span class="k">품질</span><span class="v">고화질</span></div>
    <div class="info-row"><span class="k">보안</span><span class="v">기기 내 처리 (Local)</span></div>
    <div class="info-row"><span class="k">오프라인</span><span class="v">홈 화면 추가 후 가능</span></div>
</div>

</main>

<footer class="site-footer">
    <div class="site-footer-inner">
        <div class="site-footer-bottom">
            <span>© 2005–2026 LeDeuxions.</span>
            <span><a href="/applications/">← Applications</a></span>
        </div>
    </div>
</footer>

<script>
window.APP_TEXTS = {
    invalidFiles: 'HEIC 파일만 선택해주세요',
    fileTooLarge: '50MB 이하만 가능합니다',
    converting: '변환 중...',
    success: '완료',
    error: '오류 발생'
};
</script>
<script src="../../../assets/js/common.js"></script>
<script>
(function () {
    'use strict';
    var drop = document.getElementById('drop');
    var input = document.getElementById('fileInput');
    var list = document.getElementById('fileList');
    var btn = document.getElementById('convertButton');
    var statusText = document.getElementById('statusText');
    var items = [];

    drop.addEventListener('click', function () { input.click(); });
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('is-active'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('is-active'); });
    drop.addEventListener('drop', function (e) {
        e.preventDefault(); drop.classList.remove('is-active');
        addFiles(Array.from(e.dataTransfer.files));
    });
    input.addEventListener('change', function () { addFiles(Array.from(input.files)); });

    function addFiles(files) {
        files.forEach(function (f) {
            if (!/heic|heif|jpeg|png/i.test(f.type) && !/\.(heic|heif|jpe?g|png)$/i.test(f.name)) return;
            items.push({ file: f, blob: null, done: false });
        });
        render();
    }

    function render() {
        list.innerHTML = '';
        items.forEach(function (it, i) {
            var li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = '<div class="ico">' + (it.done ? '✓' : '🖼') + '</div>' +
                '<div class="body"><div class="name"></div><div class="meta"></div></div>';
            li.querySelector('.name').textContent = it.file.name;
            li.querySelector('.meta').textContent = LD.formatBytes(it.file.size) +
                (it.blob ? ' → ' + LD.formatBytes(it.blob.size) : '');
            list.appendChild(li);
        });
        btn.disabled = items.length === 0;
        statusText.textContent = items.length ? items.length + '장 준비됨' : 'HEIC 사진을 선택하여 JPG로 변환합니다.';
    }

    btn.addEventListener('click', async function () {
        btn.disabled = true;
        statusText.textContent = '변환 중…';
        for (var i = 0; i < items.length; i++) {
            var it = items[i];
            if (it.done) continue;
            statusText.textContent = '변환 중… (' + (i + 1) + '/' + items.length + ')';
            try {
                var isHeic = /heic|heif/i.test(it.file.type) || /\.(heic|heif)$/i.test(it.file.name);
                var blob;
                if (isHeic) {
                    blob = await heic2any({ blob: it.file, toType: 'image/jpeg', quality: 0.92 });
                    if (Array.isArray(blob)) blob = blob[0];
                } else {
                    blob = it.file;
                }
                it.blob = blob;
                it.done = true;
                LD.download(blob, it.file.name.replace(/\.[^.]+$/, '') + '.jpg');
                render();
            } catch (e) {
                console.error(e);
            }
        }
        statusText.textContent = '완료 · ' + items.filter(function (x) { return x.done; }).length + '장 저장';
        btn.disabled = false;
    });
})();
</script>
  <script src="/count.js" defer></script>
</body>
</html>
