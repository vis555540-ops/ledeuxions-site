<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지 이동 중...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        
        .container {
            text-align: center;
            width: 90%;
            max-width: 1200px;
        }
        
        .message {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .countdown {
            font-size: 72px;
            font-weight: 800;
            margin: 20px 0;
            color: #ffd700;
        }
        
        .subtitle {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 40px;
        }
        

        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .skip-link {
            margin-top: 20px;
            color: white;
            text-decoration: underline;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.8;
        }
        
        .skip-link:hover {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .message {
                font-size: 20px;
            }
            .countdown {
                font-size: 48px;
            }
            .ad-container {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="message">잠시만 기다려주세요...</div>

        
        <div class="spinner"></div>
        
        <!-- 전면 광고 (Interstitial) -->

        

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const destination = urlParams.get('to') || '/';
        window.location.href = destination;
    </script>
</body>
</html>
