<style>
    .app-hero { padding: var(--space-6) 0 var(--space-4); text-align: center; }
    .app-hero h1 { margin: 0 0 var(--space-2); }
    .app-hero p { color: var(--text-secondary); margin: 0; }

    .game-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: var(--space-4);
        padding-bottom: var(--space-7);
    }
    .stage {
        position: relative;
        width: 100%;
        max-width: 420px;
        aspect-ratio: 400 / 600;
        border-radius: var(--radius-lg);
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-md);
        background: #cfe4f2;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
        cursor: pointer;
    }
    .stage canvas { display: block; width: 100%; height: 100%; }

    .hud {
        position: absolute;
        top: 0; left: 0; right: 0;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 14px 16px;
        pointer-events: none;
        font-family: var(--font-sans);
    }
    .hud .floors { text-align: left; }
    .hud .best { text-align: right; }
    .hud .label {
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.85);
        text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    }
    .hud .value {
        font-size: 2rem;
        font-weight: 700;
        line-height: 1;
        color: #fff;
        text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .hud .best .value { font-size: 1.25rem; }

    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-3);
        text-align: center;
        padding: var(--space-5);
        background: rgba(20, 30, 45, 0.62);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        color: #fff;
        transition: opacity 0.2s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay h2 { margin: 0; color: #fff; font-size: 1.6rem; }
    .overlay p { margin: 0; color: rgba(255,255,255,0.9); max-width: 22ch; }
    .overlay .big-score { font-size: 3rem; font-weight: 700; line-height: 1; margin: 4px 0; }
    .play-btn {
        margin-top: var(--space-2);
        padding: 12px 28px;
        border-radius: var(--radius-md);
        background: #fff;
        color: #1a2438;
        font-family: var(--font-sans);
        font-weight: 600;
        font-size: 1rem;
        border: none;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        transition: transform 0.08s ease;
    }
    .play-btn:active { transform: scale(0.96); }

    .hint { color: var(--text-tertiary); font-size: 0.85rem; text-align: center; }
    .ad-slot { width: 100%; max-width: 420px; margin: 0 auto; min-height: 90px; }
</style>

<main class="container">
    <section class="app-hero">
        <h1>🏗️ 건축 타워 빌더</h1>
        <p>블록을 정확히 쌓아 건물을 올려라. 삐끗하면 그만큼 잘려나가요.</p>
    </section>

    <div class="game-wrap">
        <div class="stage" id="stage">
            <canvas id="game" width="400" height="600"></canvas>
            <div class="hud">
                <div class="floors">
                    <div class="label">층수</div>
                    <div class="value" id="floors">0</div>
                </div>
                <div class="best">
                    <div class="label">최고</div>
                    <div class="value" id="best">0</div>
                </div>
            </div>
            <div class="overlay" id="overlay">
                <h2 id="ov-title">건물을 지어봐요</h2>
                <p id="ov-desc">움직이는 블록이 아래 층과 맞을 때 <b>탭 / 클릭 / 스페이스</b>로 내려놓으세요.</p>
                <button class="play-btn" id="playBtn">시작하기</button>
                <a href="../ranking/" style="margin-top:14px;color:#fff;opacity:.85;text-decoration:underline;font-size:.9rem;">🏆 전체 순위 보기</a>
            </div>
        </div>
        <p class="hint">탭 · 클릭 · 스페이스바로 블록을 내려놓아요 · 완벽하게 맞추면 콤보 보너스로 다시 넓어져요</p>
        <p class="hint" style="opacity:.7">🏗️ 부장 &amp; 이음 공동제작 — LeDeuxions</p>

        <div class="ad-slot">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-2824624880449066"
                 data-ad-slot="0000000000"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
        </div>
    </div>
</main>

<script>
(function () {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    // devicePixelRatio 대응(선명하게)
    function fitDPR() {
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        if (canvas._dpr === dpr) return;
        canvas._dpr = dpr;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    fitDPR();
    window.addEventListener('resize', fitDPR);

    const BH = 30;                 // 블록 높이(논리 px)
    const GROUND = H - 40;         // 첫 블록 바닥 y
    const BASE_W = 210;            // 첫 블록 폭
    const PERFECT = 5;             // 완벽 판정 허용 오차(px)

    const floorsEl = document.getElementById('floors');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovDesc = document.getElementById('ov-desc');
    const playBtn = document.getElementById('playBtn');
    const stage = document.getElementById('stage');

    let best = parseInt(localStorage.getItem('tower_best') || '0', 10);
    bestEl.textContent = best;

    let state = 'ready';           // ready | playing | over
    let blocks, current, falls, camY, camTarget, combo, shake, parts, newRecord;

    function hueFor(level) { return (200 + level * 9) % 360; }

    function reset() {
        blocks = [{ x: (W - BASE_W) / 2, w: BASE_W, level: 0 }];
        camY = 0; camTarget = 0; combo = 0; falls = []; shake = 0; parts = []; newRecord = false;
        spawn();
        floorsEl.textContent = '0';
    }

    function spawn() {
        const top = blocks[blocks.length - 1];
        const level = top.level + 1;
        const w = top.w;
        const speed = Math.min(2.0 + level * 0.09, 6.2);
        const fromLeft = level % 2 === 0;
        current = {
            x: fromLeft ? 0 : W - w,   // 화면 안 가장자리에서 시작(바로 보이게)
            w,
            level,
            dir: fromLeft ? 1 : -1,
            speed
        };
        updateCamera(level);
    }

    function updateCamera(level) {
        // 최근 블록이 화면 하단 28% 근처에 오도록 카메라를 위로 올림
        const topY = GROUND - level * BH;
        camTarget = Math.min(0, topY - H * 0.62);
    }

    function blockY(level) { return GROUND - level * BH; }

    function drop() {
        if (state !== 'playing') return;
        const prev = blocks[blocks.length - 1];
        const overlapL = Math.max(current.x, prev.x);
        const overlapR = Math.min(current.x + current.w, prev.x + prev.w);
        const overlap = overlapR - overlapL;

        if (overlap <= 0) {
            // 완전히 빗나감 → 통째로 떨어지고 게임오버
            falls.push({ x: current.x, y: blockY(current.level), w: current.w,
                         vx: current.dir * 1.5, vy: -1, level: current.level });
            gameOver();
            return;
        }

        const diff = Math.abs(current.x - prev.x);
        let newX = overlapL, newW = overlap;

        if (diff <= PERFECT) {
            // 완벽 — 콤보, 살짝 넓혀주는 보너스
            combo++;
            newX = prev.x;
            newW = Math.min(prev.w + Math.min(combo * 4, 16), BASE_W);
            popCombo(newX, newW, current.level);
        } else {
            combo = 0;
            // 삐져나온 조각은 떨어뜨림
            if (current.x < prev.x) {
                falls.push({ x: current.x, y: blockY(current.level), w: overlapL - current.x,
                             vx: -1.4, vy: -1, level: current.level });
            } else {
                falls.push({ x: overlapR, y: blockY(current.level), w: (current.x + current.w) - overlapR,
                             vx: 1.4, vy: -1, level: current.level });
            }
        }

        shake = 6;
        blocks.push({ x: newX, w: newW, level: current.level });
        floorsEl.textContent = current.level;

        if (current.level > best) {
            best = current.level;
            bestEl.textContent = best;
            localStorage.setItem('tower_best', String(best));
            newRecord = true;
        }
        spawn();
    }

    let comboFlash = 0;
    function popCombo(bx, bw, level) {
        comboFlash = 1;
        // perfect 콤보 파티클 버스트 (이음 아이디어)
        const hue = hueFor(level);
        const y = blockY(level);
        const n = 14;
        for (let i = 0; i < n; i++) {
            const a = Math.PI * (0.15 + 0.7 * (i / (n - 1)));  // 위쪽으로 퍼지게
            const sp = 2 + Math.random() * 2.5;
            parts.push({
                x: bx + bw * (0.15 + 0.7 * Math.random()),
                y: y,
                vx: Math.cos(a) * sp * (Math.random() < 0.5 ? -1 : 1),
                vy: -Math.abs(Math.sin(a) * sp) - 1,
                life: 1,
                hue: hue
            });
        }
    }

    function gameOver() {
        state = 'over';
        const score = blocks[blocks.length - 1].level;
        ovTitle.textContent = '무너졌어요!';
        ovDesc.innerHTML = '<span class="big-score">' + score + '층</span>' +
            (newRecord && score > 0 ? '<br>신기록! 🏆' : '<br>최고 ' + best + '층') +
            '<br><span id="rankLine" style="opacity:.9;font-size:.95rem"></span>';
        playBtn.textContent = '다시 짓기';
        overlay.classList.remove('hidden');
        // 신기록이면 전세계 랭킹 제출·표시
        if (newRecord && score > 0 && window.Arcade) {
            const line = document.getElementById('rankLine');
            if (line) line.textContent = '🌍 순위 확인 중…';
            Arcade.submit('tower', score).then(function (res) {
                const el = document.getElementById('rankLine');
                if (el) el.textContent = Arcade.rankText(res);
            });
        }
    }

    function start() {
        if (window.Arcade) Arcade.ensureName();   // 최초 1회 이름 입력
        reset();
        state = 'playing';
        overlay.classList.add('hidden');
    }

    // ---- 렌더링 ----
    function drawBlock(x, y, w, level, alpha) {
        const h = BH;
        const hue = hueFor(level);
        ctx.globalAlpha = alpha == null ? 1 : alpha;
        // 몸체(콘크리트 톤 + 층별 색)
        ctx.fillStyle = 'hsl(' + hue + ', 42%, 62%)';
        ctx.fillRect(x, y, w, h);
        // 윗면 하이라이트
        ctx.fillStyle = 'hsla(' + hue + ', 45%, 74%, 1)';
        ctx.fillRect(x, y, w, 4);
        // 창문 격자(건물 느낌)
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        const winW = 8, winH = 12, gap = 8;
        const usable = w - gap;
        const cols = Math.max(0, Math.floor(usable / (winW + gap)));
        const startX = x + (w - (cols * (winW + gap) - gap)) / 2;
        for (let i = 0; i < cols; i++) {
            ctx.fillRect(startX + i * (winW + gap), y + (h - winH) / 2, winW, winH);
        }
        ctx.globalAlpha = 1;
    }

    function render() {
        ctx.clearRect(0, 0, W, H);

        // 하늘 그라데이션
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#bfe0f5');
        sky.addColorStop(1, '#eaf4fb');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        const sx = shake ? (Math.random() - 0.5) * shake : 0;
        ctx.save();
        ctx.translate(sx, -camY);

        // 지반
        ctx.fillStyle = '#8a9bab';
        ctx.fillRect(0, GROUND, W, H - GROUND + 200);

        // 쌓인 블록
        for (const b of blocks) drawBlock(b.x, blockY(b.level), b.w, b.level);

        // 떨어지는 조각
        for (const f of falls) drawBlock(f.x, f.y, f.w, f.level);

        // 현재 움직이는 블록
        if (state === 'playing') drawBlock(current.x, blockY(current.level), current.w, current.level);

        // perfect 파티클
        for (const pt of parts) {
            ctx.globalAlpha = Math.max(0, pt.life);
            ctx.fillStyle = 'hsl(' + pt.hue + ', 80%, 62%)';
            ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
        }
        ctx.globalAlpha = 1;

        ctx.restore();

        // 콤보 플래시
        if (comboFlash > 0) {
            ctx.globalAlpha = comboFlash;
            ctx.fillStyle = '#ffd34d';
            ctx.font = '700 22px ' + getFont();
            ctx.textAlign = 'center';
            ctx.fillText('완벽! +콤보', W / 2, H * 0.3);
            ctx.globalAlpha = 1;
        }
    }

    function getFont() {
        return "system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif";
    }

    function update() {
        // 카메라 부드럽게
        camY += (camTarget - camY) * 0.12;
        if (shake > 0) shake *= 0.8, shake < 0.4 && (shake = 0);
        if (comboFlash > 0) comboFlash -= 0.02;

        if (state === 'playing') {
            current.x += current.dir * current.speed;
            const rightLimit = W;
            if (current.x + current.w > rightLimit && current.dir > 0) {
                current.x = rightLimit - current.w; current.dir = -1;
            } else if (current.x < 0 && current.dir < 0) {
                current.x = 0; current.dir = 1;
            }
        }

        // 떨어지는 조각 물리
        for (const f of falls) { f.vy += 0.5; f.y += f.vy; f.x += f.vx; f.rot = (f.rot||0); }
        falls = falls.filter(f => f.y < blockY(0) + 400);

        // 파티클 물리
        for (const pt of parts) { pt.vy += 0.18; pt.x += pt.vx; pt.y += pt.vy; pt.life -= 0.028; }
        parts = parts.filter(pt => pt.life > 0);
    }

    function loop() {
        update();
        render();
        requestAnimationFrame(loop);
    }

    // ---- 입력 ----
    function onTap(e) {
        if (state === 'playing') { e.preventDefault(); drop(); }
    }
    stage.addEventListener('pointerdown', onTap);
    window.addEventListener('keydown', function (e) {
        if (e.code === 'Space' || e.code === 'ArrowDown') {
            e.preventDefault();
            if (state === 'playing') drop();
            else if (state !== 'playing') start();
        }
    });
    playBtn.addEventListener('click', function (e) { e.stopPropagation(); start(); });

    reset();
    state = 'ready';
    loop();

    // 애드센스 (슬롯 있을 때만)
    try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
})();
</script>
<script src="../arcade.js"></script>
<script src="../../../assets/js/common.js"></script>
