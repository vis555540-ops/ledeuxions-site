<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#16241c">
<meta name="description" content="이음 스네이크 — 스와이프·화살표로 뱀을 조종해 먹이를 먹고 길어지는 클래식 게임. 먹을수록 빨라져요. 설치 없이 브라우저에서 바로.">
<meta property="og:title" content="이음 스네이크 — LeDeuxions 게임월드">
<meta property="og:description" content="뱀을 조종해 먹이를 먹고 길게! 점점 빨라지는 스네이크 게임.">
<title>🐍 이음 스네이크 — LeDeuxions</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2824624880449066" crossorigin="anonymous"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  body { min-height:100vh; font-family:-apple-system,'Malgun Gothic',sans-serif;
    background:linear-gradient(160deg,#16241c,#1d3a2c); color:#fff; overscroll-behavior:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; touch-action:none; }
  a.back { position:fixed; top:16px; left:18px; color:#fff; opacity:.6; text-decoration:none; font-size:15px; }
  h1 { font-size:24px; font-weight:800; margin-bottom:4px; }
  #sc { font-size:14px; color:#8ef0b0; font-weight:700; margin-bottom:12px; }
  #board { background:rgba(0,0,0,.28); border-radius:14px; box-shadow:inset 0 0 24px rgba(0,0,0,.3); touch-action:none; }
  #hint { font-size:13px; opacity:.6; margin-top:12px; }
  #start { margin-top:16px; padding:13px 40px; font-size:18px; font-weight:800; color:#16241c;
    background:linear-gradient(180deg,#a9f5c8,#5fe08e); border:none; border-radius:40px;
    box-shadow:0 6px 18px rgba(95,224,142,.4); cursor:pointer; }
  #start:active{ transform:translateY(2px); }
</style>
</head>
<body>
  <a class="back" href="../">← 게임월드</a>
  <h1>🐍 이음 스네이크</h1>
  <div id="sc">점수 0 · 최고 0</div>
  <canvas id="board"></canvas>
  <div id="hint">스와이프 / 화살표로 조작</div>
  <button id="start">시작</button>
  <div style="position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:12px;opacity:.45;">🐍 이음 제작 — LeDeuxions 게임월드</div>
<script>
const cv=document.getElementById('board'), ctx=cv.getContext('2d');
const scEl=document.getElementById('sc'), startBtn=document.getElementById('start');
const N=17, CELL=Math.floor(Math.min(window.innerWidth-40, 340)/N), SZ=N*CELL;
cv.width=SZ; cv.height=SZ;
let best=+(localStorage.getItem('snake_best')||0);
let snake, dir, nextDir, food, score, timer, alive=false;

function reset(){
  if(window.Arcade) Arcade.ensureName();
  snake=[{x:8,y:8},{x:7,y:8},{x:6,y:8}]; dir={x:1,y:0}; nextDir=dir;
  score=0; placeFood(); alive=true; startBtn.style.display='none';
  scEl.textContent='점수 0 · 최고 '+best;
  clearInterval(timer); timer=setInterval(tick, 130); draw();
}
function placeFood(){ while(true){ const f={x:(Math.random()*N)|0,y:(Math.random()*N)|0};
  if(!snake.some(s=>s.x===f.x&&s.y===f.y)){ food=f; return; } } }
function tick(){
  dir=nextDir;
  const h={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)) return over();
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){ score++; scEl.textContent='점수 '+score+' · 최고 '+best;
    placeFood(); if(score%5===0){ clearInterval(timer); timer=setInterval(tick, Math.max(70,130-score*2)); } }
  else snake.pop();
  draw();
}
function over(){ alive=false; clearInterval(timer);
  const rec = score>best;
  if(rec){ best=score; localStorage.setItem('snake_best',best); }
  scEl.textContent='끝! 점수 '+score+' · 최고 '+best;
  startBtn.textContent='다시'; startBtn.style.display='block';
  if(rec && score>0 && window.Arcade){ Arcade.submit('snake',score).then(r=>{ if(r) scEl.textContent='끝! '+score+'점 · '+Arcade.rankText(r); }); }
}
function draw(){
  ctx.fillStyle='rgba(0,0,0,.15)'; ctx.fillRect(0,0,SZ,SZ);
  // 먹이
  ctx.fillStyle='#ff6b6b';
  ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL/2-1, 0, 6.29); ctx.fill();
  // 뱀
  snake.forEach((s,i)=>{ ctx.fillStyle = i===0 ? '#8ef0b0' : 'hsl(145,55%,'+(58-Math.min(i,20))+'%)';
    const p=1; ctx.fillRect(s.x*CELL+p, s.y*CELL+p, CELL-p*2, CELL-p*2); });
}
function setDir(x,y){ if(!alive) return; if(x===-dir.x&&y===-dir.y) return; nextDir={x,y}; }
window.addEventListener('keydown',e=>{ const k=e.key;
  if(k==='ArrowUp'){e.preventDefault();setDir(0,-1);} else if(k==='ArrowDown'){e.preventDefault();setDir(0,1);}
  else if(k==='ArrowLeft'){setDir(-1,0);} else if(k==='ArrowRight'){setDir(1,0);} });
let tsx,tsy;
cv.addEventListener('touchstart',e=>{ const t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; },{passive:true});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); },{passive:false});
cv.addEventListener('touchend',e=>{ const t=e.changedTouches[0], dx=t.clientX-tsx, dy=t.clientY-tsy;
  if(Math.abs(dx)<15&&Math.abs(dy)<15) return;
  if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1); });
startBtn.addEventListener('click',reset);
// 초기 화면
ctx.fillStyle='rgba(0,0,0,.15)'; ctx.fillRect(0,0,SZ,SZ);
ctx.fillStyle='#5fe08e'; ctx.font='16px sans-serif'; ctx.textAlign='center';
ctx.fillText('🐍 시작을 눌러', SZ/2, SZ/2);
</script>
<script src="../arcade.js"></script>
</body>
</html>
