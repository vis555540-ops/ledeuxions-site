<style>
    .app-hero { padding: var(--space-6) 0 var(--space-4); text-align: center; }
    .app-hero h1 { margin: 0 0 var(--space-2); }
    .app-hero p { color: var(--text-secondary); margin: 0; }
    .game-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); padding-bottom: var(--space-7); }
    .stage {
        position: relative; width: 100%; max-width: 420px; aspect-ratio: 400 / 600;
        border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border);
        box-shadow: var(--shadow-md); background: #bfe0f5; user-select: none; -webkit-user-select: none;
        touch-action: manipulation; cursor: pointer;
    }
    .stage canvas { display: block; width: 100%; height: 100%; }
    .hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
        align-items: flex-start; padding: 14px 16px; pointer-events: none; font-family: var(--font-sans); }
    .hud .label { font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase;
        color: rgba(255,255,255,0.9); text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
    .hud .value { font-size: 2rem; font-weight: 700; line-height: 1; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }
    .hud .best { text-align: right; }
    .hud .best .value { font-size: 1.25rem; }
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: var(--space-3); text-align: center; padding: var(--space-5);
        background: rgba(20, 30, 45, 0.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
        color: #fff; transition: opacity 0.2s ease; }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    .overlay h2 { margin: 0; color: #fff; font-size: 1.6rem; }
    .overlay p { margin: 0; color: rgba(255,255,255,0.92); max-width: 24ch; }
    .overlay .big-score { font-size: 3rem; font-weight: 700; line-height: 1; margin: 4px 0; }
    .play-btn { margin-top: var(--space-2); padding: 12px 28px; border-radius: var(--radius-md);
        background: #fff; color: #1a2438; font-family: var(--font-sans); font-weight: 600; font-size: 1rem;
        border: none; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.25); transition: transform 0.08s ease; }
    .play-btn:active { transform: scale(0.96); }
    .hint { color: var(--text-tertiary); font-size: 0.85rem; text-align: center; }
    .ad-slot { width: 100%; max-width: 420px; margin: 0 auto; min-height: 90px; }
</style>

<main class="container">
    <section class="app-hero">
        <h1>🚀 고무줄 점프</h1>
        <p>딱 맞는 순간에 탭! 반동으로 점점 높이 — 지구 밖 우주까지.</p>
    </section>

    <div class="game-wrap">
        <div class="stage" id="stage">
            <canvas id="game" width="400" height="600"></canvas>
            <div class="hud">
                <div><div class="label">고도</div><div class="value" id="alt">0 m</div></div>
                <div class="best"><div class="label">최고</div><div class="value" id="best">0 m</div></div>
            </div>
            <div class="overlay" id="overlay">
                <h2 id="ov-title">고무줄 점프</h2>
                <p id="ov-desc">캐릭터가 <b>고무줄에 닿기 직전</b> 탭하면 더 높이 튀어올라요. 너무 일찍 누르면 헛발!</p>
                <button class="play-btn" id="playBtn">시작하기</button>
                <a href="../ranking/" style="margin-top:12px;color:#fff;opacity:.85;text-decoration:underline;font-size:.9rem;">🏆 전체 순위 보기</a>
            </div>
        </div>
        <p class="hint">탭 · 클릭 · 스페이스 — 고무줄에 닿기 직전 타이밍이 핵심! 완벽할수록 높이 올라가요</p>
        <p class="hint" style="opacity:.7">🚀 부장 &amp; 이음 공동제작 — LeDeuxions</p>
        <div class="ad-slot">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2824624880449066"
                 data-ad-slot="0000000000" data-ad-format="auto" data-full-width-responsive="true"></ins>
        </div>
    </div>
</main>

<script>
(function () {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    function fitDPR() {
        const dpr = Math.min(window.devicePixelRatio || 1, 3);
        if (canvas._dpr === dpr) return;
        canvas._dpr = dpr; canvas.width = W * dpr; canvas.height = H * dpr;
        canvas.style.width = '100%'; canvas.style.height = '100%';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    fitDPR(); window.addEventListener('resize', fitDPR);

    const G = 0.55;                 // 중력(단위/프레임²)
    const CHAR_SCREEN = H * 0.72;   // 캐릭터가 그려지는 화면 y (고정)
    const CHAR_R = 15;              // 캐릭터 반지름
    const PERFECT_BAND = 16;        // 이 고도 이하에서 탭하면 perfect
    const GOOD_BAND = 55;           // 이 고도 이하면 good
    const M_PER_UNIT = 0.12;        // 고도 단위→미터 환산

    const altEl = document.getElementById('alt');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovDesc = document.getElementById('ov-desc');
    const playBtn = document.getElementById('playBtn');
    const stage = document.getElementById('stage');

    let best = parseInt(localStorage.getItem('jump_best') || '0', 10);
    bestEl.textContent = best + ' m';

    let state = 'ready';            // ready | playing | over
    let a, va, camA, maxA, tapAltitude, canTap, feedback, feedTimer, stars, newRecord;

    function reset() {
        a = 0; va = 13; camA = 0; maxA = 0;   // 첫 튕김으로 시작
        tapAltitude = null; canTap = false; feedback = ''; feedTimer = 0; newRecord = false;
        stars = [];
        for (let i = 0; i < 60; i++) stars.push({ x: Math.random() * W, w: Math.random() * 2000, s: Math.random() * 1.5 + 0.5 });
        altEl.textContent = '0 m';
    }

    function meters(units) { return Math.max(0, Math.floor(units * M_PER_UNIT)); }

    function bounce() {
        const impact = Math.abs(va);
        let q;
        if (tapAltitude !== null && tapAltitude <= PERFECT_BAND) q = 'perfect';
        else if (tapAltitude !== null && tapAltitude <= GOOD_BAND) q = 'good';
        else q = 'miss';
        tapAltitude = null;

        let up;
        if (q === 'perfect') { up = impact + 2.6; feedback = 'PERFECT! 🚀'; }
        else if (q === 'good') { up = impact + 0.5; feedback = 'Good!'; }
        else { up = impact * 0.58; feedback = '헛발!'; }
        up = Math.min(up, 36);
        feedTimer = 1;

        if (up < 2.2) { va = -up; gameOver(); return; }  // 반동이 죽으면 추락→끝
        va = up; a = 0; canTap = false;
    }

    function gameOver() {
        state = 'over';
        const sc = meters(maxA);
        ovTitle.textContent = '떨어졌어요!';
        ovDesc.innerHTML = '<span class="big-score">' + sc + ' m</span>' +
            (newRecord && sc > 0 ? '<br>최고 고도 신기록! 🏆' : '<br>최고 ' + best + ' m') +
            '<br><span id="rankLine" style="opacity:.9;font-size:.95rem"></span>';
        playBtn.textContent = '다시 뛰기';
        overlay.classList.remove('hidden');
        if (newRecord && sc > 0 && window.Arcade) {
            const l = document.getElementById('rankLine'); if (l) l.textContent = '🌍 순위 확인 중…';
            Arcade.submit('jump', sc).then(function (res) {
                const el = document.getElementById('rankLine'); if (el) el.textContent = Arcade.rankText(res);
            });
        }
    }

    function start() {
        if (window.Arcade) Arcade.ensureName();
        reset(); state = 'playing'; overlay.classList.add('hidden');
    }

    function tap() {
        if (state !== 'playing') return;
        if (canTap && va < 0) { tapAltitude = a; canTap = false; }  // 하강 중 한 번만 장전
    }

    // 색 보간
    function lerp(a, b, t) { return a + (b - a) * Math.max(0, Math.min(1, t)); }
    function skyColor(m) {
        // 0m 하늘 → 높을수록 우주
        const t = Math.min(m / 220, 1);
        const top = [lerp(191, 6, t), lerp(224, 10, t), lerp(245, 30, t)];
        const bot = [lerp(234, 20, t), lerp(244, 24, t), lerp(251, 60, t)];
        return { top: 'rgb(' + top.map(Math.round).join(',') + ')', bot: 'rgb(' + bot.map(Math.round).join(',') + ')', space: t };
    }

    function render() {
        const m = meters(maxA >= a ? maxA : a);
        const sky = skyColor(meters(camA));
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, sky.top); grad.addColorStop(1, sky.bot);
        ctx.fillStyle = grad; ctx.fillRect(0, 0, W, H);

        // 별 (우주로 갈수록 진하게)
        if (sky.space > 0.15) {
            ctx.globalAlpha = Math.min(sky.space, 1);
            ctx.fillStyle = '#fff';
            for (const st of stars) {
                const sy = ((st.w - camA) % (H + 400) + (H + 400)) % (H + 400) - 200;
                ctx.fillRect(st.x, sy, st.s, st.s);
            }
            ctx.globalAlpha = 1;
        }

        // 월드→화면: 화면y = CHAR_SCREEN - (worldA - camA)
        const toScreen = w => CHAR_SCREEN - (w - camA);

        // 고무줄(트램폴린) at worldA=0
        const ty = toScreen(0);
        if (ty < H + 40) {
            ctx.strokeStyle = '#e05b5b'; ctx.lineWidth = 5;
            ctx.beginPath();
            const stretch = (state === 'playing' && a < 20 && va < 0) ? (20 - a) * 0.5 : 0;
            ctx.moveTo(W * 0.22, ty);
            ctx.quadraticCurveTo(W * 0.5, ty + 10 + stretch, W * 0.78, ty);
            ctx.stroke();
            // 지지대
            ctx.fillStyle = '#8a5a3c';
            ctx.fillRect(W * 0.2, ty, 6, H - ty); ctx.fillRect(W * 0.78, ty, 6, H - ty);
        }

        // 캐릭터
        const cy = toScreen(a);
        ctx.save();
        const squash = (state === 'playing' && a < 12 && va < 0) ? 0.7 : 1;
        ctx.translate(W / 2, cy);
        ctx.scale(1 / Math.sqrt(squash), squash);
        ctx.fillStyle = '#ffcf4d';
        ctx.beginPath(); ctx.arc(0, -CHAR_R, CHAR_R, 0, 6.29); ctx.fill();
        ctx.fillStyle = '#3a2f14';
        ctx.beginPath(); ctx.arc(-5, -CHAR_R - 2, 2.2, 0, 6.29); ctx.arc(5, -CHAR_R - 2, 2.2, 0, 6.29); ctx.fill();
        ctx.restore();

        // 피드백 텍스트
        if (feedTimer > 0) {
            ctx.globalAlpha = Math.min(feedTimer, 1);
            ctx.fillStyle = feedback[0] === 'P' ? '#ffd34d' : feedback[0] === 'G' ? '#8ef0b0' : '#ff9a9a';
            ctx.font = "700 22px system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif";
            ctx.textAlign = 'center';
            ctx.fillText(feedback, W / 2, cy - 40);
            ctx.globalAlpha = 1;
        }
    }

    function update() {
        if (state === 'playing') {
            const wasUp = va > 0;
            va -= G; a += va;
            if (wasUp && va <= 0) canTap = true;         // 정점 통과 → 이번 하강에 한 번 장전 가능
            if (a > maxA) maxA = a;
            if (a <= 0 && va < 0) bounce();
            // 카메라: 캐릭터 고도를 부드럽게 따라감(하한 0으로 트램폴린 보이게)
            camA += (a - camA) * 0.12;
            if (camA < 0) camA = 0;
            altEl.textContent = meters(maxA) + ' m';
            if (meters(maxA) > best) {
                best = meters(maxA); bestEl.textContent = best + ' m';
                localStorage.setItem('jump_best', String(best)); newRecord = true;
            }
        }
        if (feedTimer > 0) feedTimer -= 0.025;
    }

    function tick() { update(); render(); requestAnimationFrame(tick); }

    stage.addEventListener('pointerdown', function (e) { if (state === 'playing') { e.preventDefault(); tap(); } });
    window.addEventListener('keydown', function (e) {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            if (state === 'playing') tap(); else start();
        }
    });
    playBtn.addEventListener('click', function (e) { e.stopPropagation(); start(); });

    reset(); state = 'ready'; tick();
    try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
})();
</script>
<script src="../arcade.js"></script>
<script src="../../../assets/js/common.js"></script>
</body>
