<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동전 밀기 — 오락실 코인도저 | 게임월드</title>
<meta name="description" content="오락실에 있던 그 기계. 동전을 넣어 쌓고, 밀개가 밀어 떨어뜨립니다. 한 번에 우르르 떨어질 때가 제일 좋습니다.">
<meta name="theme-color" content="#0E1218">
<style>
  :root{
    --bg:#0E1218; --panel:#171E27; --line:#2B3542;
    --ink:#EAF1F8; --muted:#8FA0B3;
    --gold:#F2C14E; --gold2:#C99A2E;
    --red:#E0674F; --blue:#5B9BFF; --green:#3DD68C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    display:flex; flex-direction:column; user-select:none; touch-action:manipulation;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .back{
    position:fixed; top:12px; left:12px; z-index:20;
    color:var(--muted); text-decoration:none; font-size:14px; font-weight:600;
    background:rgba(23,30,39,.88); border:1px solid var(--line); border-radius:10px; padding:7px 11px;
  }
  .back.r{left:auto; right:12px}

  header{padding:52px 14px 6px; text-align:center; flex:0 0 auto}
  .stats{display:flex; justify-content:center; gap:18px; font-size:15px; color:var(--muted);
         font-variant-numeric:tabular-nums}
  .stats b{color:var(--ink); font-size:19px; font-weight:800}
  .stats .gold b{color:var(--gold)}

  .wrap{flex:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:8px 10px 0}
  canvas{
    max-width:100%; max-height:100%; border-radius:14px;
    background:linear-gradient(180deg,#1B242F,#141B24);
    border:1px solid var(--line); touch-action:manipulation;
  }

  footer{flex:0 0 auto; padding:10px 14px 16px; display:flex; gap:10px; align-items:center; justify-content:center}
  .drop{
    flex:1; max-width:420px; background:linear-gradient(180deg,var(--gold),var(--gold2));
    color:#2A1F05; border:0; border-radius:16px; padding:17px 12px;
    font-size:19px; font-weight:800; letter-spacing:-.02em; font-family:inherit;
    box-shadow:0 5px 16px rgba(201,154,46,.32);
  }
  .drop:active{transform:translateY(2px)}
  .drop:disabled{filter:grayscale(.7) brightness(.7); box-shadow:none}
  .hint{text-align:center; font-size:13px; color:var(--muted); padding:0 14px 10px; flex:0 0 auto}

  /* 대화는 무조건 검은 화면에서만. 게임 화면 위에 겹치지 않는다 (형 지시) */
  .talk{
    position:fixed; inset:0; background:#000; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px; text-align:center; cursor:pointer;
  }
  .talk.hide{display:none}
  .talk-line{
    font-size:clamp(17px,4.6vw,23px); line-height:1.9; color:#D8DEE6;
    max-width:520px; letter-spacing:-.01em; min-height:3em;
    opacity:0; transition:opacity .55s ease;
  }
  .talk-line.on{opacity:1}
  .talk-next{
    position:absolute; bottom:34px; font-size:12.5px; color:#4A525C; letter-spacing:.02em;
    opacity:0; animation:fadeIn .6s ease 1.4s forwards;
  }
  @keyframes fadeIn{to{opacity:1}}

  .over{
    position:fixed; inset:0; background:rgba(14,18,24,.95); z-index:30;
    display:flex; align-items:center; justify-content:center; padding:26px; text-align:center;
  }
  .over.hide{display:none}
  .card{max-width:420px}
  .card h2{font-size:clamp(24px,6.5vw,34px); margin:0 0 10px; letter-spacing:-.03em}
  .card p{color:var(--muted); font-size:15px; line-height:1.8; margin:0}
  .big{
    margin-top:20px; background:var(--blue); color:#06121F; border:0; border-radius:14px;
    padding:16px 32px; font-size:18px; font-weight:800; cursor:pointer; font-family:inherit;
  }
  .rank{margin-top:14px; font-size:14px; color:var(--gold); font-weight:700; min-height:20px}
  .tip{margin-top:18px; font-size:13px; color:#6B7787; line-height:1.75}
</style>
</head>
<body>

<a class="back" href="../">← 게임월드</a>
<a class="back r" href="../ranking/">🏆 순위</a>

<header>
  <div class="stats">
    <span class="gold">딴 돈 <b id="score">0</b></span>
    <span>남은 동전 <b id="left">30</b></span>
    <span>최고 <b id="best">0</b></span>
  </div>
</header>

<div class="wrap"><canvas id="cv"></canvas></div>

<div class="hint" id="hint">떨어뜨릴 자리를 누르세요</div>

<footer>
  <button class="drop" id="dropBtn">동전 넣기</button>
  <button class="drop" id="shakeBtn" style="max-width:130px;background:linear-gradient(180deg,#7C8CA0,#5B6A7D);color:#0E141B">흔들기</button>
</footer>

<div id="talk" class="talk hide">
  <div class="talk-line" id="talkLine"></div>
  <div class="talk-next">눌러서 넘기기</div>
</div>

<div class="over" id="over">
  <div class="card">
    <h2>동전 밀기</h2>
    <p>
      오락실에 있던 그 기계입니다.<br>
      동전을 넣으면 쌓이고, 밀개가 앞으로 밀어 떨어뜨립니다.<br>
      앞으로 떨어진 동전이 내 돈이 됩니다.
    </p>
    <div class="rank" id="orank"></div>
    <button class="big" id="ob">시작</button>
    <div class="tip">
      한 번에 우르르 떨어질 때가 제일 좋습니다.<br>
      그래서 바로 안 넣고 쌓이길 기다리는 게 낫습니다.
    </div>
  </div>
</div>

<script src="../arcade.js"></script>
<script>
/* 동전 밀기 — 오락실 코인도저
   형이 유튜브로 보내준 그 기계. 2026-08-17.
   형: "3D 같은 건 구현 안 해도 돼."  → 위에서 비스듬히 본 화면 + 평면 물리로 만든다.
   물리는 직접 짠다(외부 라이브러리 없음). 동전은 원이고, 겹치면 밀어내는 것이 전부다. */

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const scoreEl = document.getElementById("score");
const leftEl  = document.getElementById("left");
const bestEl  = document.getElementById("best");
const hintEl  = document.getElementById("hint");
const dropBtn = document.getElementById("dropBtn");
const over = document.getElementById("over");
const ob = document.getElementById("ob"), orank = document.getElementById("orank");

/* ── 판 크기 (게임 좌표. 화면 크기와 따로 둔다) ── */
const W = 300;          // 판 가로
const H = 420;          // 판 세로. y가 클수록 앞(떨어지는 쪽)
const EDGE = H - 8;     // 이 선을 넘으면 떨어진다
const R = 15;           // 동전 반지름
const MAX_STACK = 6;     // 탑 최대 높이
const LIP_FORCE = 0.09;  // 앞 턱을 넘는 데 필요한 힘 (배당률을 정하는 값)
const SIDE_OPEN = 250;  // 이 앞쪽은 옆이 열려 있다. 여기서 옆으로 빠지면 잃는다

const BEST_KEY = "gw_dozer_best";
let best = Number(localStorage.getItem(BEST_KEY) || 0);
bestEl.textContent = best;

let coins = [], score = 0, credits = 30, dropX = W/2, playing = false;
let pusher = { y: 60, dir: 1, min: 44, max: 96, speed: 0.55 };

/* ── 동전 탑 (히든 보너스) ──
   형 지시: 코인도저 기본 필드 + 별도 탑 구조물, 무너뜨리면 히든 보너스.
   실제 바벨의 메달타워를 따랐다 —
   기계가 저절로 쌓고, 반 개씩 어긋나게 올려서 앞으로만 넘어지게 만들어져 있다. */
let tower = { x: W/2, y: 190, h: 0, lean: 0, shake: 0, timer: 0, falling: 0 };
const TOWER_MAX = 22;      // 최대 층
const LEAN_LIMIT = 1.0;    // 이만큼 기울면 무너진다

/* ── 화면 맞추기 ── */
function fit(){
  const wrap = document.querySelector(".wrap");
  const pad = 20;
  const availW = wrap.clientWidth - pad, availH = wrap.clientHeight - pad;
  const scale = Math.min(availW / W, availH / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width  = (W * scale) + "px";
  cv.style.height = (H * scale) + "px";
  cv.width  = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener("resize", fit);

/* ── 동전 ── */
function addCoin(x, y, kind){
  coins.push({ x, y, vx:0, vy:0, kind: kind || "coin", stack: 1 });
}

/* 처음에 깔려 있는 동전. 빈 판에서 시작하면 재미가 없다 */
function seed(){
  coins = [];
  tower = { x: W/2, y: 190, h: 3, lean: 0, shake: 0, timer: 0, falling: 0 };
  for(let i = 0; i < 26; i++){
    addCoin(30 + Math.random()*(W-60), 150 + Math.random()*(H-230));
  }
  // 특별 동전 두 개 — 이게 떨어지면 크게 준다
  addCoin(W/2 - 40, H - 130, "star");
  addCoin(W/2 + 40, H - 100, "star");
}

/* ── 물리 ──
   1) 밀개가 닿은 동전을 앞으로 민다
   2) 겹친 동전끼리 서로 밀어낸다 (여러 번 반복해야 안정된다)
   3) 마찰로 속도를 죽인다. 안 그러면 영원히 미끄러진다 */
function step(){
  // 밀개 왕복
  pusher.y += pusher.speed * pusher.dir;
  if(pusher.y > pusher.max) pusher.dir = -1;
  if(pusher.y < pusher.min) pusher.dir = 1;

  updateTower();

  for(const c of coins){
    // 밀개에 눌린 동전
    if(pusher.dir > 0 && c.y - R < pusher.y && c.y > pusher.y - 30){
      c.y = pusher.y + R;
      c.vy = Math.max(c.vy, pusher.speed);
    }
    c.vx *= 0.86;  c.vy *= 0.86;      // 운동마찰
    // 정지마찰 — 힘이 약하면 아예 안 움직인다. 실제 기계가 그래서 잘 안 떨어진다
    if(Math.abs(c.vx) < 0.035) c.vx = 0;
    if(Math.abs(c.vy) < 0.035) c.vy = 0;
    c.x += c.vx;   c.y += c.vy;

    // 앞 턱(lip) — 실제 기계에는 앞에 턱이 있다. 걸쳐 있다가 뒤에서 밀어야 넘어간다.
    // 이 턱이 '아슬아슬하게 걸린 동전'을 만든다. 이 게임의 재미는 거기서 나온다
    if(c.y > EDGE - R*1.2 && c.y < EDGE){
      c.vy *= 0.55;
      if(c.vy < LIP_FORCE) c.vy = 0;    // 미는 힘이 모자라면 턱에 걸린다
    }

    // 옆벽 — 뒤쪽은 막혀 있고 앞쪽(SIDE_OPEN 아래)은 열려 있다.
    // 열린 데로 빠지면 내 돈이 안 된다. 이게 이 게임의 긴장이다 (이음이 찾아준 실제 룰)
    if(c.y < SIDE_OPEN){
      if(c.x < R){ c.x = R; c.vx = Math.abs(c.vx) * 0.4; }
      if(c.x > W - R){ c.x = W - R; c.vx = -Math.abs(c.vx) * 0.4; }
    }
    // 뒷벽
    if(c.y < pusher.min + R){ c.y = pusher.min + R; }
  }

  // 겹침 풀기 — 반복할수록 자연스럽지만 무거워진다. 4번이면 충분하다
  for(let it = 0; it < 4; it++){
    for(let i = 0; i < coins.length; i++){
      for(let j = i+1; j < coins.length; j++){
        const a = coins[i], b = coins[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx*dx + dy*dy;
        const min = R*2;
        if(d2 < min*min && d2 > 0.0001){
          const d = Math.sqrt(d2);
          const push = (min - d) / 2;
          const ux = dx/d, uy = dy/d;
          a.x -= ux*push; a.y -= uy*push;
          b.x += ux*push; b.y += uy*push;
          // 밀린 만큼 앞으로 가려는 힘이 전달된다
          const share = push * 0.35;
          a.vx -= ux*share; a.vy -= uy*share;
          b.vx += ux*share; b.vy += uy*share;
        }
      }
    }
  }

  /* ── 탑 쌓기 ──
     실제 기계에서 동전은 옆으로만 밀리지 않는다. 갈 데가 없으면 위로 올라타 층이 쌓인다.
     그렇게 선 탑이 나중에 한꺼번에 무너지는 게 이 게임의 제일 큰 재미다.
     (형: "중간에 높은 탑 쌓기 하는 것도 있어") */
  for(let i = 0; i < coins.length; i++){
    const a = coins[i];
    if(a.stack >= MAX_STACK) continue;
    for(let j = i+1; j < coins.length; j++){
      const b = coins[j];
      if(b.kind !== a.kind) continue;                 // 별 동전은 따로 둔다
      if(a.stack + b.stack > MAX_STACK) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      // 거의 같은 자리에서 서로 못 움직이면 → 위로 올라탄다
      const stuck = Math.abs(a.vy) < 0.05 && Math.abs(b.vy) < 0.05;
      if(d < R*0.75 && stuck){
        a.stack += b.stack;
        a.y = (a.y + b.y) / 2; a.x = (a.x + b.x) / 2;
        coins.splice(j, 1);
        j--;
      }
    }
  }

  // 떨어진 동전 거두기
  let got = 0, gotStar = 0, lost = 0, tower = 0;
  coins = coins.filter(c => {
    if(c.y > EDGE){
      if(c.kind === "star"){ gotStar += c.stack; } else { got += c.stack; }
      if(c.stack >= 3) tower = Math.max(tower, c.stack);   // 탑이 무너졌다
      return false;
    }
    if(c.x < -R || c.x > W + R){ lost++; return false; }   // 옆으로 빠짐 = 손실
    return true;
  });
  if(lost && !got && !gotStar){
    hintEl.textContent = "옆으로 " + lost + "개 빠졌습니다";
    thud();
  }
  if(got || gotStar){
    const gain = got + gotStar * 10;
    score += gain;
    scoreEl.textContent = score;
    ding(got + gotStar);
    if(tower >= 3) hintEl.textContent = tower + "층 탑이 무너졌습니다!";
    else if(gotStar) hintEl.textContent = "별 동전! " + (gotStar*10) + "개";
    else if(got >= 3) hintEl.textContent = got + "개가 한꺼번에!";
    else hintEl.textContent = "+" + gain;
  }
}

/* ── 탑 ── */
function updateTower(){
  if(tower.falling > 0){ tower.falling--; if(tower.falling === 0) collapse(); return; }

  // 저절로 쌓인다. 높아질수록 느리게 (안 그러면 금방 천장을 친다)
  tower.timer++;
  const need = 55 + tower.h * 6;
  if(tower.timer > need && tower.h < TOWER_MAX){ tower.timer = 0; tower.h++; }
  // 반 개씩 어긋나게 쌓이므로 높이 자체가 기울기가 된다 (실제 바벨이 그렇다).
  // 흔들림은 여기에 얹히는 것이고, 흔들림만 시간이 지나면 가라앉는다
  tower.lean = tower.h * 0.042 + tower.shake;

  if(tower.h === 0) return;

  // 동전이 밑동을 치면 흔들린다
  for(const c of coins){
    if(Math.abs(c.x - tower.x) < R*2.2 && Math.abs(c.y - tower.y) < R*1.8){
      const hit = Math.abs(c.vy) + Math.abs(c.vx);
      if(hit > 0.12){
        tower.shake += hit * 0.11 * (1 + tower.h / 12);   // 높을수록 잘 넘어간다
        c.vy *= 0.3;                                     // 부딪히면 동전은 힘을 잃는다
        c.vx *= 0.3;
      }
    }
  }
  // 밀개가 밑동까지 밀고 오면 크게 흔들린다
  if(pusher.dir > 0 && pusher.y > tower.y - R*1.5) tower.shake += 0.012;

  tower.shake *= 0.997;           // 흔들림만 가라앉는다. 기울기는 높이가 만든 것이라 안 없어진다
  if(tower.lean > LEAN_LIMIT){ tower.falling = 26; shakeSound(); }
}

/* 탑이 무너진다 — 쌓인 만큼 동전이 앞으로 쏟아진다 */
function collapse(){
  const n = tower.h;
  for(let i = 0; i < n * 2; i++){
    const c = { x: tower.x + (Math.random()-0.5) * R*3,
                y: tower.y + 10 + Math.random() * 40,
                vx: (Math.random()-0.5) * 1.2,
                vy: 1.2 + Math.random() * 1.6,          // 앞으로 쏟아진다
                kind: "coin", stack: 1 };
    coins.push(c);
  }
  hintEl.textContent = n + "층 탑이 무너졌습니다!";
  ding(5);
  tower.h = 0; tower.lean = 0; tower.shake = 0; tower.timer = 0;
}

function shakeSound(){
  try{
    const c = actx();
    const buf = c.createBuffer(1, c.sampleRate * 0.5, c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length) * 0.4;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 900;
    src.connect(f); f.connect(c.destination); src.start();
  }catch(e){}
}

/* ── 그리기 ── */
function draw(){
  ctx.clearRect(0, 0, W, H);

  // 바닥 판
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#212C38"); g.addColorStop(1, "#161E27");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 떨어지는 선
  ctx.fillStyle = "rgba(240,180,70,.10)";
  ctx.fillRect(0, EDGE - 26, W, 26 + 8);
  ctx.strokeStyle = "rgba(242,193,78,.55)";
  ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, EDGE); ctx.lineTo(W, EDGE); ctx.stroke();
  ctx.setLineDash([]);

  // 밀개
  ctx.fillStyle = "#3C4A5B";
  ctx.fillRect(0, pusher.y - 34, W, 34);
  ctx.fillStyle = "#4E6076";
  ctx.fillRect(0, pusher.y - 8, W, 8);

  // 탑 — 동전보다 먼저 그린다(뒤에 선다)
  if(tower.h > 0){
    const shaking = tower.falling > 0;
    const lean = shaking ? tower.lean + (26 - tower.falling) * 0.06 : tower.lean;
    ctx.save();
    ctx.translate(tower.x, tower.y);
    for(let L = 0; L < tower.h; L++){
      // 층마다 조금씩 앞으로 밀린다. 기울수록 더
      const off = lean * L * 3.2 + (shaking ? Math.sin(L + tower.falling) * 2 : 0);
      const yy = -L * 5.2 + off * 0.5;
      ctx.save();
      ctx.translate(off, yy);
      ctx.scale(1, 0.62);
      ctx.beginPath(); ctx.arc(0, 0, R*0.92, 0, 6.2832);
      const tg = ctx.createLinearGradient(-R, -R, R, R);
      tg.addColorStop(0, "#FFF0BE"); tg.addColorStop(1, "#D8A93A");
      ctx.fillStyle = tg; ctx.fill();
      ctx.lineWidth = 1.2; ctx.strokeStyle = "#8C6A18"; ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    // 몇 층인지
    ctx.fillStyle = tower.lean > LEAN_LIMIT*0.65 ? "#FF9E7A" : "#FFE9A8";
    ctx.font = "bold 12px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(tower.h + "층", tower.x, tower.y - tower.h * 5.2 - 16);
    // 위험 표시
    if(tower.lean > LEAN_LIMIT*0.65 && !tower.falling){
      ctx.fillStyle = "rgba(255,140,90,.9)";
      ctx.font = "bold 11px -apple-system, sans-serif";
      ctx.fillText("흔들린다", tower.x, tower.y - tower.h * 5.2 - 30);
    }
  }

  // 동전 — 뒤에 있는 것부터 그려야 앞 동전이 위로 올라온다
  const sorted = coins.slice().sort((a,b) => a.y - b.y);
  for(const c of sorted){
    const isStar = c.kind === "star";
    const layers = c.stack || 1;
    // 쌓인 층을 아래에서 위로. 위로 갈수록 살짝 올려 그려 높이가 보이게 한다
    for(let L = 0; L < layers; L++){
    ctx.save();
    ctx.translate(c.x, c.y - L * 4.5);
    ctx.scale(1, 0.62);                 // 비스듬히 본 느낌
    // 그림자
    ctx.beginPath(); ctx.arc(1.5, 3, R, 0, 6.2832);
    ctx.fillStyle = "rgba(0,0,0,.32)"; ctx.fill();
    // 몸통
    const cg = ctx.createRadialGradient(-R*0.3, -R*0.3, R*0.2, 0, 0, R);
    if(isStar){ cg.addColorStop(0, "#9FD8FF"); cg.addColorStop(1, "#3E7FCB"); }
    else      { cg.addColorStop(0, "#FFE9A8"); cg.addColorStop(1, "#C99A2E"); }
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.2832);
    ctx.fillStyle = cg; ctx.fill();
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = isStar ? "#2C5E9B" : "#9A7420";
    ctx.stroke();
    ctx.restore();
    // 무늬
    }
    // 맨 위 장에만 글자를 넣는다
    ctx.fillStyle = isStar ? "#1B3D66" : "#8A6718";
    ctx.font = "bold 13px -apple-system, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(isStar ? "★" : "₩", c.x, c.y - (layers-1) * 4.5);
    // 세 층 넘으면 몇 층인지 보여준다
    if(layers >= 3){
      ctx.fillStyle = "#FFF3D0";
      ctx.font = "bold 11px -apple-system, sans-serif";
      ctx.fillText(layers + "층", c.x, c.y - (layers-1) * 4.5 - 15);
    }
  }

  // 넣을 자리 표시
  if(playing && credits > 0){
    ctx.strokeStyle = "rgba(242,193,78,.75)";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(dropX, 6); ctx.lineTo(dropX, pusher.min - 4); ctx.stroke();
    ctx.beginPath(); ctx.arc(dropX, 14, 6, 0, 6.2832);
    ctx.fillStyle = "rgba(242,193,78,.85)"; ctx.fill();
  }
}

/* ── 소리 (파일 없이) ── */
let ac = null;
const actx = () => ac || (ac = new (window.AudioContext || window.webkitAudioContext)());
function ding(n){
  try{
    const c = actx();
    for(let i = 0; i < Math.min(n, 5); i++){
      const o = c.createOscillator(), g = c.createGain();
      o.type = "triangle";
      o.frequency.value = 620 + i*130;
      const t = c.currentTime + i*0.045;
      g.gain.setValueAtTime(0.07, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.17);
    }
  }catch(e){}
}
function thud(){
  try{
    const c = actx(), o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(180, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(70, c.currentTime + 0.2);
    g.gain.setValueAtTime(0.05, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.22);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.23);
  }catch(e){}
}
function clink(){
  try{
    const c = actx(), o = c.createOscillator(), g = c.createGain();
    o.type = "square"; o.frequency.value = 320;
    g.gain.setValueAtTime(0.04, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.09);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.1);
  }catch(e){}
}

/* ── 조작 ── */
function canvasX(e){
  const r = cv.getBoundingClientRect();
  const px = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  return Math.max(R, Math.min(W - R, px / r.width * W));
}
cv.addEventListener("pointerdown", e => {
  if(!playing) return;
  dropX = canvasX(e);
  drop();
});
cv.addEventListener("pointermove", e => {
  if(!playing || e.buttons === 0) return;
  dropX = canvasX(e);
});

function drop(){
  if(!playing || credits <= 0) return;
  credits--;
  leftEl.textContent = credits;

  /* 타이밍 — 실제 고수들이 쓰는 방법('워터폴').
     밀개가 뒤로 다 물러났을 때 넣으면 밀개가 앞으로 나오며 힘을 최대로 전한다.
     아무 때나 넣는 것과 달라야 실력이 된다 */
  const back = (pusher.y - pusher.min) / (pusher.max - pusher.min);   // 0=완전히 뒤
  addCoin(dropX, pusher.min + R + 2);
  const c = coins[coins.length - 1];
  if(back < 0.25){
    c.vy = 0.5;                       // 뒤로 물러났을 때 = 잘 넣은 것
    hintEl.textContent = "좋은 타이밍";
  }
  clink();
  if(credits === 0){
    dropBtn.disabled = true;
    hintEl.textContent = "동전을 다 썼습니다. 남은 게 떨어질 때까지 기다리세요";
    setTimeout(checkEnd, 3500);
  }
}
dropBtn.onclick = drop;

/* 흔들기 — 실제 기계에도 있는 기능. 다만 계속 누르면 게임이 아니게 되므로 쿨다운을 둔다 */
const shakeBtn = document.getElementById("shakeBtn");
let shakeReady = true;
shakeBtn.onclick = () => {
  if(!playing || !shakeReady) return;
  shakeReady = false;
  shakeBtn.disabled = true;
  for(const c of coins){
    c.vx += (Math.random() - 0.5) * 2.4;
    c.vy += Math.random() * 0.9;        // 앞으로만 살짝. 뒤로 가면 이상하다
  }
  thud();
  hintEl.textContent = "흔들었습니다";
  let n = 6;
  const t = setInterval(() => {
    n--; shakeBtn.textContent = n > 0 ? n + "초" : "흔들기";
    if(n <= 0){ clearInterval(t); shakeReady = true; shakeBtn.disabled = false; }
  }, 1000);
};

function checkEnd(){
  // 더 이상 점수가 오를 가망이 없으면 끝낸다
  const near = coins.filter(c => c.y > EDGE - 60).length;
  if(near > 0){ setTimeout(checkEnd, 2500); return; }
  gameOver();
}

async function gameOver(){
  playing = false;
  // 끝 대사도 검은 화면에서. 결과판은 그 다음에 보여준다
  talk(ENDING_LOSS, () => showResult());
}

async function showResult(){
  if(score > best){
    best = score;
    localStorage.setItem(BEST_KEY, best);
    bestEl.textContent = best;
  }
  document.querySelector(".card h2").textContent = "끝";
  document.querySelector(".card p").innerHTML =
    `딴 돈 <b style="color:var(--gold)">${score}</b>개 · 최고 <b>${best}</b>개`;
  ob.textContent = "다시";
  orank.textContent = "";
  over.classList.remove("hide");

  if(score > 0 && window.Arcade){
    try{
      const r = await Arcade.submit("dozer", score);
      if(r && r.rank) orank.textContent = `전체 ${r.total}명 중 ${r.rank}위`;
    }catch(e){}
  }
}

/* ── 검은 화면 대화 ──
   형 지시: 스토리는 조금만. 명시하지 말고 짐작하게. 대화는 무조건 검은 화면에서.
   ⚠️ 아래 대사는 맺음이 쓴 초안이다. 형이 고치면 그걸로 바꾼다 */
const OPENING = [
  "동전 서른 개.",
  "그거면 충분하다고 했다.",
  "누가 그랬는지는 기억나지 않는다.",
  "앞줄이 곧 떨어질 것처럼 걸쳐 있다.",
  "언제부터 저러고 있었는지 모르겠다."
];
const ENDING_LOSS = [
  "동전이 떨어졌다.",
  "앞줄은 아직 그대로 걸쳐 있다.",
  "조금만 더 있었으면 됐을 것이다.",
  "늘 그렇게 보인다."
];

const talkEl = document.getElementById("talk");
const talkLine = document.getElementById("talkLine");

function talk(lines, done){
  let i = 0;
  talkEl.classList.remove("hide");
  const show = () => {
    talkLine.classList.remove("on");
    setTimeout(() => {
      talkLine.textContent = lines[i];
      talkLine.classList.add("on");
    }, 260);
  };
  show();
  const next = () => {
    i++;
    if(i >= lines.length){
      talkEl.removeEventListener("pointerdown", next);
      talkEl.classList.add("hide");
      done && done();
      return;
    }
    show();
  };
  talkEl.addEventListener("pointerdown", next);
}

let seenOpening = false;

ob.onclick = () => {
  if(window.Arcade) Arcade.ensureName();
  over.classList.add("hide");
  if(!seenOpening){
    seenOpening = true;
    talk(OPENING, startRound);
    return;
  }
  startRound();
};

function startRound(){
  score = 0; credits = 30; playing = true;
  scoreEl.textContent = 0; leftEl.textContent = credits;
  dropBtn.disabled = false;
  hintEl.textContent = "떨어뜨릴 자리를 누르세요";
  shakeReady = true; shakeBtn.disabled = false; shakeBtn.textContent = "흔들기";
  seed();
}

/* ── 진행 ── */
function loop(){
  if(playing) step();
  draw();
  requestAnimationFrame(loop);
}
fit(); seed(); draw(); loop();
</script>
