<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도장 PNG 다운로드 – 작업 완료</title>
  <meta name="description" content="배경이 제거된 도장 PNG 파일을 다운로드하세요." />

  <style>
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6; color: #1f2937;
      display: flex; justify-content: center; min-height: 100vh;
    }
    .wrap {
      width: 100%; max-width: 600px; padding: 40px 20px; text-align: center;
    }
    .card {
      background: #ffffff; border-radius: 20px;
      padding: 40px 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #e5e7eb;
    }
    h1 { margin: 0 0 10px; font-size: 24px; color: #111827; }
    p { margin-bottom: 24px; color: #6b7280; font-size: 15px; }
    .preview-box {
      background: repeating-conic-gradient(#f0f0f0 0% 25%, transparent 0% 50%) 50% / 20px 20px;
      border: 1px solid #e5e7eb; border-radius: 12px;
      margin: 20px auto; padding: 20px; max-width: 300px; min-height: 200px;
      display: flex; align-items: center; justify-content: center;
    }
    .preview-img { max-width: 100%; max-height: 250px; }
    .btn-download {
      display: inline-block; width: 100%; padding: 16px;
      background: #22c55e; color: white; border-radius: 12px;
      font-weight: 700; text-decoration: none; font-size: 16px;
      box-shadow: 0 4px 6px rgba(34, 197, 94, 0.2); margin-bottom: 12px;
      transition: transform 0.1s;
    }
    .btn-download:active { transform: scale(0.98); }
    .btn-again {
      display: inline-block; color: #6b7280; text-decoration: none;
      font-size: 14px; padding: 8px;
    }
    .btn-again:hover { text-decoration: underline; color: #374151; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>🎉 도장 추출 완료!</h1>
      <p>배경이 투명한 PNG 파일이 준비되었습니다.<br>아래 버튼을 눌러 저장하세요.</p>
      
      <div class="preview-box">
        <img id="preview" class="preview-img" alt="도장 미리보기" />
      </div>

      <a id="downloadLink" class="btn-download" href="#" download="stamp_result.png">💾 PNG 다운로드</a>
      <a href="welcome.html" class="btn-again">↺ 다른 도장 만들기</a>


    </div>
  </div>
  <script>
    const dataUrl = sessionStorage.getItem('stampResultDataUrl');
    if (dataUrl) {
      document.getElementById('preview').src = dataUrl;
      document.getElementById('downloadLink').href = dataUrl;
    } else {
      document.querySelector('.preview-box').innerHTML = '<span style="color:#999;font-size:13px">이미지가 만료되었습니다.<br>다시 시도해주세요.</span>';
    }
  </script>
</body>
</html>
