<meta name="theme-color" content="#FAF9F5">
<meta name="description" content="Convert WAV, M4A, OGG, FLAC and more to MP3 — all in your browser.">
<title>Audio → MP3 Converter — FreeComfortLab</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2824624880449066" crossorigin="anonymous"></script>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
    .app-hero { padding: var(--space-7) 0 var(--space-5); text-align: center; }
    .workbench { display: grid; grid-template-columns: 1fr; gap: var(--space-5); }
    @media (min-width: 920px) { .workbench { grid-template-columns: 1.6fr 1fr; align-items: start; } }
    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); }
    .panel h3 { font-size: 1rem; font-weight: 600; margin: 0 0 var(--space-3); }
    .file-list { list-style: none; padding: 0; margin: var(--space-4) 0 0; display: flex; flex-direction: column; gap: var(--space-2); }
    .file-item { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3); background: var(--bg-sunken); border-radius: var(--radius-md); }
    .file-item .ico { width: 36px; height: 36px; background: var(--accent-soft); color: var(--accent-deep); border-radius: var(--radius-sm); display: grid; place-items: center; }
    .file-item .body { flex: 1; min-width: 0; }
    .file-item .name { font-size: 0.92rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-item .meta { font-size: 0.78rem; color: var(--text-muted); font-family: var(--font-mono); }
    .file-item .progress { height: 4px; background: var(--border); border-radius: 999px; margin-top: 6px; overflow: hidden; }
    .file-item .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .25s var(--ease-out); }
    .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--space-4); }
    .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--bg-sunken); border-radius: var(--radius-md); }
    .seg button { padding: 8px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); }
    .seg button.on { background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-xs); }
    .status { font-size: 0.88rem; color: var(--text-secondary); margin-top: var(--space-3); padding: var(--space-3); background: var(--bg-sunken); border-radius: var(--radius-md); font-family: var(--font-mono); }
    .status.ok { background: rgba(107,142,107,.12); color: #3F5C3F; }
</style>
</head>
<body>
<nav class="nav">
    <div class="nav-inner">
        <a href="/" class="nav-brand"><span class="nav-brand-mark">L</span><span>LeDeuxions</span></a>
        <div class="nav-links" data-nav-menu style="display:flex">
            <a href="../" class="nav-link">KO</a>
            <a href="./" class="nav-link active">FreeComfortLab</a>
        </div>
    </div>
</nav>
<header class="app-hero container-narrow">
    <div class="eyebrow" style="margin-bottom:12px;">Audio → MP3</div>
    <h1>Audio to <em style="color:var(--accent);font-style:italic;">MP3</em></h1>
    <p class="lead">Any audio file, decoded and re-encoded as MP3 — right in your browser.</p>
</header>
<main class="container" style="padding-bottom:var(--space-9);">
<div class="workbench">
    <div>
        <div class="dropzone" id="drop">
            <div class="dropzone-icon">🎵</div>
            <div class="dropzone-text">
                <strong>Drop audio files or click</strong><br>
                <small>WAV · M4A · AAC · OGG · FLAC · WMA · OPUS</small>
            </div>
            <input type="file" id="files" multiple accept="audio/*" hidden>
        </div>
        <ul class="file-list" id="list"></ul>
    </div>
    <div class="panel">
        <h3>Encoding</h3>
        <div class="form-row">
            <label class="label">Bitrate</label>
            <div class="seg" id="seg-br">
                <button data-br="96">96</button>
                <button data-br="128">128</button>
                <button class="on" data-br="192">192</button>
                <button data-br="256">256</button>
                <button data-br="320">320</button>
            </div>
        </div>
        <div class="form-row">
            <label class="label">Channels</label>
            <div class="seg" id="seg-ch">
                <button class="on" data-ch="auto">Original</button>
                <button data-ch="2">Stereo</button>
                <button data-ch="1">Mono</button>
            </div>
        </div>
        <button class="btn btn-primary btn-block" id="run" disabled>Convert to MP3</button>
        <button class="btn btn-secondary btn-block" id="zip" disabled style="margin-top:var(--space-3);">Download all as ZIP</button>
        <div class="status" id="status" hidden></div>
    </div>
</div>
</main>
<footer class="site-footer">
    <div class="site-footer-inner">
        <div class="site-footer-bottom">
            <span>© 2005–2026 LeDeuxions.</span>
            <span><a href="./">← FreeComfortLab</a></span>
        </div>
    </div>
</footer>
<script src="../../../assets/js/common.js"></script>
<script>
(function () {
    'use strict';
    var state = { items: [], bitrate: 192, channels: 'auto' };
    var elDrop = document.getElementById('drop');
    var elInput = document.getElementById('files');
    var elList = document.getElementById('list');
    var elRun = document.getElementById('run');
    var elZip = document.getElementById('zip');

    elDrop.addEventListener('click', function () { elInput.click(); });
    elDrop.addEventListener('dragover', function (e) { e.preventDefault(); elDrop.classList.add('is-active'); });
    elDrop.addEventListener('dragleave', function () { elDrop.classList.remove('is-active'); });
    elDrop.addEventListener('drop', function (e) {
        e.preventDefault(); elDrop.classList.remove('is-active');
        addFiles(Array.from(e.dataTransfer.files));
    });
    elInput.addEventListener('change', function () { addFiles(Array.from(elInput.files)); });

    function addFiles(files) {
        files.forEach(function (f) {
            if (!/^audio\//.test(f.type) && !/\.(wav|m4a|aac|ogg|flac|opus|wma|mp3)$/i.test(f.name)) return;
            state.items.push({ file: f, blob: null, progress: 0 });
        });
        render();
    }

    function render() {
        elList.innerHTML = '';
        state.items.forEach(function (it, i) {
            var li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = '<div class="ico">♪</div><div class="body"><div class="name"></div><div class="meta"></div><div class="progress"><div></div></div></div>';
            li.querySelector('.name').textContent = it.file.name;
            li.querySelector('.meta').textContent = LD.formatBytes(it.file.size) + (it.blob ? ' → ' + LD.formatBytes(it.blob.size) + ' MP3 ✓' : '');
            li.querySelector('.progress > div').style.width = (it.progress || 0) + '%';
            elList.appendChild(li);
        });
        elRun.disabled = state.items.length === 0;
        elZip.disabled = !state.items.some(function (x) { return x.blob; });
    }

    document.getElementById('seg-br').addEventListener('click', function (e) {
        if (e.target.tagName !== 'BUTTON') return;
        document.querySelectorAll('#seg-br button').forEach(function (b) { b.classList.remove('on'); });
        e.target.classList.add('on');
        state.bitrate = parseInt(e.target.dataset.br, 10);
    });
    document.getElementById('seg-ch').addEventListener('click', function (e) {
        if (e.target.tagName !== 'BUTTON') return;
        document.querySelectorAll('#seg-ch button').forEach(function (b) { b.classList.remove('on'); });
        e.target.classList.add('on');
        state.channels = e.target.dataset.ch;
    });

    function setStatus(msg, kind) {
        var s = document.getElementById('status');
        s.textContent = msg; s.hidden = !msg; s.className = 'status' + (kind ? ' ' + kind : '');
    }

    async function decodeAudio(file) {
        var ac = new (window.AudioContext || window.webkitAudioContext)();
        try { return await ac.decodeAudioData(await file.arrayBuffer()); }
        finally { ac.close && ac.close(); }
    }

    function encodeMp3(audioBuffer, bitrate, forceCh, progressCb) {
        return new Promise(function (resolve) {
            var sr = audioBuffer.sampleRate;
            var srcCh = audioBuffer.numberOfChannels;
            var ch = forceCh === 'auto' ? Math.min(2, srcCh) : parseInt(forceCh, 10);
            var left = audioBuffer.getChannelData(0);
            var right = srcCh > 1 ? audioBuffer.getChannelData(1) : left;
            if (ch === 1 && srcCh > 1) {
                var mono = new Float32Array(left.length);
                for (var i = 0; i < left.length; i++) mono[i] = (left[i] + right[i]) / 2;
                left = mono; right = mono;
            }
            var enc = new lamejs.Mp3Encoder(ch, sr, bitrate);
            var BLOCK = 1152;
            var out = [];
            var l16 = new Int16Array(left.length);
            var r16 = new Int16Array(left.length);
            for (var j = 0; j < left.length; j++) {
                l16[j] = Math.max(-32768, Math.min(32767, left[j] * 32767));
                r16[j] = Math.max(-32768, Math.min(32767, right[j] * 32767));
            }
            function chunk(i) {
                if (i >= l16.length) {
                    var e = enc.flush();
                    if (e.length) out.push(e);
                    resolve(new Blob(out, { type: 'audio/mp3' }));
                    return;
                }
                var lc = l16.subarray(i, i + BLOCK);
                var e = ch === 1 ? enc.encodeBuffer(lc) : enc.encodeBuffer(lc, r16.subarray(i, i + BLOCK));
                if (e.length) out.push(e);
                progressCb && progressCb(Math.min(100, (i / l16.length) * 100));
                setTimeout(function () { chunk(i + BLOCK); }, 0);
            }
            chunk(0);
        });
    }

    elRun.addEventListener('click', async function () {
        elRun.disabled = true;
        for (var i = 0; i < state.items.length; i++) {
            var it = state.items[i];
            if (it.blob) continue;
            setStatus('Encoding… (' + (i + 1) + '/' + state.items.length + ') ' + it.file.name);
            try {
                var audio = await decodeAudio(it.file);
                var idx = i;
                var blob = await encodeMp3(audio, state.bitrate, state.channels, function (p) {
                    state.items[idx].progress = p;
                    var li = elList.children[idx];
                    if (li) li.querySelector('.progress > div').style.width = p + '%';
                });
                it.blob = blob; it.progress = 100;
                render();
                if (state.items.length === 1) LD.download(blob, it.file.name.replace(/\.[^.]+$/, '') + '.mp3');
            } catch (e) { console.error(e); }
        }
        setStatus('Done', 'ok');
        elRun.disabled = false;
    });
    elZip.addEventListener('click', async function () {
        var zip = new JSZip();
        state.items.forEach(function (it) { if (it.blob) zip.file(it.file.name.replace(/\.[^.]+$/, '') + '.mp3', it.blob); });
        var b = await zip.generateAsync({ type: 'blob' });
        LD.download(b, 'mp3_converted.zip');
    });
})();
</script>
</body>
</html>
