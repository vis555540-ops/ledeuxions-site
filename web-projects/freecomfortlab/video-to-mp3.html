<style>
    .app-hero { padding: var(--space-7) 0 var(--space-5); text-align: center; }
    .workbench { display: grid; grid-template-columns: 1fr; gap: var(--space-5); }
    @media (min-width: 920px) { .workbench { grid-template-columns: 1.6fr 1fr; align-items: start; } }
    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); }
    .panel h3 { font-size: 1rem; font-weight: 600; margin: 0 0 var(--space-3); }
    .video-stage { background: var(--bg-sunken); border-radius: var(--radius-lg); padding: var(--space-5); text-align: center; margin-top: var(--space-4); }
    .video-stage video { max-width: 100%; max-height: 320px; border-radius: var(--radius-md); }
    .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--space-4); }
    .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--bg-sunken); border-radius: var(--radius-md); }
    .seg button { padding: 8px; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); }
    .seg button.on { background: var(--bg-card); color: var(--text-primary); box-shadow: var(--shadow-xs); }
    .progress-bar { height: 6px; background: var(--bg-sunken); border-radius: 999px; overflow: hidden; margin-top: var(--space-3); }
    .progress-bar > div { height: 100%; background: var(--accent); width: 0; transition: width .25s var(--ease-out); }
    .status { font-size: 0.88rem; color: var(--text-secondary); margin-top: var(--space-3); padding: var(--space-3); background: var(--bg-sunken); border-radius: var(--radius-md); font-family: var(--font-mono); }
    .status.ok { background: rgba(107,142,107,.12); color: #3F5C3F; }
    .status.err { background: rgba(184,91,61,.12); color: var(--accent-deep); }
    .help { font-size: 0.8rem; color: var(--text-muted); margin-top: var(--space-2); }
</style>
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a href="/" class="nav-brand">
            <span class="nav-brand-mark">L</span>
            <span>LeDeuxions</span>
        </a>
        <button class="nav-toggle" data-nav-toggle aria-label="메뉴">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="nav-links" data-nav-menu>
            <a href="/" class="nav-link" data-nav-link>홈</a>
            <a href="/web-projects/" class="nav-link" data-nav-link>웹 도구</a>
            <a href="./" class="nav-link active">FreeComfortLab</a>
        </div>
    </div>
</nav>

<header class="app-hero container-narrow">
    <div class="eyebrow" style="margin-bottom:12px;">Video → MP3</div>
    <h1>영상에서 <em style="color:var(--accent);font-style:italic;">소리</em>만</h1>
    <p class="lead">브라우저가 디코드한 영상의 오디오 트랙을 MP3로 추출합니다.</p>
</header>

<main class="container" style="padding-bottom:var(--space-9);">

<div class="workbench">

    <div>
        <div class="dropzone" id="drop">
            <div class="dropzone-icon">🎬</div>
            <div class="dropzone-text">
                <strong>비디오 파일을 끌어 놓거나</strong> 클릭해 선택<br>
                <small>MP4 · MOV · WebM · MKV (브라우저 호환 코덱)</small>
            </div>
            <input type="file" id="file" accept="video/*" hidden>
        </div>
        <div class="video-stage" id="stage" hidden>
            <video id="video" controls></video>
        </div>
    </div>

    <div class="panel">
        <h3>설정</h3>
        <div class="form-row">
            <label class="label">MP3 비트레이트</label>
            <div class="seg" id="seg-br">
                <button data-br="96">96</button>
                <button data-br="128">128</button>
                <button class="on" data-br="192">192</button>
                <button data-br="256">256</button>
                <button data-br="320">320</button>
            </div>
        </div>
        <div class="form-row">
            <label class="label">시작 (초)</label>
            <input class="input" id="start" type="number" min="0" value="0" step="0.1">
        </div>
        <div class="form-row">
            <label class="label">끝 (초, 0 = 전체)</label>
            <input class="input" id="end" type="number" min="0" value="0" step="0.1">
        </div>
        <button class="btn btn-primary btn-block" id="run" disabled>오디오 추출 → MP3</button>
        <div class="progress-bar" id="bar" hidden><div></div></div>
        <div class="status" id="status" hidden></div>
        <p class="help" style="margin-top:var(--space-4);">
            ⚠️ 브라우저가 디코드 가능한 영상이어야 합니다. iPhone HEVC/H.265는 Safari에서 가장 잘 작동합니다.
        </p>
    </div>

</div>

</main>

<footer class="site-footer">
    <div class="site-footer-inner">
        <div class="site-footer-bottom">
            <span>© 2005–2026 LeDeuxions. Video→MP3 v2026.05</span>
            <span><a href="./">← FreeComfortLab</a></span>
        </div>
    </div>
</footer>

<script src="../../assets/js/common.js"></script>
<script>
(function () {
    'use strict';
    var state = { file: null, bitrate: 192 };

    var elDrop = document.getElementById('drop');
    var elFile = document.getElementById('file');
    var elVideo = document.getElementById('video');
    var elStage = document.getElementById('stage');
    var elRun = document.getElementById('run');
    var elBar = document.getElementById('bar');

    elDrop.addEventListener('click', function () { elFile.click(); });
    elDrop.addEventListener('dragover', function (e) { e.preventDefault(); elDrop.classList.add('is-active'); });
    elDrop.addEventListener('dragleave', function () { elDrop.classList.remove('is-active'); });
    elDrop.addEventListener('drop', function (e) {
        e.preventDefault(); elDrop.classList.remove('is-active');
        useFile(e.dataTransfer.files[0]);
    });
    elFile.addEventListener('change', function () { useFile(elFile.files[0]); });

    function useFile(f) {
        if (!f) return;
        state.file = f;
        elVideo.src = URL.createObjectURL(f);
        elStage.hidden = false;
        elRun.disabled = false;
    }

    document.getElementById('seg-br').addEventListener('click', function (e) {
        if (e.target.tagName !== 'BUTTON') return;
        document.querySelectorAll('#seg-br button').forEach(function (b) { b.classList.remove('on'); });
        e.target.classList.add('on');
        state.bitrate = parseInt(e.target.dataset.br, 10);
    });

    function setStatus(msg, kind) {
        var s = document.getElementById('status');
        s.textContent = msg; s.hidden = !msg;
        s.className = 'status' + (kind ? ' ' + kind : '');
    }

    elRun.addEventListener('click', async function () {
        if (!state.file) return;
        elRun.disabled = true;
        elBar.hidden = false;
        var bar = elBar.firstElementChild;
        bar.style.width = '0%';
        setStatus('영상 디코딩 중…');
        try {
            var ac = new (window.AudioContext || window.webkitAudioContext)();
            var buf = await state.file.arrayBuffer();
            var audio = await ac.decodeAudioData(buf);
            ac.close && ac.close();

            var startSec = parseFloat(document.getElementById('start').value) || 0;
            var endSec = parseFloat(document.getElementById('end').value) || 0;
            var sr = audio.sampleRate;
            var startSample = Math.max(0, Math.floor(startSec * sr));
            var endSample = endSec > 0 ? Math.min(audio.length, Math.floor(endSec * sr)) : audio.length;
            if (endSample <= startSample) throw new Error('구간이 잘못되었습니다.');

            var channels = Math.min(2, audio.numberOfChannels);
            var left = audio.getChannelData(0).subarray(startSample, endSample);
            var right = audio.numberOfChannels > 1
                ? audio.getChannelData(1).subarray(startSample, endSample)
                : left;

            setStatus('MP3 인코딩 중…');
            var mp3enc = new lamejs.Mp3Encoder(channels, sr, state.bitrate);
            var BLOCK = 1152;
            var mp3Data = [];
            var l16 = new Int16Array(left.length);
            var r16 = new Int16Array(left.length);
            for (var i = 0; i < left.length; i++) {
                l16[i] = Math.max(-32768, Math.min(32767, left[i] * 32767));
                r16[i] = Math.max(-32768, Math.min(32767, right[i] * 32767));
            }

            for (var p = 0; p < l16.length; p += BLOCK) {
                var lc = l16.subarray(p, p + BLOCK);
                var enc = channels === 1
                    ? mp3enc.encodeBuffer(lc)
                    : mp3enc.encodeBuffer(lc, r16.subarray(p, p + BLOCK));
                if (enc.length > 0) mp3Data.push(enc);
                if (p % (BLOCK * 50) === 0) {
                    bar.style.width = (p / l16.length * 100) + '%';
                    await new Promise(function (r) { setTimeout(r, 0); });
                }
            }
            var endBuf = mp3enc.flush();
            if (endBuf.length > 0) mp3Data.push(endBuf);
            bar.style.width = '100%';

            var blob = new Blob(mp3Data, { type: 'audio/mp3' });
            LD.download(blob, state.file.name.replace(/\.[^.]+$/, '') + '.mp3');
            setStatus('완료 · ' + LD.formatBytes(blob.size), 'ok');
        } catch (e) {
            console.error(e);
            setStatus('오류: ' + e.message, 'err');
        }
        elRun.disabled = false;
    });
})();
</script>
  <script src="/count.js" defer></script>
</body>
</html>
