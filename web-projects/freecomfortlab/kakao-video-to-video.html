<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F5">
<meta name="description" content="카카오톡 영상의 파일명·메타데이터를 정리하는 도구. 브라우저에서 처리.">
<title>카카오 영상 정리 — FreeComfortLab</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2824624880449066" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../../assets/css/claude-design.css">
<style>
    .app-hero { padding: var(--space-7) 0 var(--space-5); text-align: center; }
    .workbench { display: grid; grid-template-columns: 1fr; gap: var(--space-5); }
    @media (min-width: 920px) { .workbench { grid-template-columns: 1.6fr 1fr; align-items: start; } }
    .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-5); }
    .panel h3 { font-size: 1rem; font-weight: 600; margin: 0 0 var(--space-3); }
    .file-list { list-style: none; padding: 0; margin: var(--space-4) 0 0; display: flex; flex-direction: column; gap: var(--space-2); }
    .file-item { display: flex; gap: var(--space-3); align-items: center; padding: var(--space-3); background: var(--bg-sunken); border-radius: var(--radius-md); }
    .file-item .ico { width: 36px; height: 36px; background: var(--accent-soft); color: var(--accent-deep); border-radius: var(--radius-sm); display: grid; place-items: center; }
    .file-item .body { flex: 1; min-width: 0; }
    .file-item .name { font-size: 0.92rem; font-weight: 500; word-break: break-all; }
    .file-item .new { font-size: 0.85rem; color: var(--accent); margin-top: 4px; }
    .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--space-4); }
    .status { font-size: 0.86rem; margin-top: var(--space-3); padding: var(--space-3); background: var(--bg-sunken); border-radius: var(--radius-md); font-family: var(--font-mono); }
    .status.ok { background: rgba(107,142,107,.12); color: #3F5C3F; }
    .help { font-size: 0.8rem; color: var(--text-muted); margin-top: var(--space-2); }
</style>
</head>
<body>
<nav class="nav">
    <div class="nav-inner">
        <a href="/" class="nav-brand"><span class="nav-brand-mark">L</span><span>LeDeuxions</span></a>
        <button class="nav-toggle" data-nav-toggle aria-label="메뉴"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div class="nav-links" data-nav-menu>
            <a href="/" class="nav-link" data-nav-link>홈</a>
            <a href="/web-projects/" class="nav-link" data-nav-link>웹 도구</a>
            <a href="./" class="nav-link active">FreeComfortLab</a>
        </div>
    </div>
</nav>
<header class="app-hero container-narrow">
    <div class="eyebrow" style="margin-bottom:12px;">Kakao Video Cleanup</div>
    <h1>카카오 영상 <em style="color:var(--accent);font-style:italic;">정리</em></h1>
    <p class="lead">암호 같은 카카오톡 영상 파일명을 보기 좋게 일괄 변경합니다.</p>
</header>
<main class="container" style="padding-bottom:var(--space-9);">
<div class="workbench">
    <div>
        <div class="dropzone" id="drop">
            <div class="dropzone-icon">📹</div>
            <div class="dropzone-text">
                <strong>카카오톡 영상을 끌어 놓으세요</strong><br>
                <small>여러 개 한 번에 가능</small>
            </div>
            <input type="file" id="files" multiple accept="video/*" hidden>
        </div>
        <ul class="file-list" id="list"></ul>
    </div>
    <div class="panel">
        <h3>새 파일명 규칙</h3>
        <div class="form-row">
            <label class="label">접두사</label>
            <input class="input" id="prefix" value="kakao_">
        </div>
        <div class="form-row">
            <label class="label">번호 시작</label>
            <input class="input" id="start" type="number" min="1" value="1">
        </div>
        <div class="form-row">
            <label class="label">자릿수</label>
            <select class="select" id="pad">
                <option value="2">2자리 (01)</option>
                <option value="3" selected>3자리 (001)</option>
                <option value="4">4자리 (0001)</option>
            </select>
        </div>
        <button class="btn btn-primary btn-block" id="run" disabled>이름을 바꿔서 모두 저장</button>
        <div class="status" id="status" hidden></div>
        <p class="help">파일 내용은 변경되지 않습니다. 이름만 바꿔 다시 다운로드합니다.</p>
    </div>
</div>
</main>
<footer class="site-footer">
    <div class="site-footer-inner">
        <div class="site-footer-bottom">
            <span>© 2005–2026 LeDeuxions.</span>
            <span><a href="./">← 미디어 도구</a></span>
        </div>
    </div>
</footer>
<script src="../../assets/js/common.js"></script>
<script>
(function () {
    'use strict';
    var items = [];
    var elDrop = document.getElementById('drop');
    var elInput = document.getElementById('files');
    var elList = document.getElementById('list');
    var elRun = document.getElementById('run');

    elDrop.addEventListener('click', function () { elInput.click(); });
    elDrop.addEventListener('dragover', function (e) { e.preventDefault(); elDrop.classList.add('is-active'); });
    elDrop.addEventListener('dragleave', function () { elDrop.classList.remove('is-active'); });
    elDrop.addEventListener('drop', function (e) {
        e.preventDefault(); elDrop.classList.remove('is-active');
        add(Array.from(e.dataTransfer.files));
    });
    elInput.addEventListener('change', function () { add(Array.from(elInput.files)); });

    function add(files) {
        files.forEach(function (f) { if (/^video\//.test(f.type)) items.push(f); });
        render();
    }

    function newName(i) {
        var prefix = document.getElementById('prefix').value || '';
        var start = parseInt(document.getElementById('start').value, 10) || 1;
        var pad = parseInt(document.getElementById('pad').value, 10);
        var num = String(start + i).padStart(pad, '0');
        var ext = items[i].name.split('.').pop();
        return prefix + num + '.' + ext;
    }

    function render() {
        elList.innerHTML = '';
        items.forEach(function (f, i) {
            var li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = '<div class="ico">📹</div><div class="body"><div class="name"></div><div class="new"></div></div>';
            li.querySelector('.name').textContent = f.name;
            li.querySelector('.new').textContent = '→ ' + newName(i);
            elList.appendChild(li);
        });
        elRun.disabled = items.length === 0;
    }
    ['prefix','start','pad'].forEach(function (id) {
        document.getElementById(id).addEventListener('input', render);
    });

    elRun.addEventListener('click', function () {
        items.forEach(function (f, i) {
            setTimeout(function () { LD.download(f, newName(i)); }, i * 200);
        });
        var s = document.getElementById('status');
        s.hidden = false; s.textContent = items.length + '개 파일 다운로드 시작'; s.className = 'status ok';
    });
})();
</script>
</body>
</html>
