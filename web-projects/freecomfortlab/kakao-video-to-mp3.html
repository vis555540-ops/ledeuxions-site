<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>카카오톡 영상 MP3 변환 - FreeComfortLab</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #333;
      --accent: #8e44ad;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      margin: 0; padding: 20px;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 40px;
      width: 100%; max-width: 520px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 24px; color: #2c3e50; }
    p { margin-bottom: 30px; color: #666; font-size: 15px; line-height: 1.6; }
    .upload-box {
      border: 2px dashed #d1d5db; border-radius: 16px; padding: 32px;
      margin-bottom: 24px; cursor: pointer; transition: 0.2s;
      background: #f9fafb;
    }
    .upload-box:hover { border-color: var(--accent); background: #f3e8ff; }
    .btn {
      background: var(--accent); color: white; border: none;
      padding: 16px; width: 100%; border-radius: 12px;
      font-size: 16px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(142, 68, 173, 0.3);
      transition: 0.2s;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(142, 68, 173, 0.4); }
    .home-link { margin-top: 20px; display: inline-block; color: #666; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 40px; margin-bottom: 10px;">🎵</div>
    <h1>카톡 영상 소리 추출</h1>
    <p>카카오톡에서 저장한 영상 파일을 선택하면<br>즉시 고음질 MP3로 변환해 드립니다.</p>
    
    <div class="upload-box" onclick="document.getElementById('file').click()">
      <span style="font-size: 24px;">📂</span><br>
      <span style="display:block; margin-top:8px; color:#555;">여기를 클릭해서 파일 선택</span>
      <input type="file" id="file" accept="video/*" style="display:none">
    </div>

    <button class="btn">MP3로 변환하기</button>

    <!-- AdSense Ad -->
    <div style="margin: 20px 0; text-align: center;">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2824624880449066"
             crossorigin="anonymous"></script>
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-2824624880449066"
             data-ad-slot="7450540483"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>
          (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
    </div>

    <a href="index.html" class="home-link">← 실험실 메인으로</a>
  </div>
</body>
</html>
