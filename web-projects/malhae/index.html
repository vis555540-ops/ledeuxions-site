<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="canonical" href="https://ledeuxions.com/web-projects/malhae/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>말해요 — 말 대신 눌러서 소리내기 (베타)</title>
<meta name="description" content="루게릭·발화 어려운 분을 위한 의사소통 도우미. 버튼을 누르면 소리내어 말합니다. LeDeuxions.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{--pri:#1565c0;--bg:#0e1116;--card:#1b2029;--txt:#f2f4f7;--mut:#9aa4b2;--big:clamp(20px,5.5vw,30px);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overscroll-behavior:none}
  body{display:flex;flex-direction:column}
  header{padding:10px 12px;display:flex;align-items:center;gap:8px;flex:0 0 auto}
  header h1{font-size:18px;margin:0;font-weight:800}
  header .sub{font-size:11px;color:var(--mut)}
  #say{flex:1;min-height:64px;margin:6px 12px;background:#101722;border:2px solid #24405f;border-radius:14px;color:var(--txt);font-size:var(--big);padding:14px;resize:none}
  .row{display:flex;gap:8px;padding:0 12px}
  .btn{flex:1;padding:16px;border:0;border-radius:14px;font-size:var(--big);font-weight:800;color:#fff;background:var(--pri)}
  .btn.g{background:#2e7d32}.btn.r{background:#546e7a}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;flex:0 0 auto}
  .tab{white-space:nowrap;padding:10px 16px;border-radius:999px;background:var(--card);color:var(--txt);font-size:16px;font-weight:700;border:2px solid transparent}
  .tab.on{border-color:var(--pri);background:#12233a;color:#8ec5ff}
  main{flex:1;overflow-y:auto;padding:6px 12px 20px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start}
  .phrase{min-height:88px;border:0;border-radius:16px;background:var(--card);color:var(--txt);font-size:var(--big);font-weight:800;padding:12px;line-height:1.25;box-shadow:0 2px 0 #0006;transition:transform .06s}
  .phrase:active{transform:scale(.96);background:#24405f}
  .phrase.wide{grid-column:1/-1}
  /* 조이스틱 화면: 위에는 묶음 이름 + 방금 한 말만 크게 (말 칸은 아래 호 띠에) */
  main.joyv{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:4px 12px}
  .jt{font-size:clamp(30px,9vw,44px);font-weight:900;color:#8ec5ff;line-height:1.1}
  .jt small{display:block;font-size:15px;color:var(--mut);font-weight:700}
  .js{font-size:clamp(26px,8vw,40px);font-weight:900;line-height:1.15;color:#fff;word-break:keep-all}
  .js.idle{font-size:17px;font-weight:700;color:var(--mut)}
  /* 2026-10-02 형 그림 ③: 위 = 손으로 글쓰기, 아래 = 조이스틱 띠 (한 화면) */
  #pad{flex:1;min-height:0;display:none;flex-direction:column;gap:6px;padding:0 12px 6px}
  #pad.on{display:flex}
  body.padv header{display:none}
  body.padv .tabs{padding-right:66px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  #pad .top{display:flex;gap:6px;flex:0 0 auto;height:62px}
  #cand{flex:1;min-width:0;border:0;border-radius:14px;background:#12233a;color:#fff;font-size:clamp(24px,7vw,34px);font-weight:900;padding:0 12px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cand.idle{font-size:16px;font-weight:700;color:var(--mut);background:var(--card)}
  #cand:active{background:#2e7d32}
  #clr{flex:0 0 96px;border:0;border-radius:14px;background:#c62828;color:#fff;font-size:22px;font-weight:900}
  #clr:active{background:#8e0000}
  #alts{display:flex;gap:6px;flex:0 0 auto;height:40px;overflow-x:auto}
  #alts button{flex:0 0 auto;border:0;border-radius:999px;background:var(--card);color:#cfe2ff;font-size:18px;font-weight:800;padding:0 14px}
  #alts button:active{background:#2e7d32}
  #alts .big{margin-left:auto;background:#2a3340;color:#fff}
  #ink{flex:1;min-height:0;width:100%;border-radius:14px;background:#fffdf5;touch-action:none;display:block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #inkBig{position:fixed;inset:0;z-index:980;background:#fffdf5;display:none}
  #inkBig.on{display:block}
  #inkBig img{width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<header>
  <h1>🗣️ 말해요</h1>
  <span class="sub">눌러서 소리내기 · 베타</span>
</header>

<!-- 2026-09-25 형: 맨 위 타이핑 칸 뺌 (장인어른 타이핑 힘드심). 버튼 누르면 바로 말함 -->

<nav class="tabs" id="tabs"></nav>
<main id="grid"></main>
<!-- 손으로 글쓰기: 쓰고 손 떼면 0.8초 뒤 글자로 바뀜 → 글자 톡 = 말함. 안 바뀌면(인터넷 X) 쓴 그림 그대로 보여줌 -->
<section id="pad" aria-label="손으로 글쓰기">
  <div class="top"><button id="cand" class="idle" type="button">✍️ 아래에 손가락으로 쓰세요</button><button id="clr" type="button">지우기</button></div>
  <div id="alts"><button class="big" type="button" id="bigBtn">🔍 크게</button></div>
  <canvas id="ink"></canvas>
</section>
<div id="inkBig" role="dialog" aria-label="크게 보기 (누르면 닫힘)"><img alt="쓴 글씨"></div>

<!-- 2026-10-02 형 그림 ②: 아래 왼쪽 조이스틱 + 둘레 호 띠(칸=말). 위 네모 판 없앰. ⚙ 3초 = 설정 -->
<script src="joystick.js?v=12" data-gear="corner"></script>
<!-- 2026-10-02 형: 아무 데나 2초 꾹 = 긴급 알람 (빨간 화면·사이렌·「도와주세요」, 멈춤 톡으로 끔) -->
<script src="emergency.js?v=12"></script>

<script>
// ── 문구 세트 v0.1 (이음 작성: 위관로·석션·신앙 반영, 8카테고리 89문구. 나중에 서버 동기화='빌드업 통로') ──
const PHRASES = {
  "즉시": ["입안 닦아줘", "목 불편해", "아니야", "문 조금 닫아", "문 조금 열어"],   // 2026-09-25 형 요청으로 5개로 바꿈
  "몸·통증": ["머리 아파요", "목 아파요", "어깨 아파요", "허리 아파요", "다리 아파요", "배 아파요", "위관 부위 아파요", "가슴 답답해요", "숨쉬기 힘들어요", "어지러워요", "메스꺼워요", "춥다", "덥다", "열이 있는 것 같아요"],
  "위관·영양": ["영양 주입 시작해도 돼요", "영양 주입 멈춰주세요", "천천히 주입해주세요", "속이 안 편해요", "위관 위치 확인해주세요", "위관이 아파요", "가래가 있어요", "석션(가래 뽑기) 해주세요", "입 안이 마릅니다", "구강 케어 해주세요", "이 닦고 싶어요", "물 한 모금 (허용된 만큼)"],
  "돌봄·자세": ["자세 바꿔주세요", "일으켜 앉혀주세요", "눕혀주세요", "머리 좀 올려주세요", "베개 조정해주세요", "이불 덮어주세요", "이불 벗겨주세요", "몸 씻고 싶어요", "화장실 도와주세요", "기저귀 확인해주세요", "다리 저림 풀어주세요", "발 마사지 해주세요", "손발 따뜻하게 해주세요"],
  "가족·마음": ["사랑해요", "고맙습니다", "미안합니다", "손 잡고 싶어요", "옆에 있어주세요", "혼자 있고 싶어요", "이야기 나누고 싶어요", "손자 손녀 보고 싶어요", "가족 사진 보여주세요", "잠깐 눈물이 나요", "지금 힘들어요", "괜찮아요, 걱정 마세요"],
  "신앙": ["기도해주세요", "성경 읽어주세요", "찬송 듣고 싶어요", "하나님께 감사합니다", "목사님 오셨으면 좋겠어요", "함께 기도합시다"],
  "부탁·요청": ["물 좀 (허용 안에서)", "TV 켜주세요", "TV 꺼주세요", "라디오 켜주세요", "조용히 해주세요", "불 밝게", "불 어둡게", "커튼 열어주세요", "커튼 닫아주세요", "창문 열어주세요", "창문 닫아주세요", "선풍기·에어컨", "난방 켜주세요", "안경 주세요"],
  "의료·응급": ["간호사 불러주세요", "의사 선생님 불러주세요", "약 시간 됐어요", "혈압 재주세요", "산소포화도 확인", "체온 재주세요", "통증 심해요 (10점 중 8 이상)", "숨쉬기 매우 힘들어요", "지금 응급 상황 같아요", "가족한테 연락해주세요"]
};

let voice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  voice = vs.find(v=>/ko(-|_)?KR/i.test(v.lang)) || vs.find(v=>/ko/i.test(v.lang)) || null;
}
pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;
window.malhaeSpeak=t=>speak(t); // 조이스틱(joystick.js)도 같은 목소리로
function speak(t){
  if(!t.trim())return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang='ko-KR'; if(voice)u.voice=voice; u.rate=.95; u.pitch=1;
  speechSynthesis.speak(u);
}

const tabs=document.getElementById('tabs'), grid=document.getElementById('grid');
const JOY='🕹️ 조이스틱';           // 2026-10-02 형: 첫 화면 = 조이스틱. 문구 목록은 뒤 탭에 그대로
let cur=JOY, lastSaid='';
function renderTabs(){
  tabs.innerHTML='';
  [JOY,...Object.keys(PHRASES)].forEach(k=>{
    const b=document.createElement('button'); b.className='tab'+(k===cur?' on':''); b.textContent=k;
    b.onclick=()=>{cur=k;renderTabs();renderGrid();}; tabs.appendChild(b);
  });
}
function renderGrid(){
  grid.innerHTML='';
  const joyOn = cur===JOY && !!window.malhaeJoy;
  grid.classList.toggle('joyv', joyOn);
  if(window.malhaeJoy) malhaeJoy.setPage(cur===JOY);
  // 조이스틱 화면 = 위 손글씨판 + 아래 조이스틱 띠 (형 그림 ③). 묶음 이름은 띠 끝에 있음
  grid.style.display = cur===JOY ? 'none' : '';
  document.getElementById('pad').classList.toggle('on', cur===JOY);
  document.body.classList.toggle('padv', cur===JOY); // 글쓰는 칸 넓히려고 제목 줄 숨김 (⚙ 는 그대로 오른쪽 위)
  if(cur===JOY){ if(window.malhaePad) malhaePad.fit(); return; }
  PHRASES[cur].forEach(p=>{
    const b=document.createElement('button'); b.className='phrase'; b.textContent=p;
    b.onclick=()=>speak(p); // 누르면 바로 말함
    grid.appendChild(b);
  });
}
// ── 손으로 글쓰기 (2026-10-02) ──
(function(){
  const cv=document.getElementById('ink'), cx=cv.getContext('2d');
  const cand=document.getElementById('cand'), alts=document.getElementById('alts'), bigBtn=document.getElementById('bigBtn');
  const big=document.getElementById('inkBig');
  const HINT='✍️ 아래에 손가락으로 쓰세요';
  let strokes=[], cur=null, t0=0, W=0, H=0, timer=null, seq=0, ctl=null;
  function pen(){ cx.lineWidth=Math.max(7,Math.min(W,H)/32); cx.lineCap='round'; cx.lineJoin='round'; cx.strokeStyle='#111'; cx.fillStyle='#111'; }
  function redraw(){
    cx.clearRect(0,0,W,H); pen();
    strokes.forEach(s=>{ const [xs,ys]=s; cx.beginPath(); cx.moveTo(xs[0],ys[0]);
      if(xs.length===1){ cx.arc(xs[0],ys[0],cx.lineWidth/2,0,7); cx.fill(); return; }
      for(let i=1;i<xs.length;i++) cx.lineTo(xs[i],ys[i]); cx.stroke(); });
  }
  function fit(){
    const r=cv.getBoundingClientRect(); if(!r.width||!r.height) return;
    const d=window.devicePixelRatio||1, w=Math.round(r.width), h=Math.round(r.height);
    if(w===W&&h===H&&cv.width===Math.round(w*d)) return;
    // 크기 바뀌면 획을 같은 비율로 옮겨서 다시 그림 (쓴 게 안 날아감)
    if(W&&H) strokes.forEach(s=>{ s[0]=s[0].map(x=>x*w/W); s[1]=s[1].map(y=>y*h/H); });
    W=w; H=h; cv.width=Math.round(w*d); cv.height=Math.round(h*d); cx.setTransform(d,0,0,d,0,0); redraw();
  }
  function setCand(list){
    alts.querySelectorAll('.c').forEach(b=>b.remove());
    if(!list.length){ cand.textContent=HINT; cand.classList.add('idle'); return; }
    cand.textContent=list[0]; cand.classList.remove('idle');
    list.slice(1,4).forEach(t=>{ const b=document.createElement('button'); b.type='button'; b.className='c'; b.textContent=t;
      b.onclick=()=>{ speak(t); cand.textContent=t; }; alts.insertBefore(b,bigBtn); });
  }
  function clear(){ strokes=[]; cur=null; seq++; clearTimeout(timer); if(ctl)try{ctl.abort();}catch(e){} redraw(); setCand([]); }
  // 글자 알아보기: 구글 손글씨 (인터넷 필요). 안 되면 조용히 그림만
  function recog(){
    if(!strokes.length) return;
    const my=++seq; if(ctl)try{ctl.abort();}catch(e){}
    ctl=window.AbortController?new AbortController():null;
    const ink=strokes.map(s=>[s[0].map(Math.round),s[1].map(Math.round),s[2]]);
    const to=setTimeout(()=>{ if(ctl)try{ctl.abort();}catch(e){} },6000);
    fetch('https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8&itc=ko-t-i0-handwrit',{
      method:'POST', headers:{'Content-Type':'application/json'}, signal:ctl?ctl.signal:undefined,
      body:JSON.stringify({options:'enable_pre_space',requests:[{writing_guide:{writing_area_width:W,writing_area_height:H},ink,language:'ko'}]})
    }).then(r=>r.json()).then(j=>{
      clearTimeout(to); if(my!==seq) return;
      const c=(j&&j[0]==='SUCCESS'&&j[1]&&j[1][0]&&j[1][0][1])||[];
      const seen=new Set(), list=c.map(t=>String(t).trim()).filter(t=>t&&!seen.has(t)&&seen.add(t));
      setCand(list);
    }).catch(()=>{ clearTimeout(to); });
  }
  function pt(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
  function add(e){ const [x,y]=pt(e); const last=cur[0].length-1;
    pen(); cx.beginPath(); cx.moveTo(cur[0][last],cur[1][last]); cx.lineTo(x,y); cx.stroke();
    cur[0].push(x); cur[1].push(y); cur[2].push(Date.now()-t0); }
  let pid=null;
  function down(e){
    if(pid!==null) return; pid=e.pointerId; clearTimeout(timer);
    if(e.cancelable!==false) e.preventDefault();
    try{ cv.setPointerCapture(pid); }catch(_){}
    if(!strokes.length) t0=Date.now();
    const [x,y]=pt(e); cur=[[x],[y],[Date.now()-t0]]; strokes.push(cur);
    pen(); cx.beginPath(); cx.arc(x,y,cx.lineWidth/2,0,7); cx.fill();
  }
  function move(e){
    if(e.pointerId!==pid||!cur) return; if(e.cancelable) e.preventDefault();
    const evs=e.getCoalescedEvents?e.getCoalescedEvents():[]; (evs.length?evs:[e]).forEach(add);
  }
  function up(e){ if(e.pointerId!==pid) return; pid=null; cur=null; clearTimeout(timer); timer=setTimeout(recog,800); }
  if(window.PointerEvent){
    cv.addEventListener('pointerdown',down); cv.addEventListener('pointermove',move,{passive:false});
    cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  } else {
    const f=(t,ev)=>({pointerId:'t'+t.identifier,clientX:t.clientX,clientY:t.clientY,cancelable:true,preventDefault:()=>ev.preventDefault()});
    cv.addEventListener('touchstart',ev=>{ev.preventDefault();down(f(ev.changedTouches[0],ev));},{passive:false});
    cv.addEventListener('touchmove',ev=>{ev.preventDefault();[...ev.changedTouches].forEach(t=>move(f(t,ev)));},{passive:false});
    cv.addEventListener('touchend',ev=>{[...ev.changedTouches].forEach(t=>up(f(t,ev)));});
  }
  cv.addEventListener('touchstart',ev=>ev.preventDefault(),{passive:false}); // 스크롤·당겨서 새로고침 막기
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  document.getElementById('clr').addEventListener('click',clear);
  cand.addEventListener('click',()=>{ if(!cand.classList.contains('idle')) speak(cand.textContent); });
  bigBtn.addEventListener('click',()=>{ if(!strokes.length) return; big.querySelector('img').src=cv.toDataURL(); big.classList.add('on'); });
  big.addEventListener('click',()=>big.classList.remove('on'));
  addEventListener('resize',()=>requestAnimationFrame(fit));
  window.malhaePad={fit:()=>requestAnimationFrame(fit), clear, strokes:()=>strokes.length, cand:()=>cand.classList.contains('idle')?'':cand.textContent};
})();
renderTabs(); renderGrid();
addEventListener('malhaejoy-group',()=>{ lastSaid=''; if(cur===JOY) renderGrid(); });
addEventListener('malhaejoy-said',e=>{ lastSaid=e.detail.text; if(cur===JOY) renderGrid(); });

// PWA 서비스워커 (오프라인/홈화면)
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
  let reloaded=!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloaded)return; reloaded=true; location.reload(); }); }
</script>
  <script src="/count.js" defer></script>
</body>
</html>
