<!doctype html>
<html lang="ko">
<head>
<link rel="canonical" href="https://ledeuxions.com/web-projects/malhae/tok/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>한 번 톡 — 손가락 한 번으로 고르는 의사소통 | 말해요</title>
<meta name="description" content="손가락을 조금만 움직일 수 있어도 됩니다. 휴대폰이 말을 하나씩 소리로 읽어 주고, 맞는 말이 나올 때 화면 아무 데나 한 번 톡 하면 크게 말해 줍니다. 설명·설정 없이 바로 씁니다. 중환자실·병상용.">
<meta name="theme-color" content="#0B0E12">
<style>
  :root{
    --bg:#0B0E12; --panel:#141A22; --on:#E9F0F8; --muted:#93A2B5; --line:#28313D;
    --hi:#FFD23F; --hiOn:#111; --ok:#3DD68C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none}
  html,body{height:100%; margin:0}
  body{
    background:var(--bg); color:var(--on);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    display:flex; flex-direction:column; overscroll-behavior:none; touch-action:manipulation;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #bar{display:flex; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid var(--line); flex:0 0 auto}
  #bar .t{font-size:14px; color:var(--muted); font-weight:600; flex:1}
  #bar button{font:inherit; font-size:15px; color:var(--on); background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px}
  #where{font-size:18px; color:var(--muted); padding:10px 16px 0; min-height:32px}
  #list{flex:1; overflow:hidden; padding:8px 12px 12px; display:flex; flex-direction:column; gap:8px}
  .it{flex:1 1 0; min-height:0; display:flex; align-items:center; padding:0 18px; border-radius:16px;
      background:var(--panel); border:2px solid var(--line); font-weight:700; letter-spacing:-.02em;
      font-size:clamp(22px, 5.2vh, 44px); transition:background .12s}
  .it.on{background:var(--hi); color:var(--hiOn); border-color:var(--hi)}
  .it.back{color:var(--muted); font-weight:600}
  .it.back.on{color:var(--hiOn)}
  #said{position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:24px;
        background:var(--ok); color:#06210f; text-align:center; padding:24px; z-index:5}
  #said .w{font-size:clamp(44px, 12vw, 110px); font-weight:800; letter-spacing:-.03em; line-height:1.15}
  #said .s{font-size:20px; opacity:.8}
  #start{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
         background:var(--bg); z-index:6; padding:24px; text-align:center}
  #start h1{margin:0; font-size:34px}
  #start p{margin:0; font-size:19px; line-height:1.6; color:var(--muted); max-width:30em}
  #start button{font:inherit; font-size:30px; font-weight:800; padding:22px 56px; border-radius:20px; border:0; background:var(--hi); color:var(--hiOn)}
  #set{position:fixed; inset:0; display:none; background:rgba(0,0,0,.75); z-index:7; align-items:center; justify-content:center; padding:16px}
  #set .box{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px; width:min(460px,100%); display:flex; flex-direction:column; gap:16px}
  #set label{font-size:18px; display:flex; flex-direction:column; gap:8px}
  #set input[type=range]{width:100%}
  #set .row{display:flex; gap:10px}
  #set button{flex:1; font:inherit; font-size:18px; padding:12px; border-radius:12px; border:1px solid var(--line); background:#1B232E; color:var(--on)}
  .tip{font-size:15px; color:var(--muted); line-height:1.5}
</style>
</head>
<body>
<div id="bar"><span class="t">말해요 · 한 번 톡</span><button id="slow">느리게</button><button id="fast">빠르게</button><button id="gear">설정</button></div>
<div id="where"></div>
<div id="list"></div>

<div id="said"><div class="w" id="saidW"></div><div class="s">화면을 톡 하면 처음으로</div></div>

<div id="start">
  <h1>한 번 톡</h1>
  <p>휴대폰이 말을 <b>하나씩</b> 소리로 읽고 노랗게 보여 줍니다.<br>
  맞는 말이 나올 때 <b>화면 아무 데나 한 번 톡</b> 하세요.<br>
  손가락이 어려우면 눈을 깜빡여 알려 주시고, 옆 사람이 대신 톡 해 주세요.</p>
  <button id="go">시작</button>
  <p class="tip">소리가 안 나오면 휴대폰 무음을 꺼 주세요.<br>휴대폰을 못 쓰는 곳이면 → <a href="print.html" style="color:#FFD23F">종이 말판 인쇄</a></p>
</div>

<div id="set"><div class="box">
  <label>넘어가는 빠르기: <span id="spV"></span>초
    <input id="sp" type="range" min="1.5" max="6" step="0.5"></label>
  <label><span><input id="voice" type="checkbox"> 하나씩 소리로 읽기</span></label>
  <label>톡이 두 번 들어가는 것 막기: <span id="dbV"></span>초
    <input id="db" type="range" min="0.3" max="2" step="0.1"></label>
  <div class="row"><button id="close">닫기</button></div>
</div></div>

<script>
(function(){
'use strict';
// 메뉴: [보이는 말, 말할 말(없으면 같음), 하위메뉴]
var BACK = '← 처음으로';
var M = {
  '처음': [['예'],['아니요'],['아파요', null, '어디'],['몸이 불편해요', null, '몸'],['마음', null, '마음'],['사람 불러 주세요', null, '부르기'],['다시 물어봐 주세요']],
  '어디': [['머리'],['목·목구멍'],['가슴'],['배'],['등·허리'],['팔·손'],['다리·발'],['입·관(튜브)'],['잘 모르겠어요'],[BACK]],
  '몸':   [['숨이 차요'],['가래 빼 주세요'],['목말라요'],['추워요'],['더워요'],['자세 바꿔 주세요'],['화장실'],['졸려요, 쉬고 싶어요'],[BACK]],
  '마음': [['괜찮아요'],['무서워요'],['고마워요'],['사랑해요'],['가족 보고 싶어요'],['집에 가고 싶어요'],['조금 더 있어 줘요'],[BACK]],
  '부르기':[['간호사 선생님 불러 주세요'],['의사 선생님 불러 주세요'],['가족 불러 주세요'],['잠깐 기다려 주세요'],[BACK]]
};
var NAME = {'처음':'', '어디':'아파요 → 어디가?', '몸':'몸이 불편해요 →', '마음':'마음 →', '부르기':'사람 불러 주세요 →'};

var S = {sp:2.5, voice:true, db:0.6};
try{ var o = JSON.parse(localStorage.getItem('malhae_tok')||'{}'); for(var k in o) if(k in S) S[k]=o[k]; }catch(e){}
function save(){ try{ localStorage.setItem('malhae_tok', JSON.stringify(S)); }catch(e){} }

var $ = function(id){ return document.getElementById(id); };
var list = $('list'), where = $('where'), said = $('said');
var menu = '처음', idx = -1, timer = null, lastTap = 0, saidOn = false, lock = null;

var voices = [];
function loadV(){ try{ voices = speechSynthesis.getVoices().filter(function(v){ return /^ko/i.test(v.lang); }); }catch(e){} }
if (window.speechSynthesis){ loadV(); speechSynthesis.onvoiceschanged = loadV; }
function speak(t, loud){
  if (!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = loud ? 0.85 : 1.0; u.volume = 1;
    if (voices[0]) u.voice = voices[0];
    speechSynthesis.speak(u);
  }catch(e){}
}

function draw(){
  where.textContent = NAME[menu] || '';
  list.innerHTML = '';
  M[menu].forEach(function(it, i){
    var d = document.createElement('div'); d.className = 'it' + (it[0]===BACK ? ' back':'') + (i===idx ? ' on':'');
    d.textContent = it[0]; list.appendChild(d);
  });
}
function step(){
  idx = (idx + 1) % M[menu].length;
  draw();
  if (S.voice) speak(M[menu][idx][0].replace('←','').replace('·',' '), false);
  clearTimeout(timer); timer = setTimeout(step, S.sp * 1000);
}
function open(name){ menu = name; idx = -1; clearTimeout(timer); timer = setTimeout(step, 700); draw(); }
function pick(){
  if (idx < 0) return;
  var it = M[menu][idx];
  if (it[0] === BACK){ open('처음'); return; }
  if (it[2]){ speak(it[0], true); open(it[2]); return; }
  clearTimeout(timer);
  var w = (NAME[menu] && menu==='어디') ? it[0] + ' 아파요' : (it[1] || it[0]);
  $('saidW').textContent = w; said.style.display = 'flex'; saidOn = true;
  speak(w, true);
  setTimeout(function(){ speak(w, true); }, 2600);   // 한 번 더 — 옆 사람이 놓치지 않게
}
function tap(e){
  if (e.target.closest && (e.target.closest('#bar') || e.target.closest('#set') || e.target.closest('#start'))) return;
  var now = Date.now(); if (now - lastTap < S.db * 1000) return; lastTap = now;
  e.preventDefault();
  if (saidOn){ said.style.display = 'none'; saidOn = false; open('처음'); return; }
  pick();
}
document.addEventListener('pointerdown', tap, {passive:false});

function setUI(){ $('sp').value = S.sp; $('spV').textContent = S.sp; $('voice').checked = S.voice; $('db').value = S.db; $('dbV').textContent = S.db; }
$('sp').oninput = function(){ S.sp = +this.value; $('spV').textContent = S.sp; save(); };
$('db').oninput = function(){ S.db = +this.value; $('dbV').textContent = S.db; save(); };
$('voice').onchange = function(){ S.voice = this.checked; save(); };
$('gear').onclick = function(){ setUI(); $('set').style.display = 'flex'; };
$('close').onclick = function(){ $('set').style.display = 'none'; };
$('slow').onclick = function(){ S.sp = Math.min(6, S.sp + 0.5); save(); speak('느리게, ' + S.sp + '초', false); };
$('fast').onclick = function(){ S.sp = Math.max(1.5, S.sp - 0.5); save(); speak('빠르게, ' + S.sp + '초', false); };

async function wake(){ try{ if ('wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && $('start').style.display === 'none') wake(); });
$('go').onclick = function(){
  $('start').style.display = 'none';
  speak('시작합니다. 맞는 말이 나오면 톡 하세요.', false);   // 첫 소리 — 아이폰은 단추를 누를 때만 소리를 허락한다
  wake();
  setTimeout(function(){ open('처음'); }, 2600);
};
draw();
})();
</script>
</body>
</html>
